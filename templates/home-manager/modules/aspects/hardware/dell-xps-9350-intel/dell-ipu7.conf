# The IPU7 ISYS exposes 32 raw V4L2 capture nodes. They are implementation
# details for libcamera, not independent webcams, so do not publish them to
# Firefox/WebRTC.
monitor.v4l2.rules = [
  {
    matches = [
      {
        device.api = "v4l2"
        device.description = "ipu7"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]

# HM1092 is the monochrome Windows Hello sensor. libcamera's Simple pipeline
# treats its raw monochrome stream as Bayer data, so the resulting source is
# not a usable webcam. Keep it available to the direct IR capture path while
# publishing only the OV02C10 RGB camera to desktop applications.
monitor.libcamera.rules = [
  {
    matches = [
      {
        device.api = "libcamera"
        device.description = "hm1092"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
  {
    matches = [
      {
        node.nick = "hm1092"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
