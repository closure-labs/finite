# Ordinary desktops never discover provisioning media. Enabling full cloud-init
# requires deliberate administrator opt-in; it is equivalent to root execution.
# Keep this defense in addition to /etc/cloud/cloud-init.disabled.
datasource_list: [None]
users: []
disable_root: true
ssh_pwauth: false
preserve_hostname: true
network:
  config: disabled
# Fisherman consumes the complete selected disk during installation, while a
# composefs deployment does not expose / as a resizable block filesystem.
growpart:
  mode: 'off'
resize_rootfs: false
