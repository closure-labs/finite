# Finite uses an installer-created local account. NoCloud may configure that
# account, but must never create or replace users, host networking, or hostname.
datasource_list: [NoCloud, None]
users: []
disable_root: true
ssh_pwauth: false
preserve_hostname: true
network:
  config: disabled
# Fisherman consumes the complete selected disk during installation, while a
# composefs deployment does not expose / as a resizable block filesystem.
growpart:
  mode: 'off'
resize_rootfs: false
