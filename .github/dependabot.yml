version: 2
updates:
  - package-ecosystem: github-actions
    # Root discovery covers workflows; local composite actions need their own directory.
    directories:
      - /
      - /.github/actions/review-app-token
      - /.github/actions/setup-nix
      - /.github/actions/setup-cosign
      - /.github/actions/stage-native-qualification
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # GitHub-owned actions are allowed by owner; third-party actions must also
      # match a repository pattern in automation/github/repository-security.json.
      # Separate groups keep a blocked third-party bump from holding the rest.
      github-owned:
        patterns:
          - "actions/*"
          - "github/*"
      third-party:
        patterns:
          - "*"
        exclude-patterns:
          - "actions/*"
          - "github/*"
