  - homebrew-cataloger
  - java-archive-cataloger
  - java-jvm-cataloger
  - javascript-package-cataloger
  - linux-kernel-cataloger
  - nix-cataloger
  - php-composer-installed-cataloger
  - python-installed-package-cataloger
