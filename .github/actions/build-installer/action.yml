name: Build and smoke-test Purplefin installer
description: Build the single-layer installer environment, construct the ISO, and boot it with QEMU

inputs:
  cache-write:
    description: Publish matching installer layers to the trusted GHCR cache
    required: false
    default: "false"
  image-tag:
    description: Published Purplefin profile to embed
    required: false
    default: base-generic-x86_64
  image-builder:
    description: Immutable OSBuild Image Builder CLI reference
    required: false
    default: ghcr.io/osbuild/image-builder-cli@sha256:27cabea9e504a7c4a7546f287f5d60a4846c62b5a8d18c0f678d25fdc2d7975a
  token:
    description: GitHub token used for attestations and trusted cache publication
    required: true

outputs:
  iso-sha256:
    description: SHA-256 of the completed installer ISO
    value: ${{ steps.iso.outputs.sha256 }}
  payload-digest:
    description: Immutable digest of the embedded Purplefin payload
    value: ${{ steps.payload.outputs.digest }}
  payload-tag:
    description: Published Purplefin tag embedded in the installer
    value: ${{ steps.payload.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3

    - name: Materialize Flake-generated build artifacts
      shell: bash
      run: nix run .#export-artifacts -- .

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Resolve and verify installer payload
      id: payload
      env:
        COSIGN_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build-profile.yml@refs/heads/main
        GH_TOKEN: ${{ inputs.token }}
        IMAGE_REF: ghcr.io/${{ github.repository }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      shell: bash
      run: |
        started=${SECONDS}
        record_duration() {
          echo "seconds=$((SECONDS - started))" >>"${GITHUB_OUTPUT}"
        }
        trap record_duration EXIT
        install -d -m 0755 diagnostics output
        metadata="$(skopeo inspect --retry-times 3 "docker://${IMAGE_REF}:${IMAGE_TAG}")"
        digest="$(jq -er '.Digest' <<<"${metadata}")"
        profile="$(jq -er '.Labels["io.purplefin.build.profile"]' <<<"${metadata}")"
        source_revision="$(jq -er '.Labels["org.opencontainers.image.revision"]' <<<"${metadata}")"
        [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
        [[ "${source_revision}" =~ ^[0-9a-f]{40}$ ]]
        test -f "installer/config/profiles/${profile}.toml"
        payload_ref="${IMAGE_REF}@${digest}"
        payload_embed_ref="${IMAGE_REF}:${IMAGE_TAG}"
        cosign verify \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          --certificate-identity "${COSIGN_IDENTITY}" \
          "${payload_ref}" >/dev/null
        gh attestation verify "oci://${payload_ref}" \
          --repo "${GITHUB_REPOSITORY}" \
          --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/build-profile.yml" \
          --source-digest "${source_revision}"
        gh attestation verify "oci://${payload_ref}" \
          --repo "${GITHUB_REPOSITORY}" \
          --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/build-profile.yml" \
          --source-digest "${source_revision}" \
          --predicate-type https://spdx.dev/Document/v2.3
        {
          echo "digest=${digest}"
          echo "embed_ref=${payload_embed_ref}"
          echo "ref=${payload_ref}"
          echo "source_revision=${source_revision}"
          echo "tag=${IMAGE_TAG}"
        } >>"${GITHUB_OUTPUT}"

    - name: Report runner and container capacity
      shell: bash
      run: |
        {
          echo '# Runner filesystem'
          df -h /
          echo
          echo '# Root Podman storage'
          sudo podman system df
        } | tee diagnostics/runner-capacity-before.txt

    - name: Configure trusted installer build cache
      id: cache
      env:
        CACHE_WRITE: ${{ inputs.cache-write }}
        GHCR_TOKEN: ${{ inputs.token }}
        IMAGE_REF: ghcr.io/${{ github.repository }}
      shell: bash
      run: |
        cache_ref="${IMAGE_REF}-installer-cache"
        authfile="${RUNNER_TEMP}/purplefin-installer-auth.json"
        if [[ "${CACHE_WRITE}" == true ]]; then
          printf '%s' "${GHCR_TOKEN}" |
            sudo podman login \
              --authfile "${authfile}" \
              ghcr.io \
              --username "${GITHUB_ACTOR}" \
              --password-stdin
          echo "authfile=${authfile}" >>"${GITHUB_OUTPUT}"
        fi

        if skopeo list-tags "docker://${cache_ref}" >/dev/null 2>&1; then
          echo 'available=true' >>"${GITHUB_OUTPUT}"
        else
          echo 'available=false' >>"${GITHUB_OUTPUT}"
        fi
        {
          echo "ref=${cache_ref}"
          echo "write=${CACHE_WRITE}"
        } >>"${GITHUB_OUTPUT}"

    - name: Build installer environment in root container storage
      id: environment
      env:
        CACHE_AVAILABLE: ${{ steps.cache.outputs.available }}
        CACHE_REF: ${{ steps.cache.outputs.ref }}
        CACHE_WRITE: ${{ steps.cache.outputs.write }}
        IMAGE_BUILDER: ${{ inputs.image-builder }}
        PAYLOAD_EMBED_REF: ${{ steps.payload.outputs.embed_ref }}
        PAYLOAD_REF: ${{ steps.payload.outputs.ref }}
        REGISTRY_AUTH_FILE: ${{ steps.cache.outputs.authfile }}
      shell: bash
      run: |
        started=${SECONDS}
        record_duration() {
          echo "seconds=$((SECONDS - started))" >>"${GITHUB_OUTPUT}"
        }
        trap record_duration EXIT
        auth_args=()
        cache_args=(--layers)
        if [[ -n "${REGISTRY_AUTH_FILE}" ]]; then
          auth_args+=(--authfile "${REGISTRY_AUTH_FILE}")
        fi
        if [[ "${CACHE_AVAILABLE}" == true ]]; then
          cache_args+=(--cache-from "${CACHE_REF}" --cache-ttl 336h)
        fi
        if [[ "${CACHE_WRITE}" == true ]]; then
          cache_args+=(--cache-to "${CACHE_REF}")
        fi

        sudo podman pull "${auth_args[@]}" "${PAYLOAD_REF}"
        sudo podman tag "${PAYLOAD_REF}" "${PAYLOAD_EMBED_REF}"
        sudo podman build "${auth_args[@]}" "${cache_args[@]}" \
          --file installer/Containerfile \
          --pull=never \
          --build-context installer-rootfs=installer/rootfs \
          --build-arg "BASE_REF=${PAYLOAD_REF}" \
          --build-arg "INSTALLER_PAYLOAD_SOURCE_REF=${PAYLOAD_EMBED_REF}" \
          --build-arg "INSTALLER_PAYLOAD_TARGET_REF=${PAYLOAD_REF}" \
          --tag "localhost/purplefin-installer:${GITHUB_SHA}" \
          . 2>&1 | tee diagnostics/installer-environment.log
        sudo podman pull "${auth_args[@]}" "${IMAGE_BUILDER}"

    - name: Build bootc-generic-iso with Image Builder
      id: iso
      env:
        IMAGE_BUILDER: ${{ inputs.image-builder }}
        IMAGE_REF: ghcr.io/${{ github.repository }}
        IMAGE_TAG: ${{ steps.payload.outputs.tag }}
        PAYLOAD_DIGEST: ${{ steps.payload.outputs.digest }}
        PAYLOAD_EMBED_REF: ${{ steps.payload.outputs.embed_ref }}
        PAYLOAD_SOURCE_REVISION: ${{ steps.payload.outputs.source_revision }}
      shell: bash
      run: |
        started=${SECONDS}
        record_duration() {
          echo "seconds=$((SECONDS - started))" >>"${GITHUB_OUTPUT}"
        }
        trap record_duration EXIT
        sudo podman run --rm --privileged \
          --security-opt label=disable \
          --volume "${PWD}/output:/output" \
          --volume /var/lib/containers/storage:/var/lib/containers/storage \
          "${IMAGE_BUILDER}" \
          build \
            --bootc-ref "localhost/purplefin-installer:${GITHUB_SHA}" \
            --bootc-installer-payload-ref "${PAYLOAD_EMBED_REF}" \
            --bootc-default-fs ext4 \
            bootc-generic-iso 2>&1 | tee diagnostics/image-builder.log

        sudo chown -R "$(id -u):$(id -g)" output
        iso="$(find output -type f -name '*.iso' -print -quit)"
        [[ -n "${iso}" ]]
        final_iso="output/purplefin-${IMAGE_TAG}-$(<VERSION).iso"
        mv "${iso}" "${final_iso}"
        iso_sha256="$(sha256sum "${final_iso}" | cut -d' ' -f1)"
        installer_image_id="$(
          sudo podman image inspect \
            --format '{{.Id}}' \
            "localhost/purplefin-installer:${GITHUB_SHA}"
        )"
        installer_image_id="${installer_image_id#sha256:}"
        [[ "${installer_image_id}" =~ ^[0-9a-f]{64}$ ]]
        installer_image_id="sha256:${installer_image_id}"
        image_builder_digest="${IMAGE_BUILDER##*@}"
        [[ "${image_builder_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
        jq -n \
          --arg image_builder "${IMAGE_BUILDER}" \
          --arg image_builder_digest "${image_builder_digest}" \
          --arg installer_environment_image_id "${installer_image_id}" \
          --arg iso "${final_iso##*/}" \
          --arg iso_sha256 "${iso_sha256}" \
          --arg payload "${IMAGE_REF}@${PAYLOAD_DIGEST}" \
          --arg payload_digest "${PAYLOAD_DIGEST}" \
          --arg payload_sbom_predicate "https://spdx.dev/Document/v2.3" \
          --arg payload_signer_workflow "${GITHUB_REPOSITORY}/.github/workflows/build-profile.yml" \
          --arg payload_source_revision "${PAYLOAD_SOURCE_REVISION}" \
          --arg source_commit "${GITHUB_SHA}" \
          --arg source_repository "${GITHUB_REPOSITORY}" \
          --arg version "$(<VERSION)" \
          '{
            schema_version: 1,
            source: {repository: $source_repository, commit: $source_commit},
            version: $version,
            iso: {name: $iso, sha256: $iso_sha256},
            installer_environment: {image_id: $installer_environment_image_id},
            image_builder: {reference: $image_builder, digest: $image_builder_digest},
            payload: {
              reference: $payload,
              digest: $payload_digest,
              source_revision: $payload_source_revision,
              sbom: {
                predicate_type: $payload_sbom_predicate,
                signer_workflow: $payload_signer_workflow
              }
            }
          }' >output/installer-manifest.json
        sha256sum "${final_iso}" output/installer-manifest.json >output/SHA256SUMS
        {
          echo "image_id=${installer_image_id}"
          echo "iso=${final_iso}"
          echo "sha256=${iso_sha256}"
        } >>"${GITHUB_OUTPUT}"

    - name: Smoke-boot installer with QEMU
      id: smoke
      shell: bash
      run: |
        started=${SECONDS}
        record_duration() {
          echo "seconds=$((SECONDS - started))" >>"${GITHUB_OUTPUT}"
        }
        trap record_duration EXIT
        iso="$(find output -maxdepth 1 -type f -name '*.iso' -print -quit)"
        nix run .#installer-smoke -- "${iso}" 2>&1 |
          tee diagnostics/qemu-smoke.log

    - name: Collect installer diagnostics
      if: always()
      shell: bash
      run: |
        {
          echo '# Runner filesystem'
          df -h /
          echo
          echo '# Root Podman storage'
          sudo podman system df
          echo
          echo '# Root Podman images'
          sudo podman images --digests
          echo
          echo '# Installer output'
          find output -maxdepth 2 -printf '%M %u:%g %s %p\n' | sort
        } >diagnostics/runner-capacity-after.txt 2>&1 || true
        if [[ -f output/installer-manifest.json ]]; then
          cp output/installer-manifest.json diagnostics/
        fi
        if [[ -f output/SHA256SUMS ]]; then
          cp output/SHA256SUMS diagnostics/
        fi

    - name: Summarize installer validation
      if: always()
      env:
        CACHE_AVAILABLE: ${{ steps.cache.outputs.available }}
        CACHE_WRITE: ${{ steps.cache.outputs.write }}
        ENVIRONMENT_OUTCOME: ${{ steps.environment.outcome }}
        ENVIRONMENT_SECONDS: ${{ steps.environment.outputs.seconds }}
        IMAGE_BUILDER_OUTCOME: ${{ steps.iso.outcome }}
        IMAGE_BUILDER_SECONDS: ${{ steps.iso.outputs.seconds }}
        INSTALLER_IMAGE_ID: ${{ steps.iso.outputs.image_id }}
        ISO_SHA256: ${{ steps.iso.outputs.sha256 }}
        PAYLOAD_DIGEST: ${{ steps.payload.outputs.digest }}
        PAYLOAD_TAG: ${{ steps.payload.outputs.tag }}
        SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        SMOKE_SECONDS: ${{ steps.smoke.outputs.seconds }}
      shell: bash
      run: |
        {
          echo '### Installer validation'
          echo
          echo '| Property | Value |'
          echo '| --- | --- |'
          echo "| Payload tag | \`${PAYLOAD_TAG:-unresolved}\` |"
          echo "| Payload digest | \`${PAYLOAD_DIGEST:-unresolved}\` |"
          echo "| Installer image | \`${INSTALLER_IMAGE_ID:-unavailable}\` |"
          echo "| ISO SHA-256 | \`${ISO_SHA256:-unavailable}\` |"
          echo "| Registry cache available | \`${CACHE_AVAILABLE:-unknown}\` |"
          echo "| Registry cache updated | \`${CACHE_WRITE:-false}\` |"
          echo "| Environment build | \`${ENVIRONMENT_OUTCOME:-skipped}\` (${ENVIRONMENT_SECONDS:-0}s) |"
          echo "| Image Builder | \`${IMAGE_BUILDER_OUTCOME:-skipped}\` (${IMAGE_BUILDER_SECONDS:-0}s) |"
          echo "| QEMU smoke boot | \`${SMOKE_OUTCOME:-skipped}\` (${SMOKE_SECONDS:-0}s) |"
        } >>"${GITHUB_STEP_SUMMARY}"

    - name: Upload installer diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: purplefin-${{ steps.payload.outputs.tag || 'unresolved' }}-installer-diagnostics
        path: diagnostics/
        if-no-files-found: error
        retention-days: 7

    - name: Remove GHCR login
      if: always() && steps.cache.outputs.authfile != ''
      continue-on-error: true
      env:
        REGISTRY_AUTH_FILE: ${{ steps.cache.outputs.authfile }}
      shell: bash
      run: |
        sudo podman logout \
          --authfile "${REGISTRY_AUTH_FILE}" \
          ghcr.io || true
        sudo rm -f -- "${REGISTRY_AUTH_FILE}"
