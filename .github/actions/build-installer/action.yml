name: Build and smoke-test Purplefin installer
description: Run the Nix-declared installer build and boot-validation graph

inputs:
  cache-write:
    description: Publish matching installer layers to the trusted GHCR cache
    required: false
    default: "false"
  image-tag:
    description: Published Purplefin profile to embed
    required: false
    default: base-generic-x86_64
  image-builder:
    description: Immutable OSBuild Image Builder CLI reference
    required: false
    default: ghcr.io/osbuild/image-builder-cli@sha256:27cabea9e504a7c4a7546f287f5d60a4846c62b5a8d18c0f678d25fdc2d7975a
  token:
    description: GitHub token used for attestations and trusted cache publication
    required: true

outputs:
  iso-sha256:
    description: SHA-256 of the completed installer ISO
    value: ${{ steps.installer.outputs.iso-sha256 }}
  payload-digest:
    description: Immutable digest of the embedded Purplefin payload
    value: ${{ steps.installer.outputs.payload-digest }}
  payload-tag:
    description: Published Purplefin tag embedded in the installer
    value: ${{ steps.installer.outputs.payload-tag }}

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3

    - name: Run Nix-declared installer graph
      id: installer
      env:
        CACHE_WRITE: ${{ inputs.cache-write }}
        GHCR_TOKEN: ${{ inputs.token }}
        GH_TOKEN: ${{ inputs.token }}
        IMAGE_BUILDER: ${{ inputs.image-builder }}
        IMAGE_REF: ghcr.io/${{ github.repository }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      shell: bash
      run: nix run .#installer-build

    - name: Upload installer diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: purplefin-${{ steps.installer.outputs.payload-tag || 'unresolved' }}-installer-diagnostics
        path: diagnostics/
        if-no-files-found: error
        retention-days: 7
