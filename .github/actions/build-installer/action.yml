name: Build and validate Finite installer
description: Run the visible Nix-declared installer build and boot-validation phases

inputs:
  cache-write:
    description: Publish matching SquashFS seed artifacts to the trusted GHCR cache
    required: false
    default: "false"
  end-to-end:
    description: Run the bootc-installer unattended recipe and boot the resulting disk
    required: false
    default: "false"
  image-tag:
    description: Published Finite profile to install over the network
    required: false
    default: bluefin-generic
  token:
    description: GitHub token used for attestations and trusted cache publication
    required: true

outputs:
  iso-sha256:
    description: SHA-256 of the completed installer ISO
    value: ${{ steps.installer.outputs.iso-sha256 }}
  payload-digest:
    description: Immutable OCI index or image-manifest digest installed from the network
    value: ${{ steps.installer.outputs.payload-digest }}
  payload-deployment-digest:
    description: Manifest digest recorded by bootc after the installer's local OCI-layout conversion
    value: ${{ steps.boot.outputs.deployment-digest }}
  payload-ostree-checksum:
    description: OSTree deployment checksum verified across installation and first boot
    value: ${{ steps.boot.outputs.deployment-checksum }}
  payload-tag:
    description: Published Finite tag selected by the installer
    value: ${{ steps.installer.outputs.payload-tag }}
  seed-digest:
    description: Immutable digest of the reusable live-installer seed
    value: ${{ steps.installer.outputs.seed-digest }}

runs:
  using: composite
  steps:
    - name: Set up Nix and Cachix
      uses: ./.github/actions/setup-nix

    - name: Resolve installer seed cache key
      id: seed-key
      shell: bash
      run: |
        set -euo pipefail
        key="$(nix shell --accept-flake-config .#ci-installer-build \
          -c finite-installer-build cache-key)"
        [[ "${key}" =~ ^[0-9a-f]{64}$ ]]
        echo "key=${key}" >>"${GITHUB_OUTPUT}"

    - name: Restore exact installer seed artifacts
      id: seed-actions-cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ runner.temp }}/finite-installer-seed-cache
        key: finite-installer-seed-v2-${{ runner.os }}-${{ steps.seed-key.outputs.key }}

    - name: Build installer environment and ISO
      id: installer
      env:
        CACHE_WRITE: ${{ inputs.cache-write }}
        GHCR_TOKEN: ${{ inputs.token }}
        GH_TOKEN: ${{ inputs.token }}
        IMAGE_REF: ghcr.io/${{ github.repository }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        FINITE_INSTALLER_SEED_CACHE_DIR: ${{ runner.temp }}/finite-installer-seed-cache
      shell: bash
      run: >-
        nix shell --accept-flake-config .#ci-installer-build
        -c finite-installer-build

    - name: Save exact installer seed artifacts
      if: >-
        inputs.cache-write == 'true' &&
        steps.seed-actions-cache.outputs.cache-hit != 'true' &&
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch')
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ runner.temp }}/finite-installer-seed-cache
        key: ${{ steps.seed-actions-cache.outputs.cache-primary-key }}

    - name: Smoke-test installer ISO bootloader
      id: smoke
      env:
        ISO_PATH: ${{ steps.installer.outputs.iso-path }}
      shell: bash
      run: |
        set -euo pipefail
        started=${SECONDS}
        record_duration() {
          echo "seconds=$((SECONDS - started))" >>"${GITHUB_OUTPUT}"
        }
        trap record_duration EXIT
        nix shell --accept-flake-config .#ci-installer-smoke \
          -c finite-installer-smoke "${ISO_PATH}" 2>&1 |
          tee diagnostics/qemu-smoke.log

    - name: Perform unattended installation
      if: inputs.end-to-end == 'true'
      id: install
      env:
        EXPECTED_SOURCE_DIGEST: ${{ steps.installer.outputs.payload-digest }}
        ISO_PATH: ${{ steps.installer.outputs.iso-path }}
        FINITE_INSTALLER_DIAGNOSTICS_DIR: ${{ github.workspace }}/diagnostics
        STATE_ROOT: ${{ runner.temp }}/finite-installer-e2e
      shell: bash
      run: |
        set -euo pipefail
        started=${SECONDS}
        record_duration() {
          echo "seconds=$((SECONDS - started))" >>"${GITHUB_OUTPUT}"
        }
        trap record_duration EXIT
        nix shell --accept-flake-config .#ci-installer-e2e \
          -c finite-installer-e2e install \
            "${ISO_PATH}" "${STATE_ROOT}" "${EXPECTED_SOURCE_DIGEST}"

    - name: Boot and validate installed system
      if: inputs.end-to-end == 'true'
      id: boot
      env:
        FINITE_INSTALLER_DIAGNOSTICS_DIR: ${{ github.workspace }}/diagnostics
        EXPECTED_REFERENCE: ${{ steps.installer.outputs.update-reference }}
        STATE_ROOT: ${{ runner.temp }}/finite-installer-e2e
      shell: bash
      run: |
        set -euo pipefail
        started=${SECONDS}
        record_duration() {
          echo "seconds=$((SECONDS - started))" >>"${GITHUB_OUTPUT}"
        }
        trap record_duration EXIT
        nix shell --accept-flake-config .#ci-installer-e2e \
          -c finite-installer-e2e boot \
            "${STATE_ROOT}" "${EXPECTED_REFERENCE}"
        deployment_digest="$(jq -er '.status.booted.image.imageDigest' \
          "${FINITE_INSTALLER_DIAGNOSTICS_DIR}/installed-bootc-status.json")"
        deployment_checksum="$(jq -er '.status.booted.ostree.checksum' \
          "${FINITE_INSTALLER_DIAGNOSTICS_DIR}/installed-bootc-status.json")"
        echo "deployment-digest=${deployment_digest}" >>"${GITHUB_OUTPUT}"
        echo "deployment-checksum=${deployment_checksum}" >>"${GITHUB_OUTPUT}"

    - name: Summarize installer validation
      if: always()
      env:
        BOOT_OUTCOME: ${{ steps.boot.outcome }}
        BOOT_SECONDS: ${{ steps.boot.outputs.seconds }}
        BUILD_OUTCOME: ${{ steps.installer.outcome }}
        BUILD_SECONDS: ${{ steps.installer.outputs.build-seconds }}
        SEED_CACHE_HIT: ${{ steps.installer.outputs.seed-cache-hit }}
        SEED_CACHE_SOURCE: ${{ steps.installer.outputs.seed-cache-source }}
        SEED_DIGEST: ${{ steps.installer.outputs.seed-digest }}
        SEED_PUBLISHED: ${{ steps.installer.outputs.seed-published }}
        SEED_REFERENCE: ${{ steps.installer.outputs.seed-reference }}
        ENVIRONMENT_SECONDS: ${{ steps.installer.outputs.environment-seconds }}
        ISO_SECONDS: ${{ steps.installer.outputs.iso-seconds }}
        INSTALLER_INPUT: ${{ steps.installer.outputs.installer-input }}
        INSTALL_OUTCOME: ${{ steps.install.outcome }}
        INSTALL_SECONDS: ${{ steps.install.outputs.seconds }}
        ISO_SHA256: ${{ steps.installer.outputs.iso-sha256 }}
        PAYLOAD_DIGEST: ${{ steps.installer.outputs.payload-digest }}
        PAYLOAD_DEPLOYMENT_DIGEST: ${{ steps.boot.outputs.deployment-digest }}
        PAYLOAD_OSTREE_CHECKSUM: ${{ steps.boot.outputs.deployment-checksum }}
        PAYLOAD_TAG: ${{ steps.installer.outputs.payload-tag }}
        SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        SMOKE_SECONDS: ${{ steps.smoke.outputs.seconds }}
        UPDATE_REFERENCE: ${{ steps.installer.outputs.update-reference }}
      shell: bash
      run: |
        {
          echo '### Installer validation'
          echo
          echo '| Property | Value |'
          echo '| --- | --- |'
          echo "| Payload tag | \`${PAYLOAD_TAG:-unresolved}\` |"
          echo "| Payload digest | \`${PAYLOAD_DIGEST:-unresolved}\` |"
          echo "| Payload deployment digest | \`${PAYLOAD_DEPLOYMENT_DIGEST:-unresolved}\` |"
          echo "| Payload OSTree checksum | \`${PAYLOAD_OSTREE_CHECKSUM:-unresolved}\` |"
          echo "| Update origin | \`${UPDATE_REFERENCE:-unresolved}\` |"
          echo "| Installer seed input | \`${INSTALLER_INPUT:-unresolved}\` |"
          echo "| Installer seed | \`${SEED_REFERENCE:-unresolved}\` |"
          echo "| Installer seed digest | \`${SEED_DIGEST:-unresolved}\` |"
          echo "| Installer seed cache hit | \`${SEED_CACHE_HIT:-false}\` |"
          echo "| Installer seed cache source | \`${SEED_CACHE_SOURCE:-miss}\` |"
          echo "| Installer seed published | \`${SEED_PUBLISHED:-false}\` |"
          echo "| ISO SHA-256 | \`${ISO_SHA256:-unresolved}\` |"
          echo "| Build | \`${BUILD_OUTCOME:-skipped}\` (${BUILD_SECONDS:-0}s; seed ${ENVIRONMENT_SECONDS:-0}s, ISO ${ISO_SECONDS:-0}s) |"
          echo "| Smoke | \`${SMOKE_OUTCOME:-skipped}\` (${SMOKE_SECONDS:-0}s) |"
          echo "| Install | \`${INSTALL_OUTCOME:-skipped}\` (${INSTALL_SECONDS:-0}s) |"
          echo "| Installed boot | \`${BOOT_OUTCOME:-skipped}\` (${BOOT_SECONDS:-0}s) |"
        } >>"${GITHUB_STEP_SUMMARY}"

    - name: Collect installer diagnostics
      if: always()
      shell: bash
      run: |
        install -d -m 0755 diagnostics
        for log in output/qemu-*.log; do
          [[ ! -f "${log}" ]] || cp "${log}" diagnostics/
        done

    - name: Upload installer diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: finite-${{ steps.installer.outputs.payload-tag || 'unresolved' }}-installer-diagnostics
        path: diagnostics/
        if-no-files-found: warn
        retention-days: 7
