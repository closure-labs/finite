name: Set up verified Cosign with bounded download retries
description: Keep pinned Sigstore verification and allow transient downloads time to recover
inputs:
  cosign-release:
    description: Exact Cosign release accepted by the pinned upstream installer
    required: false
    default: v3.0.6
runs:
  using: composite
  steps:
    - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      env:
        CURL_HOME: ${{ github.action_path }}/download
      with:
        cosign-release: ${{ inputs.cosign-release }}
