name: Set up Nix and Finite cache
description: Install Nix with GitHub access and accept the repository's centralized cache configuration

inputs:
  cache-profile:
    description: Full checks snapshot or source downloads only (auto chooses by job)
    required: false
    default: auto
  cache-mode:
    description: baseline, optimized source experiment, or none; pilot defaults small jobs to none and keeps checks snapshots
    required: false
    default: ""
  merge-queue-token:
    description: Optional GitHub Actions secret used for trusted update pull requests
    required: false
    default: ""
  require-merge-queue-token:
    description: Fail setup when protected-branch automation has no dedicated credential
    required: false
    default: "false"
  cachix-auth-token:
    description: Optional token used only by explicit guarded Cachix pushes
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Measure runner resources
      id: resources
      shell: bash
      run: python3 scripts/ci/nix-resources.py

    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
      with:
        extra-conf: |
          max-jobs = ${{ steps.resources.outputs.max-jobs }}
          cores = ${{ steps.resources.outputs.cores }}
          eval-cores = ${{ steps.resources.outputs.eval-cores }}
          extra-experimental-features = parallel-eval
          connect-timeout = 15
          stalled-download-timeout = 60
          download-attempts = 3

    - name: Verify Determinate Nix resource settings
      shell: bash
      run: python3 scripts/ci/nix-resources.py --verify

    - name: Apply centralized public cache policy
      shell: bash
      run: python3 scripts/ci/nix-cache.py --configure

    - name: Verify public cache policy
      shell: bash
      run: python3 scripts/ci/nix-cache.py

    - name: Validate public CI options before cache selection
      shell: bash
      # This standard-library validation resolves only public bootstrap values.
      # The canonical SecretSpec export runs after restoration and realization.
      run: python3 scripts/ci/ci-options.py --github-env

    - name: Bound SQLite CLI waits for cache restore and post-job save
      if: >-
        inputs.cache-mode != 'none' &&
        (inputs.cache-mode == 'baseline' ||
         (inputs.cache-mode == '' && env.FINITE_OPTIMIZED_CACHES != 'true') ||
         inputs.cache-profile == 'checks' ||
         (inputs.cache-profile == 'auto' && github.job == 'checks'))
      shell: bash
      run: python3 scripts/ci/cache-sqlite.py

    # Small optimized jobs use public substituters without an Actions restore.
    # Keep source snapshots available for explicit measured experiments.
    - name: Restore Nix checks snapshot
      id: store-cache
      if: >-
        inputs.cache-mode != 'none' &&
        (inputs.cache-mode == 'baseline' ||
         (inputs.cache-mode == '' && env.FINITE_OPTIMIZED_CACHES != 'true') ||
         inputs.cache-profile == 'checks' ||
         (inputs.cache-profile == 'auto' && github.job == 'checks'))
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        # Tool generations change with dependencies, rather than every source commit.
        # Nix still checks each derivation's complete input identity on every run.
        primary-key: ${{ inputs.cache-mode == 'baseline' && format('nix-store-v2-{0}-{1}-{2}-{3}', runner.os, runner.arch, hashFiles('flake.lock', 'devenv.lock'), github.sha) || format('nix-checks-v3-{0}-{1}-{2}', runner.os, runner.arch, hashFiles('flake.lock', 'devenv.lock', 'lib/ci-shells.nix', 'sources/secretspec.json')) }}
        gc-max-store-size-linux: ${{ inputs.cache-mode != 'baseline' && '1G' || '' }}
        restore-prefixes-first-match: |
          ${{ inputs.cache-mode != 'baseline' && format('nix-checks-v3-{0}-{1}-', runner.os, runner.arch) || '' }}
          nix-store-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'devenv.lock') }}-
          nix-store-v2-${{ runner.os }}-${{ runner.arch }}-
          nix-store-v1-${{ runner.os }}-${{ runner.arch }}-
        save: ${{ github.job == 'checks' && github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        paths: |
          ~/.cache/nix/tarball-cache-v2
          ~/.cache/nix/gitv3
          ~/.cache/nix/fetcher-cache-v4.sqlite*
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"

    - name: Restore Nix source downloads only
      id: source-cache
      if: >-
        inputs.cache-mode == 'optimized' &&
        inputs.cache-profile != 'checks' &&
        !(inputs.cache-profile == 'auto' && github.job == 'checks')
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: nix-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'devenv.lock') }}
        restore-prefixes-first-match: nix-sources-v1-${{ runner.os }}-${{ runner.arch }}-
        nix: false
        save: ${{ github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        paths: |
          ~/.cache/nix/tarball-cache-v2
          ~/.cache/nix/gitv3
          ~/.cache/nix/fetcher-cache-v4.sqlite*
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"

    - name: Record cache selection
      shell: bash
      env:
        STORE_KEY: ${{ steps.store-cache.outputs.restored-key }}
        SOURCE_KEY: ${{ steps.source-cache.outputs.restored-key }}
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        record = {key: os.environ[key] for key in ('STORE_KEY', 'SOURCE_KEY')}
        with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as output:
            output.write('Nix cache restore: ' + json.dumps(record) + '\n')
        PY

    - name: Prepare pinned scoped SecretSpec resolver
      shell: bash
      # Only a validated locally realized public tool path enters PATH.
      run: | # zizmor: ignore[github-env]
        resolver=$(nix build --file lib/ci-tools.nix ci-secrets-run --no-link --print-out-paths)
        [[ $resolver =~ ^/nix/store/[a-z0-9]{32}-finite-ci-secrets-run$ ]]
        echo "$resolver/bin" >>"$GITHUB_PATH"

    - name: Resolve declared CI options with SecretSpec
      shell: bash
      # Public options are supplied by workflow env; composite manifests cannot
      # reference the vars context. SecretSpec validates the inherited values.
      run: >-
        finite-ci-secrets-run ci-options --
        python3 scripts/ci/ci-options.py --github-env

    - name: Prepare legacy secret mapper without credentials
      if: inputs.cachix-auth-token != '' || inputs.merge-queue-token != ''
      shell: bash
      run: | # zizmor: ignore[github-env]
        mapper=$(nix build --file lib/ci-tools.nix ci-github-actions-secrets --no-link --print-out-paths)
        [[ $mapper =~ ^/nix/store/[a-z0-9]{32}-finite-github-actions-secrets$ ]]
        echo "$mapper/bin" >>"$GITHUB_PATH"

    - name: Map declared GitHub Actions secrets
      if: inputs.cachix-auth-token != '' || inputs.merge-queue-token != ''
      env:
        GITHUB_ACTIONS_CACHIX_AUTH_TOKEN: ${{ inputs.cachix-auth-token }}
        GITHUB_ACTIONS_MERGE_QUEUE_TOKEN: ${{ inputs.merge-queue-token }}
      shell: bash
      run: finite-github-actions-secrets

    - name: Require protected-branch automation credential
      if: inputs.require-merge-queue-token == 'true'
      shell: bash
      run: |
        [[ -n "${MERGE_QUEUE_TOKEN:-}" ]] || {
          echo "::error::MERGE_QUEUE_TOKEN is required for protected-branch automation"
          exit 1
        }
