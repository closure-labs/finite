name: Set up Nix and Purplefin Cachix
description: Install Nix with GitHub access and configure the read-through Purplefin cache

inputs:
  github-token:
    description: GitHub token used by Nix to avoid anonymous API rate limits
    required: true
  merge-queue-token:
    description: Optional GitHub Actions secret used for trusted update pull requests
    required: false
    default: ""
  cachix-auth-token:
    description: Optional token used only by explicit guarded Cachix pushes
    required: false
    default: ""
  toolset:
    description: Optional Purplefin workflow toolset package to expose on PATH
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ inputs.github-token }}

    - name: Map declared GitHub Actions secrets
      if: inputs.cachix-auth-token != '' || inputs.merge-queue-token != ''
      env:
        GITHUB_ACTIONS_CACHIX_AUTH_TOKEN: ${{ inputs.cachix-auth-token }}
        GITHUB_ACTIONS_MERGE_QUEUE_TOKEN: ${{ inputs.merge-queue-token }}
      shell: bash
      run: nix run --accept-flake-config .#github-actions-secrets

    - name: Configure Purplefin Cachix
      uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
      with:
        authToken: ${{ env.CACHIX_AUTH_TOKEN }}
        name: purplefin
        skipPush: true

    - name: Install Nix-declared workflow tools
      if: inputs.toolset != ''
      env:
        PURPLEFIN_TOOLSET: ${{ inputs.toolset }}
      shell: bash
      run: |
        nix build --accept-flake-config \
          --out-link /tmp/purplefin-workflow-toolset \
          ".#${PURPLEFIN_TOOLSET}"
        echo /tmp/purplefin-workflow-toolset/bin >>"${GITHUB_PATH}"
