name: Set up Nix and Finite cache
description: Install Nix with GitHub access and accept the repository's centralized cache configuration

inputs:
  merge-queue-token:
    description: Optional GitHub Actions secret used for trusted update pull requests
    required: false
    default: ""
  require-merge-queue-token:
    description: Fail setup when protected-branch automation has no dedicated credential
    required: false
    default: "false"
  cachix-auth-token:
    description: Optional token used only by explicit guarded Cachix pushes
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      with:
        extra-conf: |
          max-jobs = 4
          cores = 1

    # Cache the fetcher's content as well as its index. Store-path metadata
    # alone cannot prevent fresh runners from downloading the same sources.
    # Separate jobs so a small maintenance cache cannot replace the full check
    # graph; restore across lock revisions to reuse unchanged immutable inputs.
    - name: Cache Nix source downloads
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cache/nix/tarball-cache-v2
          ~/.cache/nix/gitv3
          ~/.cache/nix/fetcher-cache-v4.sqlite*
        key: nix-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('flake.lock', 'devenv.lock', 'templates/home-manager/flake.lock') }}
        restore-keys: |
          nix-sources-v1-${{ runner.os }}-${{ runner.arch }}-checks-${{ hashFiles('flake.lock', 'devenv.lock', 'templates/home-manager/flake.lock') }}
          nix-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          nix-sources-v1-${{ runner.os }}-${{ runner.arch }}-checks-
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"

    - name: Map declared GitHub Actions secrets
      if: inputs.cachix-auth-token != '' || inputs.merge-queue-token != ''
      env:
        GITHUB_ACTIONS_CACHIX_AUTH_TOKEN: ${{ inputs.cachix-auth-token }}
        GITHUB_ACTIONS_MERGE_QUEUE_TOKEN: ${{ inputs.merge-queue-token }}
      shell: bash
      run: >-
        nix shell --file lib/ci-tools.nix ci-github-actions-secrets
        -c finite-github-actions-secrets

    - name: Require protected-branch automation credential
      if: inputs.require-merge-queue-token == 'true'
      shell: bash
      run: |
        [[ -n "${MERGE_QUEUE_TOKEN:-}" ]] || {
          echo "::error::MERGE_QUEUE_TOKEN is required for protected-branch automation"
          exit 1
        }
