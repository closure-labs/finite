name: Queue Dependabot updates

on:
  schedule:
    - cron: "7 10 * * *"
  workflow_dispatch:

concurrency:
  group: queue-dependabot
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  enqueue:
    name: Enable Dependabot auto-merge
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify and enqueue open Dependabot pull requests
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN || github.token }}
        shell: bash
        run: bash automation/github/queue-dependabot.sh
