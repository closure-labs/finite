name: Queue Dependabot updates

on:
  schedule:
    - cron: "7 10 * * *"
  workflow_dispatch:

concurrency:
  group: queue-dependabot
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  enqueue:
    name: Enable Dependabot auto-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix and SecretSpec
        uses: ./.github/actions/setup-nix
        with:
          merge-queue-token: ${{ secrets.MERGE_QUEUE_TOKEN }}
          require-merge-queue-token: "true"

      - name: Verify and enqueue open Dependabot pull requests
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ env.MERGE_QUEUE_TOKEN }}
        run: >-
          nix shell --accept-flake-config .#ci-queue-dependabot
          -c finite-queue-dependabot
