name: Test ISO in UEFI VM
env:
  FINITE_OPTIMIZED_CACHES: ${{ vars.FINITE_OPTIMIZED_CACHES }}
  FINITE_CACHIX_WRITER: ${{ vars.FINITE_CACHIX_WRITER }}
  FINITE_REUSE_INVENTORY: ${{ vars.FINITE_REUSE_INVENTORY }}
  FINITE_GRYPE_DB_CACHE: ${{ vars.FINITE_GRYPE_DB_CACHE }}
  FINITE_QUALIFICATION_REUSE: ${{ vars.FINITE_QUALIFICATION_REUSE }}
  FINITE_QUALIFIED_ISO_PRESERVATION: ${{ vars.FINITE_QUALIFIED_ISO_PRESERVATION }}
  FINITE_QUALIFIED_ISO_CHANNELS: ${{ vars.FINITE_QUALIFIED_ISO_CHANNELS }}
on:
  workflow_call:
    inputs:
      iso_run:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      iso_run:
        description: Successful Build installation ISO run ID
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: finite-vm-acceptance-${{ inputs.iso_run }}
  cancel-in-progress: false
jobs:
  vm:
    if: github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: "80G"
      - uses: $/.github/actions/setup-cosign
      - name: Download verified ISO artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ISO_RUN: ${{ inputs.iso_run }}
        run: |
          [[ "$ISO_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ISO_RUN" | \
            jq -e --arg repository "$GITHUB_REPOSITORY" --arg revision "$GITHUB_SHA" '
              .path == ".github/workflows/iso.yml" and .conclusion == "success" and
              .head_branch == "main" and .head_sha == $revision and
              .head_repository.full_name == $repository'
          artifact=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$ISO_RUN/artifacts?per_page=100" | \
            jq -er --arg run "$ISO_RUN" '
              [.[].artifacts[] | select(.expired == false) | .name as $name | $name |
                capture("^finite-iso-(?<channel>finite(?:-dev)?)-" + $run + "-(?<attempt>[0-9]+)$") |
                {name: $name, channel: .channel, attempt: (.attempt | tonumber)}] |
              if (map(.channel) | unique | length) == 1 then
                max_by(.attempt).name
              else
                error("Expected ISO evidence for exactly one channel")
              end')
          gh run download "$ISO_RUN" --name "$artifact" --dir .bluebuild/iso
      - name: Install VM tools
        uses: $/.github/actions/setup-nix
        with:
          cache-mode: none
      - name: Realize pinned VM tools and firmware
        uses: $/.github/actions/setup-vm-tools
      - name: Install, boot, activate Home Manager, update and roll back
        run: bash scripts/bluebuild/vm-acceptance.sh .bluebuild/iso
      - name: Save acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .bluebuild/vm-*/*.log
            .bluebuild/vm-*/*.json
          include-hidden-files: true
          retention-days: 14
