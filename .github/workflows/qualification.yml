name: Qualify candidate in Secure Boot VM
on:
  workflow_call:
    inputs:
      build_evidence:
        description: Native publication record artifact; required for production qualification
        type: string
        default: ""
      profile:
        type: string
        required: true
      channel:
        type: string
        required: true
      digest:
        type: string
        required: true
      previous:
        type: string
        default: ""
      identity:
        type: string
        required: true
      source_revision:
        type: string
        required: true
      validation_only:
        type: boolean
        default: false
      installer_compression:
        description: Diagnostic-only runtime compression; default preserves the pinned installer
        type: string
        default: default
      installer_benchmark:
        description: Diagnostic-only predeclared runner, runtime and cache cohort controls
        type: string
        default: ""
      force_qualification:
        type: boolean
        default: false
    outputs:
      evidence:
        value: ${{ jobs.functional.outputs.evidence }}
# Bootstrap public options; setup-nix resolves them through SecretSpec.
env:
  FINITE_OPTIMIZED_CACHES: ${{ vars.FINITE_OPTIMIZED_CACHES }}
  FINITE_CACHIX_WRITER: ${{ vars.FINITE_CACHIX_WRITER }}
  FINITE_REUSE_INVENTORY: ${{ vars.FINITE_REUSE_INVENTORY }}
  FINITE_GRYPE_DB_CACHE: ${{ vars.FINITE_GRYPE_DB_CACHE }}
  FINITE_QUALIFICATION_REUSE: ${{ vars.FINITE_QUALIFICATION_REUSE }}
  FINITE_QUALIFIED_ISO_PRESERVATION: ${{ vars.FINITE_QUALIFIED_ISO_PRESERVATION }}
  FINITE_QUALIFIED_ISO_CHANNELS: ${{ vars.FINITE_QUALIFIED_ISO_CHANNELS }}

permissions:
  contents: read
  packages: write
  actions: read
jobs:
  prepare:
    if: >-
      github.repository == 'closure-labs/finite' &&
      ((!inputs.validation_only && github.ref == 'refs/heads/main') ||
       (inputs.validation_only && github.event_name == 'workflow_dispatch' &&
        startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' &&
        github.workflow_ref == format('{0}/.github/workflows/benchmark-image-tools.yml@{1}', github.repository, github.ref)))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      reused: ${{ steps.reuse.outputs.reused }}
    env:
      PROFILE: ${{ inputs.profile }}
      CANDIDATE_DIGEST: ${{ inputs.digest }}
      PREVIOUS_DIGEST: ${{ inputs.previous }}
      BUILD_IDENTITY: ${{ inputs.identity }}
      SOURCE_REVISION: ${{ inputs.source_revision }}
      GH_TOKEN: ${{ github.token }}
      FINITE_VALIDATION_ONLY: ${{ inputs.validation_only }}
      FINITE_INSTALLER_COMPRESSION: ${{ inputs.installer_compression }}
      FINITE_INSTALLER_BENCHMARK: ${{ inputs.installer_benchmark }}
      QUALIFICATION_PREFIX: ${{ inputs.validation_only && 'qualification-diagnostic' || 'qualification' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate manual branch diagnostic boundary
        if: inputs.validation_only
        run: python3 scripts/bluebuild/qualification-preflight.py --revision "$GITHUB_SHA"
      - uses: $/.github/actions/setup-nix
        if: ${{ !inputs.validation_only }}
        with:
          job-profile: controller
          cache-mode: none
      - name: Validate qualification execution context
        run: python3 scripts/bluebuild/qualification-preflight.py --revision "$GITHUB_SHA"
      - name: Reject obsolete publication before reuse or VM work
        if: ${{ !inputs.validation_only }}
        env:
          IMAGE_ARTIFACT: ${{ inputs.build_evidence }}
        run: |
          set -euo pipefail
          [[ $IMAGE_ARTIFACT == "image-$PROFILE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ]]
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$IMAGE_ARTIFACT" --dir .bluebuild
          nix develop --file lib/ci-tools.nix shell --command python3 scripts/bluebuild/publication-current.py \
            --record ".bluebuild/$PROFILE-publication.json"
      - name: Check enabled exact qualification reuse
        id: reuse
        if: ${{ !inputs.validation_only && env.FINITE_QUALIFICATION_REUSE == 'true' && !inputs.force_qualification }}
        run: |
          echo "reused=false" >>"$GITHUB_OUTPUT"
          status=0
          python3 scripts/bluebuild/reuse-qualification.py --profile "$PROFILE" --output .bluebuild/reused --prepare-context || status=$?
          if [[ $status == 3 ]]; then exit 0; fi
          if [[ $status != 0 ]]; then exit "$status"; fi
          echo "reused=true" >>"$GITHUB_OUTPUT"
      - name: Save authenticated reusable qualification
        if: ${{ !inputs.validation_only && steps.reuse.outputs.reused == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-reused-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .bluebuild/reused/
          include-hidden-files: true
          retention-days: 1

  phase:
    needs: prepare
    if: needs.prepare.outputs.reused != 'true'
    strategy:
      # A controlled benchmark cannot use a partial pair. Cancel its sibling
      # instead of spending another VM round after a cohort or acceptance failure.
      fail-fast: ${{ inputs.validation_only && inputs.installer_benchmark != '' }}
      matrix:
        phase: ${{ fromJSON(inputs.previous != '' && '["fresh","upgrade"]' || '["fresh"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # Defer only functional verdicts to the REQUIRED functional aggregate job.
      FINITE_SEPARATE_FUNCTIONAL: true
      FINITE_BENCHMARK_PHASE: ${{ matrix.phase }}
      FINITE_NIX_OBSERVATION: ${{ inputs.validation_only && inputs.installer_benchmark != '' }}
      PROFILE: ${{ inputs.profile }}
      CHANNEL: ${{ inputs.channel }}
      CANDIDATE_DIGEST: ${{ inputs.digest }}
      PREVIOUS_DIGEST: ${{ inputs.previous }}
      BUILD_IDENTITY: ${{ inputs.identity }}
      SOURCE_REVISION: ${{ inputs.source_revision }}
      GH_TOKEN: ${{ github.token }}
      FINITE_VALIDATION_ONLY: ${{ inputs.validation_only }}
      FINITE_INSTALLER_COMPRESSION: ${{ inputs.installer_compression }}
      FINITE_INSTALLER_BENCHMARK: ${{ inputs.installer_benchmark }}
      QUALIFICATION_PREFIX: ${{ inputs.validation_only && 'qualification-diagnostic' || 'qualification' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate manual branch diagnostic boundary
        if: inputs.validation_only
        run: python3 scripts/bluebuild/qualification-preflight.py --revision "$GITHUB_SHA"
      - name: Validate and record predeclared benchmark controls
        id: benchmark
        if: inputs.validation_only
        run: python3 scripts/bluebuild/benchmark-controls.py --record
      - name: Verify KVM and record runner capacity
        env:
          PHASE: ${{ matrix.phase }}
        run: |
          # Record the failed probe even if permission preparation fails.
          if [[ -e /dev/kvm ]]; then sudo -n chmod a+rw /dev/kvm || true; fi
          timeout 20s python3 scripts/ci/vm-host.py --output ".bluebuild/$PROFILE-$PHASE-vm-host.json"
      - uses: $/.github/actions/setup-nix
        with:
          job-profile: vm
          cache-mode: ${{ steps.benchmark.outputs.cache-mode || 'none' }}
          cache-profile: checks
      - name: Validate qualification execution context
        run: python3 scripts/bluebuild/qualification-preflight.py --revision "$GITHUB_SHA"
      - uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: "80G"
      - uses: $/.github/actions/setup-cosign
      - name: Install qualification tools
        uses: $/.github/actions/setup-vm-tools
      - name: Qualify immutable candidate phase
        id: acceptance
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          PHASE: ${{ matrix.phase }}
          FINITE_TIMING_JOB_NAME: Publish (${{ inputs.profile }}) / qualification / phase (${{ matrix.phase }})
        run: |
          printf '%s' "$REGISTRY_TOKEN" | skopeo login --username "$REGISTRY_USER" --password-stdin ghcr.io
          printf '%s' "$REGISTRY_TOKEN" | docker login --username "$REGISTRY_USER" --password-stdin ghcr.io
          bash scripts/bluebuild/install-cli.sh
          bash scripts/bluebuild/qualify.sh "$PHASE"
      - name: Record qualification source dependency boundaries
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          PHASE: ${{ matrix.phase }}
        run: |
          mkdir -p .bluebuild
          python3 scripts/ci/qualification-dependencies.py --output ".bluebuild/$PROFILE-$PHASE-source-boundaries.json"
      - name: Record phase outcome
        if: always()
        env:
          OUTCOME: ${{ steps.acceptance.outcome }}
          PHASE: ${{ matrix.phase }}
        run: |
          mkdir -p .bluebuild
          jq -n --arg outcome "$OUTCOME" --arg phase "$PHASE" '{outcome:$outcome,phase:$phase}' >".bluebuild/$PROFILE-$PHASE-outcome.json"
          if [[ -f ".bluebuild/$PROFILE-timings.jsonl" ]]; then
            cp ".bluebuild/$PROFILE-timings.jsonl" ".bluebuild/$PROFILE-$PHASE-stages.jsonl"
          fi
          echo "Qualification $PHASE outcome: $OUTCOME" >>"$GITHUB_STEP_SUMMARY"
      - name: Save phase evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.validation_only && 'qualification-diagnostic-phase' || 'qualification-phase' }}-${{ inputs.profile }}-${{ matrix.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .bluebuild/*outcome.json
            .bluebuild/*-predecessor-reuse.json
            .bluebuild/*-source-boundaries.json
            .bluebuild/*-vm-host.json
            .bluebuild/nix-setup.json
            .bluebuild/*-benchmark.json
            .bluebuild/*qualification-context.json
            .bluebuild/*-stages.jsonl
            .bluebuild/vm*/**/*.json
            .bluebuild/vm*/**/*.log
            .bluebuild/iso-*/*.json
            .bluebuild/iso-*/SHA256SUMS
          include-hidden-files: true
          retention-days: 7
      - name: Preserve pristine qualified candidate ISO for the pilot
        if: >-
          success() && steps.acceptance.outputs.functional_passed == 'true' &&
          !inputs.validation_only && matrix.phase == 'fresh' &&
          env.FINITE_QUALIFIED_ISO_PRESERVATION == 'true' &&
          contains(format(',{0},', env.FINITE_QUALIFIED_ISO_CHANNELS), format(',{0},', inputs.channel))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finite-qualified-iso-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .bluebuild/iso-candidate/*.iso
            .bluebuild/iso-candidate/SHA256SUMS
            .bluebuild/iso-candidate/installation.json
            .bluebuild/iso-candidate/signature.json
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  functional:
    # Native producer name is a provenance wire contract used by historical
    # ISO recovery and release readers. Keep it stable while making ownership explicit.
    name: aggregate
    needs: [prepare, phase]
    if: always() && needs.prepare.result == 'success' && (needs.phase.result == 'success' || needs.prepare.outputs.reused == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      evidence: ${{ steps.outcome.outputs.evidence }}
    env:
      PROFILE: ${{ inputs.profile }}
      CANDIDATE_DIGEST: ${{ inputs.digest }}
      PREVIOUS_DIGEST: ${{ inputs.previous }}
      BUILD_IDENTITY: ${{ inputs.identity }}
      SOURCE_REVISION: ${{ inputs.source_revision }}
      GH_TOKEN: ${{ github.token }}
      FINITE_VALIDATION_ONLY: ${{ inputs.validation_only }}
      FINITE_INSTALLER_COMPRESSION: ${{ inputs.installer_compression }}
      FINITE_INSTALLER_BENCHMARK: ${{ inputs.installer_benchmark }}
      QUALIFICATION_PREFIX: ${{ inputs.validation_only && 'qualification-diagnostic' || 'qualification' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate manual branch diagnostic boundary
        if: inputs.validation_only
        run: python3 scripts/bluebuild/qualification-preflight.py --revision "$GITHUB_SHA"
      - uses: $/.github/actions/setup-nix
        if: ${{ !inputs.validation_only }}
        with:
          job-profile: controller
          cache-mode: none
      - name: Validate qualification execution context
        run: python3 scripts/bluebuild/qualification-preflight.py --revision "$GITHUB_SHA"
      - name: Collect and require every applicable qualification phase
        env:
          REUSED: ${{ needs.prepare.outputs.reused }}
        run: |
          python3 scripts/bluebuild/qualification-preflight.py --revision "$GITHUB_SHA"
          if [[ "$REUSED" == true ]]; then
            python3 scripts/bluebuild/collect-qualification.py --reused
            python3 scripts/bluebuild/reuse-qualification.py --profile "$PROFILE" --verify-reused ".bluebuild/$PROFILE-acceptance.json"
          else
            python3 scripts/bluebuild/collect-qualification.py
            python3 scripts/bluebuild/qualification-context.py aggregate
          fi
      - name: Record qualification outcome
        id: outcome
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          mkdir -p .bluebuild
          jq -n --arg outcome "$OUTCOME" '{outcome:$outcome}' >".bluebuild/$PROFILE-qualification-outcome.json"
          echo "evidence=$QUALIFICATION_PREFIX-$PROFILE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"
      - name: Save qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.validation_only && 'qualification-diagnostic' || 'qualification' }}-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .bluebuild/*acceptance.json
            .bluebuild/*outcome.json
            .bluebuild/*-vm-host.json
            .bluebuild/*-benchmark.json
            .bluebuild/*-stages.jsonl
            .bluebuild/vm*/**/*.json
            .bluebuild/vm*/**/*.log
            .bluebuild/iso-*/*.json
            .bluebuild/iso-*/SHA256SUMS
          include-hidden-files: true
          retention-days: ${{ inputs.validation_only && 14 || 90 }}

