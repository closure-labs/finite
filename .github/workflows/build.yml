name: Build Purplefin

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild every image even when its inputs are current
        required: false
        default: false
        type: boolean
      validate_only:
        description: Validate a bot branch without publishing
        required: false
        default: false
        type: boolean

concurrency:
  group: >-
    ${{ (github.event_name == 'push' || github.event_name == 'schedule' ||
    (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.validate_only)) &&
    'purplefin-publication' || format('{0}-validation-{1}', github.workflow,
    github.event.pull_request.number || github.ref) }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' ||
    (github.event_name == 'workflow_dispatch' && inputs.validate_only) }}

permissions:
  attestations: read
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: Check, classify, and plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      attestations: read
      contents: read
      packages: read
    outputs:
      base_image: ${{ steps.plan.outputs.base_image }}
      base_digest: ${{ steps.plan.outputs.base_digest }}
      base_tag: ${{ steps.plan.outputs.base_tag }}
      base_sbom_matrix: ${{ steps.plan.outputs.base_sbom_matrix }}
      candidate_shards: ${{ steps.plan.outputs.candidate_shards }}
      classification: ${{ steps.filter.outputs.classification }}
      hardware_matrix: ${{ steps.plan.outputs.hardware_matrix }}
      hardware_sbom_matrix: ${{ steps.plan.outputs.hardware_sbom_matrix }}
      lifecycle: ${{ steps.plan.outputs.lifecycle }}
      matrix: ${{ steps.plan.outputs.matrix }}
      role_matrix: ${{ steps.plan.outputs.role_matrix }}
      role_sbom_matrix: ${{ steps.plan.outputs.role_sbom_matrix }}
      root_base: ${{ steps.plan.outputs.root_base }}
      root_matrix: ${{ steps.plan.outputs.root_matrix }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: >-
            ${{ (github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' &&
            (inputs.force || !inputs.validate_only))) && 1 || 0 }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          github-token: ${{ github.token }}
          toolset: workflow-prepare
      - name: Validate repository and workflows
        env:
          PURPLEFIN_CACHE_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: nix run .#ci
      - name: Select expensive validations
        id: filter
        env:
          DEFAULT_BRANCH_REF: origin/${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_AFTER_SHA: ${{ github.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only || false }}
        run: purplefin-classify-ci "${GITHUB_OUTPUT}"
      - name: Verify and plan immutable inputs
        id: plan
        env:
          CLASSIFICATION: ${{ steps.filter.outputs.classification }}
          CHECK_PUBLICATION_TRUST: >-
            ${{ github.event_name == 'push' || github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' && !inputs.validate_only) }}
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ format('{0}/{1}', env.REGISTRY, env.IMAGE_NAME) }}
        run: purplefin-ci-plan "${GITHUB_OUTPUT}"

  build-candidate:
    name: Validate shard ${{ matrix.shard }} (${{ matrix.name }})
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group' ||
      (github.event_name == 'workflow_dispatch' && inputs.validate_only)) &&
      fromJSON(needs.prepare.outputs.lifecycle || '{}').validation.images.required == true
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.candidate_shards) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}
          toolset: workflow-validation
      - name: Validate profiles from one locked base
        env:
          IMAGE_REF: ${{ format('{0}/{1}', env.REGISTRY, env.IMAGE_NAME) }}
          PROFILE_SHARD: ${{ toJSON(matrix.profiles) }}
        run: purplefin-validate-image-shard

  installer-candidate:
    name: Validate installer
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group' ||
      (github.event_name == 'workflow_dispatch' && inputs.validate_only)) &&
      fromJSON(needs.prepare.outputs.lifecycle || '{}').validation.installer.required == true
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      attestations: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-installer
        with:
          cache-write: false
          image-tag: base-generic-x86_64
          token: ${{ github.token }}

  base-publish:
    name: Build and publish common base
    if: >-
      (github.event_name == 'push' || github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.validate_only)) &&
      fromJSON(needs.prepare.outputs.lifecycle || '{}').publication.builds.root == true
    needs: prepare
    uses: ./.github/workflows/build-profile.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.root_matrix) }}
    with:
      build-input: ${{ matrix.build_input }}
      parent-digest: ${{ matrix.upstream.digest }}
      parent-from-lock: true
      parent-image: ${{ matrix.upstream.image }}
      parent-tag: ${{ matrix.upstream.tag }}
      profile: ${{ matrix.profile }}
      reuse-existing: ${{ matrix.reuse_existing }}
      upstream-base-digest: ${{ matrix.upstream.digest }}
      upstream-source: ${{ endsWith(matrix.upstream.image, '/bluefin-dx') && 'bluefin-dx' || 'bluefin' }}
      version: ${{ needs.prepare.outputs.version }}

  hardware-publish:
    name: Build and publish ${{ matrix.profile }}
    if: >-
      always() && (github.event_name == 'push' || github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.validate_only)) &&
      needs.prepare.result == 'success' &&
      fromJSON(needs.prepare.outputs.lifecycle || '{}').publication.builds.hardware == true &&
      (needs.base-publish.result == 'success' || needs.base-publish.result == 'skipped')
    needs: [prepare, base-publish]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.hardware_matrix) }}
    uses: ./.github/workflows/build-profile.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      build-input: ${{ matrix.build_input }}
      parent-digest: ${{ matrix.parent_digest || '' }}
      parent-image: ${{ format('ghcr.io/{0}', github.repository) }}
      parent-profile: ${{ matrix.parent }}
      parent-tag: ${{ matrix.parent_tag }}
      profile: ${{ matrix.profile }}
      reuse-existing: ${{ matrix.reuse_existing }}
      upstream-base-digest: ${{ matrix.upstream.digest }}
      version: ${{ needs.prepare.outputs.version }}

  roles-publish:
    name: Build and publish ${{ matrix.profile }}
    if: >-
      always() && (github.event_name == 'push' || github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.validate_only)) &&
      needs.prepare.result == 'success' &&
      fromJSON(needs.prepare.outputs.lifecycle || '{}').publication.builds.roles == true &&
      (needs.base-publish.result == 'success' || needs.base-publish.result == 'skipped') &&
      (needs.hardware-publish.result == 'success' || needs.hardware-publish.result == 'skipped')
    needs: [prepare, base-publish, hardware-publish]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.role_matrix) }}
    uses: ./.github/workflows/build-profile.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      build-input: ${{ matrix.build_input }}
      parent-digest: ${{ matrix.parent_digest || '' }}
      parent-image: ${{ format('ghcr.io/{0}', github.repository) }}
      parent-profile: ${{ matrix.parent }}
      parent-tag: ${{ matrix.parent_tag }}
      profile: ${{ matrix.profile }}
      reuse-existing: ${{ matrix.reuse_existing }}
      upstream-base-digest: ${{ matrix.upstream.digest }}
      version: ${{ needs.prepare.outputs.version }}

  base-sbom:
    name: Attest base software bill of materials
    if: >-
      always() && (github.event_name == 'push' || github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.validate_only)) &&
      needs.prepare.result == 'success' &&
      fromJSON(needs.prepare.outputs.lifecycle || '{}').publication.sbom.base == true &&
      (needs.base-publish.result == 'success' || needs.base-publish.result == 'skipped')
    needs: [prepare, base-publish]
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.base_sbom_matrix) }}
    uses: ./.github/workflows/attest-software-bill-of-materials.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      build-input: ${{ matrix.build_input }}
      profile: ${{ matrix.profile }}
      source-digest: ${{ matrix.source_digest }}
      subject-tag: ${{ matrix.subject_tag }}
      upstream-base-digest: ${{ matrix.upstream.digest }}
      version: ${{ needs.prepare.outputs.version }}

  hardware-sbom:
    name: Attest hardware software bill of materials for ${{ matrix.profile }}
    if: >-
      always() && (github.event_name == 'push' || github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.validate_only)) &&
      needs.prepare.result == 'success' &&
      fromJSON(needs.prepare.outputs.lifecycle || '{}').publication.sbom.hardware == true &&
      (needs.hardware-publish.result == 'success' || needs.hardware-publish.result == 'skipped')
    needs: [prepare, hardware-publish]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.hardware_sbom_matrix) }}
    uses: ./.github/workflows/attest-software-bill-of-materials.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      build-input: ${{ matrix.build_input }}
      profile: ${{ matrix.profile }}
      source-digest: ${{ matrix.source_digest }}
      subject-tag: ${{ matrix.subject_tag }}
      upstream-base-digest: ${{ matrix.upstream.digest }}
      version: ${{ needs.prepare.outputs.version }}

  role-sbom:
    name: Attest role software bill of materials for ${{ matrix.profile }}
    if: >-
      always() && (github.event_name == 'push' || github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.validate_only)) &&
      needs.prepare.result == 'success' &&
      fromJSON(needs.prepare.outputs.lifecycle || '{}').publication.sbom.roles == true &&
      (needs.roles-publish.result == 'success' || needs.roles-publish.result == 'skipped')
    needs: [prepare, roles-publish]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.role_sbom_matrix) }}
    uses: ./.github/workflows/attest-software-bill-of-materials.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      build-input: ${{ matrix.build_input }}
      profile: ${{ matrix.profile }}
      source-digest: ${{ matrix.source_digest }}
      subject-tag: ${{ matrix.subject_tag }}
      upstream-base-digest: ${{ matrix.upstream.digest }}
      version: ${{ needs.prepare.outputs.version }}

  promote:
    name: Promote verified image graph
    if: >-
      always() && (github.event_name == 'push' || github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.validate_only)) &&
      needs.prepare.result == 'success' &&
      fromJSON(needs.prepare.outputs.lifecycle || '{}').publication.promote == true &&
      (needs.base-publish.result == 'success' || needs.base-publish.result == 'skipped') &&
      (needs.hardware-publish.result == 'success' || needs.hardware-publish.result == 'skipped') &&
      (needs.roles-publish.result == 'success' || needs.roles-publish.result == 'skipped') &&
      (needs.base-sbom.result == 'success' || needs.base-sbom.result == 'skipped') &&
      (needs.hardware-sbom.result == 'success' || needs.hardware-sbom.result == 'skipped') &&
      (needs.role-sbom.result == 'success' || needs.role-sbom.result == 'skipped')
    needs: [prepare, base-publish, hardware-publish, roles-publish, base-sbom, hardware-sbom, role-sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}
          toolset: workflow-publish
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          install -d -m 0700 "${HOME}/.docker"
          registry_auth_file="${HOME}/.docker/config.json"
          printf '%s' "${GH_TOKEN}" | podman login --authfile "${registry_auth_file}" ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
          echo "REGISTRY_AUTH_FILE=${registry_auth_file}" >>"${GITHUB_ENV}"
      - name: Verify and promote the complete selected graph
        env:
          BUILD_MATRIX: ${{ needs.prepare.outputs.matrix }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ format('{0}/{1}', env.REGISTRY, env.IMAGE_NAME) }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: purplefin-promote-images
      - name: Log out of GHCR
        if: always()
        run: podman logout --authfile "${REGISTRY_AUTH_FILE:-${HOME}/.docker/config.json}" ghcr.io || true

  ci-gate:
    name: CI gate
    if: always()
    needs: [prepare, build-candidate, installer-candidate, base-publish, hardware-publish, roles-publish, base-sbom, hardware-sbom, role-sbom, promote]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}
          toolset: workflow-gate
      - name: Require the complete event-appropriate build graph
        env:
          BASE_PUBLISH_RESULT: ${{ needs.base-publish.result }}
          BASE_SBOM_RESULT: ${{ needs.base-sbom.result }}
          BUILD_CANDIDATE_RESULT: ${{ needs.build-candidate.result }}
          EVENT_NAME: ${{ github.event_name }}
          HARDWARE_PUBLISH_RESULT: ${{ needs.hardware-publish.result }}
          HARDWARE_SBOM_RESULT: ${{ needs.hardware-sbom.result }}
          INSTALLER_CANDIDATE_RESULT: ${{ needs.installer-candidate.result }}
          LIFECYCLE: ${{ needs.prepare.outputs.lifecycle }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
          REF: ${{ github.ref }}
          ROLE_SBOM_RESULT: ${{ needs.role-sbom.result }}
          ROLES_PUBLISH_RESULT: ${{ needs.roles-publish.result }}
          VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only || false }}
        run: purplefin-ci-gate
