name: Build Finite
run-name: Build Finite${{ inputs.decision_request && format(' [decision:{0}]', inputs.decision_request) || '' }}

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Select one channel for complete validation/publication, or retain automatic selection
        type: choice
        default: automatic
        options: [automatic, finite, finite-dev]
      resume_run:
        description: Original trusted main build run for an existing candidate (requires target and resume_digest)
        type: string
        default: ""
      resume_digest:
        description: Exact sha256 candidate digest to requalify without rebuilding
        type: string
        default: ""
      diagnostic_security:
        description: Scan the selected unpublished validation image on this branch; no release clearance
        type: boolean
        default: false
      reconcile:
        description: Rebuild only channels that differ from approved image inputs
        type: boolean
        default: false
      qualify:
        description: Bypass exact qualification reuse and force fresh Secure Boot tests
        type: boolean
        default: false
      decision_request:
        description: Internal immutable maintainer-decision dispatch identity
        type: string
        default: ""

# Bootstrap public options; setup-nix resolves them through SecretSpec.
env:
  FINITE_OPTIMIZED_CACHES: ${{ vars.FINITE_OPTIMIZED_CACHES }}
  FINITE_CACHIX_WRITER: ${{ vars.FINITE_CACHIX_WRITER }}
  FINITE_REUSE_INVENTORY: ${{ vars.FINITE_REUSE_INVENTORY }}
  FINITE_GRYPE_DB_CACHE: ${{ vars.FINITE_GRYPE_DB_CACHE }}
  FINITE_QUALIFICATION_REUSE: ${{ vars.FINITE_QUALIFICATION_REUSE }}
  FINITE_QUALIFIED_ISO_PRESERVATION: ${{ vars.FINITE_QUALIFIED_ISO_PRESERVATION }}
  FINITE_QUALIFIED_ISO_CHANNELS: ${{ vars.FINITE_QUALIFIED_ISO_CHANNELS }}

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'finite-publication' || format('finite-validation-{0}-{1}', github.ref, github.event_name == 'workflow_dispatch' && inputs.diagnostic_security && inputs.target || 'all') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  vm-tools-benchmark:
    name: VM tool provisioning trial
    if: >-
      github.event_name == 'pull_request' && github.repository == 'closure-labs/finite' &&
      github.head_ref == 'perf/nix-vm-tools' &&
      github.event.pull_request.head.repo.full_name == 'closure-labs/finite'
    permissions:
      contents: read
      actions: read
    uses: $/.github/workflows/benchmark-vm-tools.yml

  repository-secrets:
    name: Repository security audit
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact incoming head as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned upstream Gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          test "$("$RUNNER_TEMP/gitleaks/gitleaks" version)" = 8.30.1
      - name: Checkout protected base scanner tools
        if: github.repository == 'closure-labs/finite'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: trusted-scanner
          fetch-depth: 1
          persist-credentials: false
      - name: Authenticate new packet finding IDs
        if: github.repository == 'closure-labs/finite'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          umask 077
          output="$RUNNER_TEMP/authenticated-finding-ids.gitleaksignore"
          : >"$output"
          expected_ref=main
          if [[ $EVENT_NAME == merge_group ]]; then expected_ref=refs/heads/main; fi
          [[ $BASE_REPOSITORY == closure-labs/finite && $BASE_REF == "$expected_ref" ]]
          [[ $BASE_SHA =~ ^[0-9a-f]{40}$ && $HEAD_SHA =~ ^[0-9a-f]{40}$ ]]
          trusted="$GITHUB_WORKSPACE/trusted-scanner"
          test "$(git -C "$trusted" rev-parse HEAD)" = "$BASE_SHA"
          helper="$trusted/scripts/ci/finding_id_packets.py"
          # Until this change is reviewed and merged, old protected bases grant
          # no new exceptions. Never fall back to a helper from PR contents.
          if [[ ! -f $helper ]]; then exit 0; fi
          if [[ -z $(git -C "$GITHUB_WORKSPACE/candidate" log --format= --name-only "$BASE_SHA..$HEAD_SHA" -- automation/decisions/security) ]]; then exit 0; fi
          mkdir -p "$RUNNER_TEMP/packet-tools"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 60 \
            https://github.com/oras-project/oras/releases/download/v1.3.4/oras_1.3.4_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/oras.tar.gz"
          echo "f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454  $RUNNER_TEMP/oras.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/oras.tar.gz" -C "$RUNNER_TEMP/packet-tools" oras
          export PATH="$RUNNER_TEMP/packet-tools:$PATH"
          if ! timeout --signal=TERM --kill-after=15s 600s python3 -I "$helper" \
            --candidate "$GITHUB_WORKSPACE/candidate" --output "$output" >/dev/null 2>&1; then
            echo '::error::New finding-ID packet authentication failed; no new exceptions granted.'
            exit 1
          fi
      - name: Scan complete introduced commit range
        if: ${{ !cancelled() }}
        working-directory: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          [[ $EVENT_NAME == pull_request || $EVENT_NAME == merge_group ]]
          [[ $BASE_SHA =~ ^[0-9a-f]{40}$ && $HEAD_SHA =~ ^[0-9a-f]{40}$ && $BASE_SHA != "$HEAD_SHA" ]]
          test "$(git rev-parse --is-shallow-repository)" = false
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null
          if [[ $EVENT_NAME == merge_group ]]; then git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; fi
          # This changes merge DIFF format, not commit traversal: side histories remain included.
          log_opts="--full-history --diff-merges=first-parent --text --no-ext-diff --no-textconv $BASE_SHA..$HEAD_SHA"
          # Only exact protected-base generated IDs receive rule/commit/path/line exceptions.
          if ! python3 -I - <<'FINDING_IDS' >/dev/null 2>&1
          # Trusted workflow code only; never import or execute code from the candidate.
          import copy
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import subprocess

          BASE = os.environ['BASE_SHA']
          HEAD = os.environ['HEAD_SHA']
          PACKET = re.compile(r'automation/decisions/security/([0-9a-f]{64})\.json')
          FIELDS = {'key', 'profile', 'component', 'advisory', 'exposure', 'severity', 'cvss',
                    'knownExploited', 'versions', 'aliases', 'fixVersions'}


          def git(*args):
              return subprocess.check_output(['git', '-c', 'core.hooksPath=/dev/null', *args],
                                             stderr=subprocess.DEVNULL)


          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('Duplicate JSON member')
                  result[key] = value
              return result


          def canonical_hash(value):
              return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':'),
                                              ensure_ascii=False, allow_nan=False).encode()).hexdigest()


          def verified_lines(raw, path):
              """Return only standalone generated-ID lines at payload.findings[].key."""
              try:
                  text = raw.decode('utf-8')
                  value = json.loads(text, object_pairs_hook=unique,
                                     parse_constant=lambda _v: (_ for _ in ()).throw(ValueError()))
                  if (not isinstance(value, dict) or set(value) != {'schema', 'kind', 'payload'}
                          or type(value['schema']) is not int or value['schema'] != 1
                          or value['kind'] != 'security-findings' or canonical_hash(value) != PACKET.fullmatch(path)[1]
                          or not isinstance(value['payload'], dict)
                          or not isinstance(value['payload'].get('findings'), list)
                          or text != json.dumps(value, indent=2, allow_nan=False) + '\n'):
                      return []
                  marked = copy.deepcopy(value)
                  identifiers = []
                  for index, finding in enumerate(value['payload']['findings']):
                      if (not isinstance(finding, dict) or set(finding) != FIELDS
                              or finding['profile'] not in ('finite', 'finite-dev')
                              or not all(isinstance(finding[k], str) and finding[k]
                                         for k in ('key', 'component', 'advisory'))
                              or not re.fullmatch('[0-9a-f]{64}', finding['key'])
                              or not (re.fullmatch(r'pkg:[a-z][a-z0-9.+-]*/[^\s?#@]+(?:[?#][^\s]+)?', finding['component'])
                                      or re.fullmatch(r'artifact:sha256:[0-9a-f]{64}:[0-9a-f]{64}', finding['component']))
                              or not re.fullmatch(r'(?:CVE-[0-9]{4}-[0-9]{4,}|GHSA-[a-z0-9-]+|GO-[0-9]{4}-[0-9]+|[A-Za-z][A-Za-z0-9_.:+-]{1,199})', finding['advisory'])
                              or not isinstance(finding['exposure'], list) or not finding['exposure']
                              or not all(isinstance(p, str) and p.startswith('/') and not p.startswith('//')
                                         and '\\' not in p and '\x00' not in p
                                         and not any(part in ('.', '..') for part in p.split('/'))
                                         and str(PurePosixPath(p)) == p for p in finding['exposure'])
                              or finding['exposure'] != sorted(set(finding['exposure']))
                              or finding['key'] != canonical_hash({k: finding[k] for k in
                                                                  ('profile', 'component', 'advisory', 'exposure')})):
                          continue
                      # Equal-length markers preserve source positions. They are inserted
                      # only at the validated JSON path, never located by field name alone.
                      marker = ('__FINITE_FINDING_ID_' + str(index)).ljust(64, '_')
                      if len(marker) != 64 or marker in text:
                          return []
                      marked['payload']['findings'][index]['key'] = marker
                      identifiers.append((finding['key'], marker))
                  rendered = json.dumps(marked, indent=2, allow_nan=False) + '\n'
                  result = []
                  for key, marker in identifiers:
                      quoted = json.dumps(marker)
                      if rendered.count(quoted) != 1:
                          return []
                      offset = rendered.index(quoted)
                      if text[offset:offset + 66] != json.dumps(key):
                          return []
                      line = text.count('\n', 0, offset) + 1
                      # Fingerprint ignores are line-scoped. Never suppress another match
                      # sharing a line, including minified or adjacent credential fields.
                      if re.fullmatch(r'        "key": "' + key + r'",?', text.splitlines()[line - 1]):
                          result.append(line)
                  return result
              except (ValueError, UnicodeError, TypeError, RecursionError):
                  return []  # No exception for malformed/ambiguous packet data; scan it all.


          def blob(revision, path):
              entry = git('ls-tree', revision, '--', path).split(b'\t', 1)[0].split()
              return entry[2] if len(entry) == 3 and entry[:2] == [b'100644', b'blob'] else None


          fingerprints = set()
          trusted = {}
          # Only the protected main base of this repository can anchor exceptions.
          expected_ref = 'main' if os.environ['EVENT_NAME'] == 'pull_request' else 'refs/heads/main'
          if (os.environ.get('GITHUB_REPOSITORY') != 'closure-labs/finite'
                  or os.environ.get('BASE_REPOSITORY') != 'closure-labs/finite'
                  or os.environ.get('BASE_REF') != expected_ref):
              Path(os.environ['RUNNER_TEMP'], 'verified-finding-ids.gitleaksignore').write_text('')
              raise SystemExit(0)  # Still run the complete default scan, with no exceptions.
          for commit in git('rev-list', '--full-history', BASE + '..' + HEAD).decode().splitlines():
              parents = git('show', '-s', '--format=%P', commit).decode().split()
              if parents:
                  paths = git('diff', '--no-ext-diff', '--no-textconv', '--no-renames', '--diff-filter=AM',
                              '--name-only', '-z', parents[0], commit, '--', 'automation/decisions/security')
              else:
                  paths = git('ls-tree', '-r', '--name-only', '-z', commit, '--', 'automation/decisions/security')
              for raw_path in paths.split(b'\0'):
                  path = raw_path.decode('utf-8', errors='replace')
                  if not PACKET.fullmatch(path):
                      continue
                  if path not in trusted:
                      oid = blob(BASE, path)
                      trusted[path] = (oid, verified_lines(git('cat-file', 'blob', oid.decode()), path) if oid else [])
                  oid, lines = trusted[path]
                  # The protected event base, not candidate labels, anchors the exception.
                  # A new or modified packet gets no exceptions, even for plausible IDs.
                  if oid is not None and blob(commit, path) == oid:
                      fingerprints.update(f'{commit}:{path}:generic-api-key:{line}' for line in lines)
          Path(os.environ['RUNNER_TEMP'], 'verified-finding-ids.gitleaksignore').write_text(
              ''.join(value + '\n' for value in sorted(fingerprints)))
          FINDING_IDS
          then
            echo '::error::Unable to validate generated finding identifiers.'
            exit 1
          fi
          # Only the protected-base verifier can create this separate receipt.
          # Candidate code is never executed and Gitleaks receives no API token.
          if [[ -f $RUNNER_TEMP/authenticated-finding-ids.gitleaksignore ]]; then
            cat "$RUNNER_TEMP/authenticated-finding-ids.gitleaksignore" >> "$RUNNER_TEMP/verified-finding-ids.gitleaksignore"
          fi
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks-default.toml"
          set +e
          timeout --signal=TERM --kill-after=15s 600s "$RUNNER_TEMP/gitleaks/gitleaks" git . \
            --config "$RUNNER_TEMP/gitleaks-default.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/verified-finding-ids.gitleaksignore" --ignore-gitleaks-allow \
            --redact=100 --no-banner --log-level=error --exit-code=2 \
            --log-opts="$log_opts" >/dev/null 2>&1
          status=$?
          set -e
          if [[ $status != 0 ]]; then
            echo "::error::Gitleaks did not pass (exit $status); no findings payload is logged or uploaded."
            exit "$status"
          fi
          echo 'Pinned Gitleaks scan passed for the declared Git range.'

  impact:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: read
    outputs:
      vm: ${{ steps.vm.outputs.vm }}
      release: ${{ steps.release.outputs.ready }}
      checks: ${{ steps.release.outputs.checks || steps.target.outputs.checks || steps.reconcile.outputs.checks || steps.impact.outputs.checks }}
      nix: ${{ steps.release.outputs.nix || steps.target.outputs.nix || steps.reconcile.outputs.nix || steps.impact.outputs.nix }}
      profiles: ${{ steps.release.outputs.profiles || steps.target.outputs.profiles || steps.reconcile.outputs.profiles || steps.impact.outputs.profiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject stale governed validation trees
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          FINITE_REVIEW_BOT_LOGIN: ${{ vars.FINITE_REVIEW_BOT_LOGIN }}
        run: python3 scripts/ci/validation-preflight.py
      - name: Validate decision reconciliation request
        env:
          DECISION_REQUEST: ${{ inputs.decision_request || '' }}
        run: |
          if [[ -n $DECISION_REQUEST ]]; then
            [[ $DECISION_REQUEST =~ ^[0-9a-f]{64}$ && $GITHUB_EVENT_NAME == workflow_dispatch &&
               $GITHUB_REPOSITORY == closure-labs/finite && $GITHUB_REF == refs/heads/main ]] || {
              echo 'Invalid decision reconciliation request' >&2
              exit 2
            }
          fi
      - name: Validate manual channel selection
        id: target
        env:
          RELEASE_TARGET: ${{ inputs.target || 'automatic' }}
          RECONCILE: ${{ inputs.reconcile || false }}
          RESUME_RUN: ${{ inputs.resume_run || '' }}
          RESUME_DIGEST: ${{ inputs.resume_digest || '' }}
          DIAGNOSTIC_SECURITY: ${{ inputs.diagnostic_security || false }}
        run: python3 scripts/ci/release-selection.py
      - name: Select targeted premerge VM validation
        id: vm
        run: python3 scripts/ci/vm-selection.py
      - id: impact
        if: ${{ !inputs.reconcile && steps.target.outputs.selected != 'true' }}
        run: python3 scripts/ci/impact.py
      - uses: $/.github/actions/setup-nix
        with:
          job-profile: controller
        if: inputs.reconcile || (github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main' && github.event_name == 'push')
      # A newer pending push can replace an older image-changing push. Compare
      # public channels as well as this push diff before deciding to skip builds.
      - id: reconcile
        if: inputs.reconcile || (github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main' && github.event_name == 'push')
        env:
          IMPACT: ${{ toJSON(steps.impact.outputs) }}
        run: nix develop --file lib/ci-tools.nix shell --command python3 scripts/ci/bluefin-upstream.py reconcile

      - name: Select both images for an unpublished release version
        id: release
        if: github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main' && inputs.target != 'finite' && inputs.target != 'finite-dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/release-readiness.py --build-selection

  docs:
    name: Documentation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install documentation check tools
        run: |
          missing=()
          command -v rg >/dev/null || missing+=(ripgrep)
          command -v file >/dev/null || missing+=(file)
          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y "${missing[@]}"
          fi
      - run: |
          bash tests/repository/text-style.sh
          bash tests/repository/markdown-links.sh

  checks:
    name: Nix and runtime contracts
    needs: [impact, docs]
    if: needs.impact.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    # Allow cold evaluation to seed the Nix store cache. GitHub permits restores
    # from the same ref and base/default branches, not unrelated PR refs.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      FINITE_SOURCE_PROOF_REUSE: ${{ vars.FINITE_SOURCE_PROOF_REUSE }}
      # PR checks execute the merge checkout; native run/artifact identity names
      # the PR head. Retain both instead of misjoining their observations.
      FINITE_OBSERVATION_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      images: ${{ steps.selection.outputs.images }}
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/setup-nix
        with:
          job-profile: checks
      - name: Build checks, retrying transient fetch failures
        env:
          # Only native main pushes look up producer evidence. Keep this
          # existing read-only capability on the consuming step.
          GH_TOKEN: ${{ github.repository == 'closure-labs/finite' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.token || '' }}
        run: python3 scripts/ci/nix-checks.py
      - name: Select images from payload dependencies
        id: selection
        env:
          IMPACT: ${{ toJSON(needs.impact.outputs) }}
          VM_VALIDATION: ${{ needs.impact.outputs.vm }}
        run: nix develop --file lib/ci-tools.nix shell --command python3 scripts/ci/payloads.py

      - name: Retain Nix setup and check observations including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .bluebuild/nix-checks.json
            .bluebuild/nix-setup.json
            .bluebuild/source-reuse.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  images:
    name: Validate (${{ matrix.profile }})
    needs: [impact, docs, checks]
    # The protected merge queue runs the complete premerge OS checks once.
    # Ordinary PR updates retain the full Nix/runtime aggregate above.
    if: ${{ github.event_name != 'pull_request' && needs.checks.outputs.images == 'true' && !(github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) }}
    permissions:
      contents: read
      pull-requests: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.checks.outputs.matrix || '{"include":[]}') }}
    uses: $/.github/workflows/image.yml
    with:
      profile: ${{ matrix.profile }}
      channel: ${{ matrix.channel }}
      publish: false
      vm_validation: ${{ needs.impact.outputs.vm == 'true' }}
      diagnostic_security: ${{ inputs.diagnostic_security || false }}

  publish:
    name: Publish (${{ matrix.profile }})
    needs: [impact, docs, checks]
    if: needs.checks.outputs.images == 'true' && github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.checks.outputs.matrix || '{"include":[]}') }}
    uses: $/.github/workflows/publication.yml
    secrets:
      DECIDER_KEY: ${{ secrets.DECIDER_KEY }}
      DECIDER_CLIENT: ${{ secrets.DECIDER_CLIENT }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    with:
      profile: ${{ matrix.profile }}
      channel: ${{ matrix.channel }}
      force_qualification: ${{ inputs.qualify || needs.impact.outputs.release == 'true' }}
      resume_run: ${{ inputs.resume_run || '' }}
      resume_digest: ${{ inputs.resume_digest || '' }}

  gate:
    name: CI gate
    if: always()
    needs: [impact, docs, checks, images, publish, repository-secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NEEDS: ${{ toJSON(needs) }}
      TRUSTED_PUBLICATION: ${{ github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/ci/gate.py
