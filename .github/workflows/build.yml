name: Build Finite

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'finite-publication' || format('finite-validation-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  checks:
    name: Nix and runtime contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - run: nix build --accept-flake-config --no-link .#ci-checks

  images:
    name: Validate (${{ matrix.profile }})
    if: ${{ !(github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: bluefin-generic
            channel: bluefin-generic
          - profile: bluefin-next
            channel: next
          - profile: bluefin-dx-generic
            channel: bluefin-dx-generic
          - profile: bluefin-dx-next
            channel: dev-next
    uses: ./.github/workflows/image.yml
    with:
      profile: ${{ matrix.profile }}
      channel: ${{ matrix.channel }}
      publish: false

  publish:
    name: Publish (${{ matrix.profile }})
    if: github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: bluefin-generic
            channel: bluefin-generic
          - profile: bluefin-next
            channel: next
          - profile: bluefin-dx-generic
            channel: bluefin-dx-generic
          - profile: bluefin-dx-next
            channel: dev-next
    uses: ./.github/workflows/image.yml
    with:
      profile: ${{ matrix.profile }}
      channel: ${{ matrix.channel }}
      publish: true
    secrets:
      cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}

  gate:
    name: CI gate
    if: always()
    needs: [checks, images, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CHECKS: ${{ needs.checks.result }}
      IMAGES: ${{ needs.images.result }}
      PUBLISH: ${{ needs.publish.result }}
    steps:
      - run: |
          [[ "$CHECKS" == success ]]
          [[ ("$IMAGES" == success && "$PUBLISH" == skipped) ||
             ("$IMAGES" == skipped && "$PUBLISH" == success) ]]
