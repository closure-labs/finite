name: Build Finite
run-name: Build Finite${{ inputs.decision_request && format(' [decision:{0}]', inputs.decision_request) || '' }}

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Select one channel for complete validation/publication, or retain automatic selection
        type: choice
        default: automatic
        options: [automatic, finite, finite-dev]
      resume_run:
        description: Original trusted main build run for an existing candidate (requires target and resume_digest)
        type: string
        default: ""
      resume_digest:
        description: Exact sha256 candidate digest to requalify without rebuilding
        type: string
        default: ""
      diagnostic_security:
        description: Scan the selected unpublished validation image on this branch; no release clearance
        type: boolean
        default: false
      reconcile:
        description: Rebuild only channels that differ from approved image inputs
        type: boolean
        default: false
      qualify:
        description: Bypass exact qualification reuse and force fresh Secure Boot tests
        type: boolean
        default: false
      decision_request:
        description: Internal immutable maintainer-decision dispatch identity
        type: string
        default: ""

# Bootstrap public options; setup-nix resolves them through SecretSpec.
env:
  FINITE_OPTIMIZED_CACHES: ${{ vars.FINITE_OPTIMIZED_CACHES }}
  FINITE_CACHIX_WRITER: ${{ vars.FINITE_CACHIX_WRITER }}
  FINITE_REUSE_INVENTORY: ${{ vars.FINITE_REUSE_INVENTORY }}
  FINITE_GRYPE_DB_CACHE: ${{ vars.FINITE_GRYPE_DB_CACHE }}
  FINITE_QUALIFICATION_REUSE: ${{ vars.FINITE_QUALIFICATION_REUSE }}
  FINITE_QUALIFIED_ISO_PRESERVATION: ${{ vars.FINITE_QUALIFIED_ISO_PRESERVATION }}
  FINITE_QUALIFIED_ISO_CHANNELS: ${{ vars.FINITE_QUALIFIED_ISO_CHANNELS }}

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'finite-publication' || format('finite-validation-{0}-{1}', github.ref, github.event_name == 'workflow_dispatch' && inputs.diagnostic_security && inputs.target || 'all') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  vm-tools-benchmark:
    name: VM tool provisioning trial
    if: >-
      github.event_name == 'pull_request' && github.repository == 'closure-labs/finite' &&
      github.head_ref == 'perf/nix-vm-tools' &&
      github.event.pull_request.head.repo.full_name == 'closure-labs/finite'
    permissions:
      contents: read
      actions: read
    uses: $/.github/workflows/benchmark-vm-tools.yml

  repository-secrets:
    name: Repository security audit
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact incoming head as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned upstream Gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          test "$("$RUNNER_TEMP/gitleaks/gitleaks" version)" = 8.30.1
      - name: Scan complete introduced commit range
        working-directory: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          [[ $EVENT_NAME == pull_request || $EVENT_NAME == merge_group ]]
          [[ $BASE_SHA =~ ^[0-9a-f]{40}$ && $HEAD_SHA =~ ^[0-9a-f]{40}$ && $BASE_SHA != "$HEAD_SHA" ]]
          test "$(git rev-parse --is-shallow-repository)" = false
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null
          if [[ $EVENT_NAME == merge_group ]]; then git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; fi
          # This changes merge DIFF format, not commit traversal: side histories remain included.
          log_opts="--full-history --diff-merges=first-parent --text --no-ext-diff --no-textconv $BASE_SHA..$HEAD_SHA"
          : > "$RUNNER_TEMP/empty.gitleaksignore"
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks-default.toml"
          set +e
          timeout --signal=TERM --kill-after=15s 600s "$RUNNER_TEMP/gitleaks/gitleaks" git . \
            --config "$RUNNER_TEMP/gitleaks-default.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/empty.gitleaksignore" --ignore-gitleaks-allow \
            --redact=100 --no-banner --log-level=error --exit-code=2 \
            --log-opts="$log_opts" >/dev/null 2>&1
          status=$?
          set -e
          if [[ $status != 0 ]]; then
            echo "::error::Gitleaks did not pass (exit $status); no findings payload is logged or uploaded."
            exit "$status"
          fi
          echo 'Pinned Gitleaks scan passed for the declared Git range.'

  impact:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: read
    outputs:
      vm: ${{ steps.vm.outputs.vm }}
      release: ${{ steps.release.outputs.ready }}
      checks: ${{ steps.release.outputs.checks || steps.target.outputs.checks || steps.reconcile.outputs.checks || steps.impact.outputs.checks }}
      nix: ${{ steps.release.outputs.nix || steps.target.outputs.nix || steps.reconcile.outputs.nix || steps.impact.outputs.nix }}
      profiles: ${{ steps.release.outputs.profiles || steps.target.outputs.profiles || steps.reconcile.outputs.profiles || steps.impact.outputs.profiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject stale governed validation trees
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          FINITE_REVIEW_BOT_LOGIN: ${{ vars.FINITE_REVIEW_BOT_LOGIN }}
        run: python3 scripts/ci/validation-preflight.py
      - name: Validate decision reconciliation request
        env:
          DECISION_REQUEST: ${{ inputs.decision_request || '' }}
        run: |
          if [[ -n $DECISION_REQUEST ]]; then
            [[ $DECISION_REQUEST =~ ^[0-9a-f]{64}$ && $GITHUB_EVENT_NAME == workflow_dispatch &&
               $GITHUB_REPOSITORY == closure-labs/finite && $GITHUB_REF == refs/heads/main ]] || {
              echo 'Invalid decision reconciliation request' >&2
              exit 2
            }
          fi
      - name: Validate manual channel selection
        id: target
        env:
          RELEASE_TARGET: ${{ inputs.target || 'automatic' }}
          RECONCILE: ${{ inputs.reconcile || false }}
          RESUME_RUN: ${{ inputs.resume_run || '' }}
          RESUME_DIGEST: ${{ inputs.resume_digest || '' }}
          DIAGNOSTIC_SECURITY: ${{ inputs.diagnostic_security || false }}
        run: python3 scripts/ci/release-selection.py
      - name: Select targeted premerge VM validation
        id: vm
        run: python3 scripts/ci/vm-selection.py
      - id: impact
        if: ${{ !inputs.reconcile && steps.target.outputs.selected != 'true' }}
        run: python3 scripts/ci/impact.py
      - uses: $/.github/actions/setup-nix
        if: inputs.reconcile || (github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main' && github.event_name == 'push')
      # A newer pending push can replace an older image-changing push. Compare
      # public channels as well as this push diff before deciding to skip builds.
      - id: reconcile
        if: inputs.reconcile || (github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main' && github.event_name == 'push')
        env:
          IMPACT: ${{ toJSON(steps.impact.outputs) }}
        run: nix develop --file lib/ci-tools.nix shell --command python3 scripts/ci/bluefin-upstream.py reconcile

      - name: Select both images for an unpublished release version
        id: release
        if: github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main' && inputs.target != 'finite' && inputs.target != 'finite-dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/release-readiness.py --build-selection

  docs:
    name: Documentation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install documentation check tools
        run: |
          missing=()
          command -v rg >/dev/null || missing+=(ripgrep)
          command -v file >/dev/null || missing+=(file)
          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y "${missing[@]}"
          fi
      - run: |
          bash tests/repository/text-style.sh
          bash tests/repository/markdown-links.sh

  checks:
    name: Nix and runtime contracts
    needs: [impact, docs]
    if: needs.impact.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    # Allow cold evaluation to seed the Nix store cache. GitHub permits restores
    # from the same ref and base/default branches, not unrelated PR refs.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      FINITE_SOURCE_PROOF_REUSE: ${{ vars.FINITE_SOURCE_PROOF_REUSE }}
      # PR checks execute the merge checkout; native run/artifact identity names
      # the PR head. Retain both instead of misjoining their observations.
      FINITE_OBSERVATION_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      images: ${{ steps.selection.outputs.images }}
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/setup-nix
      - name: Build checks, retrying transient fetch failures
        env:
          # Only native main pushes look up producer evidence. Keep this
          # existing read-only capability on the consuming step.
          GH_TOKEN: ${{ github.repository == 'closure-labs/finite' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.token || '' }}
        run: python3 scripts/ci/nix-checks.py
      - name: Select images from payload dependencies
        id: selection
        env:
          IMPACT: ${{ toJSON(needs.impact.outputs) }}
          VM_VALIDATION: ${{ needs.impact.outputs.vm }}
        run: nix develop --file lib/ci-tools.nix shell --command python3 scripts/ci/payloads.py

      - name: Retain Nix setup and check observations including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .bluebuild/nix-checks.json
            .bluebuild/nix-setup.json
            .bluebuild/source-reuse.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  images:
    name: Validate (${{ matrix.profile }})
    needs: [impact, docs, checks]
    # The protected merge queue runs the complete premerge OS checks once.
    # Ordinary PR updates retain the full Nix/runtime aggregate above.
    if: ${{ github.event_name != 'pull_request' && needs.checks.outputs.images == 'true' && !(github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) }}
    permissions:
      contents: read
      pull-requests: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.checks.outputs.matrix || '{"include":[]}') }}
    uses: $/.github/workflows/image.yml
    with:
      profile: ${{ matrix.profile }}
      channel: ${{ matrix.channel }}
      publish: false
      vm_validation: ${{ needs.impact.outputs.vm == 'true' }}
      diagnostic_security: ${{ inputs.diagnostic_security || false }}

  publish:
    name: Publish (${{ matrix.profile }})
    needs: [impact, docs, checks]
    if: needs.checks.outputs.images == 'true' && github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.checks.outputs.matrix || '{"include":[]}') }}
    uses: $/.github/workflows/publication.yml
    secrets:
      DECIDER_KEY: ${{ secrets.DECIDER_KEY }}
      DECIDER_CLIENT: ${{ secrets.DECIDER_CLIENT }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    with:
      profile: ${{ matrix.profile }}
      channel: ${{ matrix.channel }}
      force_qualification: ${{ inputs.qualify || needs.impact.outputs.release == 'true' }}
      resume_run: ${{ inputs.resume_run || '' }}
      resume_digest: ${{ inputs.resume_digest || '' }}

  gate:
    name: CI gate
    if: always()
    needs: [impact, docs, checks, images, publish, repository-secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NEEDS: ${{ toJSON(needs) }}
      TRUSTED_PUBLICATION: ${{ github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/ci/gate.py
