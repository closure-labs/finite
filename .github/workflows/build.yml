name: Build Finite

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'finite-publication' || format('finite-validation-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  impact:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.impact.outputs.checks }}
      nix: ${{ steps.impact.outputs.nix }}
      profiles: ${{ steps.impact.outputs.profiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: impact
        run: python3 scripts/ci/impact.py

  docs:
    name: Documentation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install documentation check tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep file
      - run: |
          bash tests/repository/text-style.sh
          bash tests/repository/markdown-links.sh

  checks:
    name: Nix and runtime contracts
    needs: [impact, docs]
    if: needs.impact.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      images: ${{ steps.selection.outputs.images }}
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-nix
      - run: nix build --accept-flake-config --no-link .#ci-checks
      - name: Select images from payload dependencies
        id: selection
        env:
          IMPACT: ${{ toJSON(needs.impact.outputs) }}
        run: nix develop --accept-flake-config --command python3 scripts/ci/payloads.py

  images:
    name: Validate (${{ matrix.profile }})
    needs: [impact, docs, checks]
    if: ${{ needs.checks.outputs.images == 'true' && !(github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.checks.outputs.matrix || '{"include":[]}') }}
    uses: ./.github/workflows/image.yml
    with:
      profile: ${{ matrix.profile }}
      channel: ${{ matrix.channel }}
      publish: false

  publish:
    name: Publish (${{ matrix.profile }})
    needs: [impact, docs, checks]
    if: needs.checks.outputs.images == 'true' && github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.checks.outputs.matrix || '{"include":[]}') }}
    uses: ./.github/workflows/image.yml
    with:
      profile: ${{ matrix.profile }}
      channel: ${{ matrix.channel }}
      publish: true
    secrets:
      cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}

  gate:
    name: CI gate
    if: always()
    needs: [impact, docs, checks, images, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NEEDS: ${{ toJSON(needs) }}
      TRUSTED_PUBLICATION: ${{ github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/ci/gate.py
