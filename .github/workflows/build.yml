name: Build Purplefin

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild every image even when its inputs are current
        required: false
        default: false
        type: boolean
      validate_only:
        description: Validate a bot branch without publishing
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  attestations: read
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  changes:
    name: Classify expensive validations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      images: ${{ steps.filter.outputs.images }}
      installer: ${{ steps.filter.outputs.installer }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3

      - name: Select installer validation
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only || false }}
        shell: bash
        run: |
          case "${EVENT_NAME}" in
            pull_request)
              base_sha="${PULL_REQUEST_BASE_SHA}"
              head_sha="${PULL_REQUEST_HEAD_SHA}"
              ;;
            merge_group)
              base_sha="${MERGE_GROUP_BASE_SHA}"
              head_sha="${MERGE_GROUP_HEAD_SHA}"
              ;;
            workflow_dispatch)
              if [[ "${VALIDATE_ONLY}" != true ]]; then
                echo 'images=true' >>"${GITHUB_OUTPUT}"
                echo 'installer=false' >>"${GITHUB_OUTPUT}"
                exit 0
              fi
              base_sha="$(git merge-base origin/main HEAD)"
              head_sha="$(git rev-parse HEAD)"
              ;;
            push | schedule)
              echo 'images=true' >>"${GITHUB_OUTPUT}"
              echo 'installer=false' >>"${GITHUB_OUTPUT}"
              exit 0
              ;;
            *)
              echo "Unknown event ${EVENT_NAME}; requiring expensive validations" >&2
              echo 'images=true' >>"${GITHUB_OUTPUT}"
              echo 'installer=true' >>"${GITHUB_OUTPUT}"
              exit 0
              ;;
          esac

          changed_paths="${RUNNER_TEMP}/expensive-validation-changed-paths"
          if ! git diff --name-only --diff-filter=ACDMRT \
            "${base_sha}" "${head_sha}" >"${changed_paths}"; then
            echo 'Could not determine changed paths; requiring expensive validations' >&2
            echo 'images=true' >>"${GITHUB_OUTPUT}"
            echo 'installer=true' >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          {
            echo "images=$(nix run .#classify-changes -- images <"${changed_paths}")"
            echo "installer=$(nix run .#classify-changes -- installer <"${changed_paths}")"
          } >>"${GITHUB_OUTPUT}"

  check:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3

      - name: Check flake inputs
        uses: DeterminateSystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1 # v13

      - name: Validate repository and workflows
        run: nix flake check --print-build-logs

  plan:
    name: Resolve build inputs
    if: needs.changes.outputs.images == 'true'
    needs:
      - changes
      - check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      base_image: ${{ steps.plan.outputs.base_image }}
      base_digest: ${{ steps.plan.outputs.base_digest }}
      hardware_matrix: ${{ steps.plan.outputs.hardware_matrix }}
      has_hardware: ${{ steps.plan.outputs.has_hardware }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
      has_roles: ${{ steps.plan.outputs.has_roles }}
      has_root_base: ${{ steps.plan.outputs.has_root_base }}
      matrix: ${{ steps.plan.outputs.matrix }}
      role_matrix: ${{ steps.plan.outputs.role_matrix }}
      root_base: ${{ steps.plan.outputs.root_base }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3

      - name: Materialize Flake-generated build artifacts
        run: nix run .#export-artifacts -- .

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve, verify, and plan immutable inputs
        id: plan
        env:
          CHECK_RPM_UPDATES: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          IMAGE_REF: ${{ format('{0}/{1}', env.REGISTRY, env.IMAGE_NAME) }}
        shell: bash
        run: |
          base_image="$(jq -er '.image' bootc/generated/upstream.json)"
          base_tag="$(jq -er '.tag' bootc/generated/upstream.json)"
          base_metadata="$({
            skopeo inspect --retry-times 3 \
              "docker://${base_image}:${base_tag}"
          })"
          base_digest="$(jq -er '.Digest' <<<"${base_metadata}")"
          base_ref="${base_image}@${base_digest}"
          version="$(<VERSION)"

          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity \
              https://github.com/projectbluefin/actions/.github/workflows/reusable-build.yml@refs/tags/v1 \
            "${base_ref}" >/dev/null

          profiles="$(jq -c . bootc/generated/image-matrix.json)"

          export BASE_DIGEST="${base_digest}" BASE_REF="${base_ref}"
          matrix="$(nix run .#image-plan -- "${profiles}")"
          has_builds="$(jq -r '.include | length > 0' <<<"${matrix}")"
          root_base="$(jq -c 'first(.include[] | select(.stage == "root")) // {}' <<<"${matrix}")"
          hardware_matrix="$(jq -c '{include: [.include[] | select(.stage == "hardware")]}' <<<"${matrix}")"
          role_matrix="$(jq -c '{include: [.include[] | select(.stage == "role")]}' <<<"${matrix}")"
          has_root_base="$(jq -r 'has("profile")' <<<"${root_base}")"
          has_hardware="$(jq -r '.include | length > 0' <<<"${hardware_matrix}")"
          has_roles="$(jq -r '.include | length > 0' <<<"${role_matrix}")"

          {
            echo "base_image=${base_image}"
            echo "base_digest=${base_digest}"
            echo "hardware_matrix=${hardware_matrix}"
            echo "has_hardware=${has_hardware}"
            echo "has_builds=${has_builds}"
            echo "has_roles=${has_roles}"
            echo "has_root_base=${has_root_base}"
            echo "matrix=${matrix}"
            echo "role_matrix=${role_matrix}"
            echo "root_base=${root_base}"
            echo "version=${version}"
          } >>"${GITHUB_OUTPUT}"

  build-candidate:
    name: Validate ${{ matrix.profile }}
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group' ||
      (github.event_name == 'workflow_dispatch' && inputs.validate_only)) &&
      needs.plan.outputs.has_builds == 'true'
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/build-profile.yml
    permissions:
      contents: read
      packages: read
    with:
      build-input: ${{ matrix.build_input }}
      parent-digest: ${{ needs.plan.outputs.base_digest }}
      parent-image: ${{ needs.plan.outputs.base_image }}
      profile: ${{ matrix.profile }}
      publish: false
      tags: ${{ matrix.tags }}
      upstream-base-digest: ${{ needs.plan.outputs.base_digest }}
      version: ${{ needs.plan.outputs.version }}

  installer-candidate:
    name: Validate installer
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group' ||
      (github.event_name == 'workflow_dispatch' && inputs.validate_only)) &&
      needs.changes.outputs.installer == 'true'
    needs:
      - changes
      - check
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      attestations: read
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and smoke-test installer
        uses: ./.github/actions/build-installer
        with:
          cache-write: false
          image-tag: base-generic-x86_64
          token: ${{ github.token }}

  base-publish:
    name: Build and publish common base
    if: >-
      (github.event_name == 'push' || github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.validate_only)) &&
      needs.plan.outputs.has_root_base == 'true'
    needs: plan
    uses: ./.github/workflows/build-profile.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      build-input: ${{ fromJSON(needs.plan.outputs.root_base).build_input }}
      parent-digest: ${{ needs.plan.outputs.base_digest }}
      parent-image: ${{ needs.plan.outputs.base_image }}
      profile: base
      publish: true
      reuse-existing: ${{ fromJSON(needs.plan.outputs.root_base).reuse_existing }}
      tags: ${{ fromJSON(needs.plan.outputs.root_base).tags }}
      upstream-base-digest: ${{ needs.plan.outputs.base_digest }}
      version: ${{ needs.plan.outputs.version }}

  hardware-publish:
    name: Build and publish ${{ matrix.profile }}
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.validate_only)) &&
      needs.plan.result == 'success' && needs.plan.outputs.has_hardware == 'true' &&
      (needs.base-publish.result == 'success' || needs.base-publish.result == 'skipped')
    needs:
      - plan
      - base-publish
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.hardware_matrix) }}
    uses: ./.github/workflows/build-profile.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      build-input: ${{ matrix.build_input }}
      parent-digest: ${{ matrix.parent_digest || '' }}
      parent-image: ${{ format('ghcr.io/{0}', github.repository) }}
      parent-profile: ${{ matrix.parent }}
      parent-tag: ${{ matrix.parent_tag }}
      profile: ${{ matrix.profile }}
      publish: true
      reuse-existing: ${{ matrix.reuse_existing }}
      tags: ${{ matrix.tags }}
      upstream-base-digest: ${{ needs.plan.outputs.base_digest }}
      version: ${{ needs.plan.outputs.version }}

  roles-publish:
    name: Build and publish ${{ matrix.profile }}
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.validate_only)) &&
      needs.plan.result == 'success' && needs.plan.outputs.has_roles == 'true' &&
      (needs.base-publish.result == 'success' || needs.base-publish.result == 'skipped') &&
      (needs.hardware-publish.result == 'success' || needs.hardware-publish.result == 'skipped')
    needs:
      - plan
      - base-publish
      - hardware-publish
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.role_matrix) }}
    uses: ./.github/workflows/build-profile.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      build-input: ${{ matrix.build_input }}
      parent-digest: ${{ matrix.parent_digest || '' }}
      parent-image: ${{ format('ghcr.io/{0}', github.repository) }}
      parent-profile: ${{ matrix.parent }}
      parent-tag: ${{ matrix.parent_tag }}
      profile: ${{ matrix.profile }}
      publish: true
      reuse-existing: ${{ matrix.reuse_existing }}
      tags: ${{ matrix.tags }}
      upstream-base-digest: ${{ needs.plan.outputs.base_digest }}
      version: ${{ needs.plan.outputs.version }}

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - check
      - plan
      - build-candidate
      - installer-candidate
      - base-publish
      - hardware-publish
      - roles-publish
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require the complete event-appropriate build graph
        env:
          BASE_PUBLISH_RESULT: ${{ needs.base-publish.result }}
          BUILD_CANDIDATE_RESULT: ${{ needs.build-candidate.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          EVENT_NAME: ${{ github.event_name }}
          HAS_BUILDS: ${{ needs.plan.outputs.has_builds }}
          HAS_HARDWARE: ${{ needs.plan.outputs.has_hardware }}
          HAS_ROLES: ${{ needs.plan.outputs.has_roles }}
          HAS_ROOT_BASE: ${{ needs.plan.outputs.has_root_base }}
          HARDWARE_PUBLISH_RESULT: ${{ needs.hardware-publish.result }}
          INSTALLER_CANDIDATE_RESULT: ${{ needs.installer-candidate.result }}
          INSTALLER_SELECTED: ${{ needs.changes.outputs.installer }}
          IMAGES_SELECTED: ${{ needs.changes.outputs.images }}
          PLAN_RESULT: ${{ needs.plan.result }}
          REF: ${{ github.ref }}
          ROLES_PUBLISH_RESULT: ${{ needs.roles-publish.result }}
          VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only || false }}
        shell: bash
        run: |
          require_result() {
            local job=$1 actual=$2 expected=$3
            if [[ "${actual}" != "${expected}" ]]; then
              printf '%s finished with %s; expected %s\n' \
                "${job}" "${actual}" "${expected}" >&2
              return 1
            fi
          }

          require_selected_result() {
            local job=$1 selected=$2 actual=$3
            if [[ "${selected}" == true ]]; then
              require_result "${job}" "${actual}" success
            else
              require_result "${job}" "${actual}" skipped
            fi
          }

          require_result changes "${CHANGES_RESULT}" success
          require_result check "${CHECK_RESULT}" success
          require_selected_result plan "${IMAGES_SELECTED}" "${PLAN_RESULT}"

          if [[ "${EVENT_NAME}" == pull_request || "${EVENT_NAME}" == merge_group || "${VALIDATE_ONLY}" == true ]]; then
            require_selected_result build-candidate "${HAS_BUILDS}" "${BUILD_CANDIDATE_RESULT}"
            require_selected_result installer-candidate "${INSTALLER_SELECTED}" "${INSTALLER_CANDIDATE_RESULT}"
            require_result base-publish "${BASE_PUBLISH_RESULT}" skipped
            require_result hardware-publish "${HARDWARE_PUBLISH_RESULT}" skipped
            require_result roles-publish "${ROLES_PUBLISH_RESULT}" skipped
            exit 0
          fi

          require_result build-candidate "${BUILD_CANDIDATE_RESULT}" skipped
          require_result installer-candidate "${INSTALLER_CANDIDATE_RESULT}" skipped
          if [[ "${EVENT_NAME}" == workflow_dispatch && "${REF}" != refs/heads/main ]]; then
            echo 'Publishing workflow dispatches must target main' >&2
            exit 1
          fi
          require_selected_result base-publish "${HAS_ROOT_BASE}" "${BASE_PUBLISH_RESULT}"
          require_selected_result hardware-publish "${HAS_HARDWARE}" "${HARDWARE_PUBLISH_RESULT}"
          require_selected_result roles-publish "${HAS_ROLES}" "${ROLES_PUBLISH_RESULT}"
