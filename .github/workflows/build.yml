name: Build Purplefin

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild every image even when its inputs are current
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BASE_IMAGE: ghcr.io/projectbluefin/bluefin
  BASE_TAG: stable

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v22
        with:
          determinate: false

      - name: Cache Nix store paths
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false

      - name: Validate repository and workflows
        shell: bash
        run: |
          nix shell \
            nixpkgs#actionlint \
            nixpkgs#just \
            nixpkgs#pipewire \
            nixpkgs#ripgrep \
            nixpkgs#shellcheck \
            nixpkgs#zsh \
            nixpkgs#zizmor \
            -c build_files/check-ci.sh

  plan:
    name: Resolve build inputs
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      base_digest: ${{ steps.plan.outputs.base_digest }}
      base_kernel: ${{ steps.plan.outputs.base_kernel }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve, verify, and plan immutable inputs
        id: plan
        env:
          CHECK_RPM_UPDATES: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          IMAGE_REF: ${{ format('{0}/{1}', env.REGISTRY, env.IMAGE_NAME) }}
        shell: bash
        run: |
          base_metadata="$({
            skopeo inspect --retry-times 3 \
              "docker://${BASE_IMAGE}:${BASE_TAG}"
          })"
          base_digest="$(jq -er '.Digest' <<<"${base_metadata}")"
          base_kernel="$(jq -er '.Labels["ostree.linux"]' <<<"${base_metadata}")"
          base_ref="${BASE_IMAGE}@${base_digest}"
          version="$(<VERSION)"

          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity \
              https://github.com/projectbluefin/actions/.github/workflows/reusable-build.yml@refs/tags/v1 \
            "${base_ref}" >/dev/null

          profiles='[]'
          while IFS= read -r entry; do
            profile="$(jq -r '.profile' <<<"${entry}")"
            tags="$(jq -r '.tags' <<<"${entry}")"
            build_input="$(build_files/profile-build-input.sh "${profile}" "${tags}")"
            entry="$(jq -c --arg build_input "${build_input}" '. + {build_input: $build_input}' <<<"${entry}")"
            profiles="$(jq -c --argjson entry "${entry}" '. + [$entry]' <<<"${profiles}")"
          done < <(jq -c '.[]' build_files/image-matrix.json)

          export BASE_DIGEST="${base_digest}" BASE_REF="${base_ref}"
          matrix="$(build_files/plan-image-builds.sh "${profiles}")"
          has_builds="$(jq -r '.include | length > 0' <<<"${matrix}")"

          {
            echo "base_digest=${base_digest}"
            echo "base_kernel=${base_kernel}"
            echo "has_builds=${has_builds}"
            echo "matrix=${matrix}"
            echo "version=${version}"
          } >>"${GITHUB_OUTPUT}"

  build-pr:
    name: Build ${{ matrix.profile }}
    if: github.event_name == 'pull_request' && needs.plan.outputs.has_builds == 'true'
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/build-profile.yml
    permissions:
      contents: read
      packages: read
    with:
      base-digest: ${{ needs.plan.outputs.base_digest }}
      base-kernel: ${{ needs.plan.outputs.base_kernel }}
      build-input: ${{ matrix.build_input }}
      profile: ${{ matrix.profile }}
      publish: false
      tags: ${{ matrix.tags }}
      version: ${{ needs.plan.outputs.version }}

  build-publish:
    name: Build and publish ${{ matrix.profile }}
    if: github.event_name != 'pull_request' && needs.plan.outputs.has_builds == 'true'
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/build-profile.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      base-digest: ${{ needs.plan.outputs.base_digest }}
      base-kernel: ${{ needs.plan.outputs.base_kernel }}
      build-input: ${{ matrix.build_input }}
      profile: ${{ matrix.profile }}
      publish: true
      tags: ${{ matrix.tags }}
      version: ${{ needs.plan.outputs.version }}
