name: Build Purplefin installer ISO

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  build-installer:
    name: Build installer ISO
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build installer environment
        run: |
          podman build \
            --file installer/Containerfile \
            --pull=always \
            --tag localhost/purplefin-anaconda:latest \
            .

      - name: Build ISO
        run: |
          mkdir -p output
          podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            --volume "${PWD}/output:/output" \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type bootc-installer \
            --bootc-installer-payload-ref ghcr.io/declarative-dale/purplefin:base-generic-x86_64 \
            localhost/purplefin-anaconda:latest

      - name: Upload installer ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: purplefin-installer-iso
          path: output/*.iso
          if-no-files-found: error
