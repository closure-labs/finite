name: Build and boot-test Purplefin installer ISO

on:
  schedule:
    - cron: "41 9 * * 0"
  workflow_dispatch:
    inputs:
      end-to-end:
        description: Also perform an unattended install and boot the installed system
        required: false
        default: false
        type: boolean
      image-tag:
        description: Published Purplefin profile to embed
        required: true
        default: base-generic-x86_64
        type: choice
        options:
          - base-generic-x86_64
          - base-dell-xps-9350-intel
          - sales-generic
          - sales-dell-xps-9350-intel
          - support-generic
          - support-dell-xps-9350-intel
          - dale
          - developer-generic
          - trainer-generic
          - executive-generic
          - it-generic

concurrency:
  group: installer-${{ github.ref }}-${{ inputs.image-tag || 'base-generic-x86_64' }}
  cancel-in-progress: true

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

jobs:
  build-installer:
    name: Build and boot installer ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and smoke-test installer
        id: installer
        uses: ./.github/actions/build-installer
        with:
          cache-write: >-
            ${{ github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main') }}
          end-to-end: ${{ github.event_name == 'schedule' || inputs.end-to-end }}
          image-tag: ${{ inputs.image-tag || 'base-generic-x86_64' }}
          token: ${{ github.token }}

      - name: Attest installer artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            output/*.iso
            output/SHA256SUMS
            output/installer-manifest.json

      - name: Upload installer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: purplefin-${{ steps.installer.outputs.payload-tag }}-installer
          path: |
            output/*.iso
            output/SHA256SUMS
            output/installer-manifest.json
            output/qemu-boot.log
          if-no-files-found: error
          retention-days: 14
