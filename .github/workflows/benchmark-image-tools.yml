name: Benchmark image tool setup

on:
  workflow_dispatch:
    inputs:
      validation:
        description: Hosted experiment; qualification never promotes an image
        type: choice
        default: tool-setup
        options: [tool-setup, cache-lanes, qualification, options-smoke]
      profile:
        description: Signed candidate profile for diagnostic qualification
        type: choice
        default: finite-dev
        options: [finite, finite-dev]
      channel:
        description: Matching ongoing update channel
        type: choice
        default: finite-dev
        options: [finite, finite-dev]
      digest:
        description: Exact signed candidate sha256 digest
        type: string
        default: ""
      previous:
        description: Exact signed predecessor digest for upgrade and rollback
        type: string
        default: ""
      identity:
        description: Candidate io.finite.build-inputs identity
        type: string
        default: ""
      source_revision:
        description: Candidate source revision (40 hex digits)
        type: string
        default: ""

# Bootstrap public options; setup-nix resolves them through SecretSpec.
env:
  FINITE_OPTIMIZED_CACHES: ${{ vars.FINITE_OPTIMIZED_CACHES }}
  FINITE_CACHIX_WRITER: ${{ vars.FINITE_CACHIX_WRITER }}
  FINITE_REUSE_INVENTORY: ${{ vars.FINITE_REUSE_INVENTORY }}
  FINITE_GRYPE_DB_CACHE: ${{ vars.FINITE_GRYPE_DB_CACHE }}
  FINITE_QUALIFICATION_REUSE: ${{ vars.FINITE_QUALIFICATION_REUSE }}
  FINITE_QUALIFIED_ISO_PRESERVATION: ${{ vars.FINITE_QUALIFIED_ISO_PRESERVATION }}
  FINITE_QUALIFIED_ISO_CHANNELS: ${{ vars.FINITE_QUALIFIED_ISO_CHANNELS }}

permissions:
  contents: read
  actions: read

jobs:
  options-smoke:
    if: inputs.validation == 'options-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: finite
            selection: finite
            expected: "true"
          - channel: finite-dev
            selection: finite
            expected: "false"
          - channel: finite-dev
            selection: all
            expected: "true"
          - channel: finite
            selection: finite-dev,finite
            expected: "true"
    env:
      FINITE_QUALIFIED_ISO_PRESERVATION: "true"
      FINITE_QUALIFIED_ISO_CHANNELS: ${{ matrix.selection }}
      SMOKE_CHANNEL: ${{ matrix.channel }}
      EXPECTED: ${{ matrix.expected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: none
      - name: Exercise selected-channel workflow condition
        id: selected
        if: >-
          env.FINITE_QUALIFIED_ISO_PRESERVATION == 'true' &&
          contains(format(',{0},', env.FINITE_QUALIFIED_ISO_CHANNELS), format(',{0},', matrix.channel))
        run: echo 'enabled=true' >>"$GITHUB_OUTPUT"
      - name: Require workflow and runtime scope to agree
        env:
          OBSERVED: ${{ steps.selected.outputs.enabled || 'false' }}
        run: |
          actual=$(python3 scripts/ci/ci-options.py --iso-preservation "$SMOKE_CHANNEL")
          [[ "$actual" == "$EXPECTED" && "$OBSERVED" == "$EXPECTED" ]]
          echo "Channel $SMOKE_CHANNEL selected: $actual" >>"$GITHUB_STEP_SUMMARY"

  benchmark:
    if: inputs.validation == 'tool-setup'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, candidate]
    env:
      BENCHMARK_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Measure runner resources
        id: resources
        run: python3 scripts/ci/nix-resources.py
      # Each matrix job gets a separate runner. Deliberately avoid setup-nix's
      # Actions cache so the first pass is cold and the second reuses only itself.
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
        with:
          extra-conf: |
            max-jobs = ${{ steps.resources.outputs.max-jobs }}
            cores = ${{ steps.resources.outputs.cores }}
            eval-cores = ${{ steps.resources.outputs.eval-cores }}
            extra-experimental-features = parallel-eval
            connect-timeout = 15
            stalled-download-timeout = 60
            download-attempts = 3
      - name: Verify Determinate Nix resource settings
        run: python3 scripts/ci/nix-resources.py --verify
      - name: Measure cold and warm tool setup
        run: python3 scripts/ci/benchmark-image-tools.py "$BENCHMARK_MODE" ".bluebuild/benchmark-$BENCHMARK_MODE.json"
      - name: Retain measurements including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-tools-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .bluebuild/benchmark-${{ matrix.mode }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  cache-lanes:
    if: inputs.validation == 'cache-lanes'
    uses: ./.github/workflows/benchmark-ci-cache.yml

  qualification:
    if: inputs.validation == 'qualification' && github.repository == 'closure-labs/finite' && github.ref != 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      # ISO construction needs only unique installation tags; no channel promotion.
      packages: write
    uses: ./.github/workflows/qualification.yml
    with:
      profile: ${{ inputs.profile }}
      channel: ${{ inputs.channel }}
      digest: ${{ inputs.digest }}
      previous: ${{ inputs.previous }}
      identity: ${{ inputs.identity }}
      source_revision: ${{ inputs.source_revision }}
      force_qualification: true
      validation_only: true
