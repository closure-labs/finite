name: Publish qualified BlueBuild image
on:
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      channel:
        type: string
        required: true
      force_qualification:
        type: boolean
        default: false
      resume_run:
        type: string
        default: ""
      resume_digest:
        type: string
        default: ""
    secrets:
      DECIDER_KEY:
        required: false
      DECIDER_CLIENT:
        required: false
      COSIGN_PRIVATE_KEY:
        required: true
      COSIGN_PASSWORD:
        required: false
# Bootstrap public options; setup-nix resolves them through SecretSpec.
env:
  FINITE_OPTIMIZED_CACHES: ${{ vars.FINITE_OPTIMIZED_CACHES }}
  FINITE_CACHIX_WRITER: ${{ vars.FINITE_CACHIX_WRITER }}
  FINITE_REUSE_INVENTORY: ${{ vars.FINITE_REUSE_INVENTORY }}
  FINITE_GRYPE_DB_CACHE: ${{ vars.FINITE_GRYPE_DB_CACHE }}
  FINITE_QUALIFICATION_REUSE: ${{ vars.FINITE_QUALIFICATION_REUSE }}
  FINITE_QUALIFIED_ISO_PRESERVATION: ${{ vars.FINITE_QUALIFIED_ISO_PRESERVATION }}
  FINITE_QUALIFIED_ISO_CHANNELS: ${{ vars.FINITE_QUALIFIED_ISO_CHANNELS }}

permissions:
  contents: read
  packages: write
  actions: read
jobs:
  build:
    uses: $/.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
      actions: read
    with:
      profile: ${{ inputs.profile }}
      channel: ${{ inputs.channel }}
      publish: true
      force_qualification: ${{ inputs.force_qualification }}
      resume_run: ${{ inputs.resume_run }}
      resume_digest: ${{ inputs.resume_digest }}

  security:
    needs: build
    if: github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      actions: read
    outputs:
      digest: ${{ steps.scan.outputs.digest }}
      evidence: ${{ steps.scan.outputs.evidence }}
    env:
      PROFILE: ${{ inputs.profile }}
      CANDIDATE_DIGEST: ${{ needs.build.outputs.digest }}
      BUILD_IDENTITY: ${{ needs.build.outputs.identity }}
      SOURCE_REVISION: ${{ needs.build.outputs.source_revision }}
      RESUME_RUN: ${{ inputs.resume_run }}
      FINITE_REVIEW_BOT_LOGIN: ${{ vars.FINITE_REVIEW_BOT_LOGIN }}
    steps:
      - name: Monitor hosted runner (Community)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/setup-nix
      - name: Stop obsolete publication before security setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/bluebuild/qualification-preflight.py --revision "$GITHUB_SHA"
      - name: Read checked publication admission policy
        id: admission-policy
        run: |
          python3 - <<'PY_POLICY'
          import os
          from pathlib import Path
          import runpy
          policy = runpy.run_path('scripts/bluebuild/security-policy.py')['load_policy'](
              Path('automation/security/image-policy.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('maintainer=' + str(policy['mode'] == 'maintainer-decision').lower(), file=output)
          PY_POLICY
      - name: Resolve declared read-only authority App credentials
        if: inputs.resume_run != '' && steps.admission-policy.outputs.maintainer == 'true'
        env:
          FINITE_REVIEW_CLIENT_ID: ${{ vars.DECIDER_CLIENT || secrets.DECIDER_CLIENT }}
          FINITE_REVIEW_PRIVATE_KEY: ${{ secrets.DECIDER_KEY }}
        run: >-
          finite-ci-secrets-run review-app --
          secretspec export --file secretspec.toml --profile review-app --provider github-actions
          --scope review-app --reason 'Finite publication human authority verification' --format gha
      - name: Generate short-lived read-only authority token
        id: review-token
        if: inputs.resume_run != '' && steps.admission-policy.outputs.maintainer == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.FINITE_REVIEW_CLIENT_ID }}
          private-key: ${{ env.FINITE_REVIEW_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-administration: read
          permission-members: read
      - name: Clear App private credentials
        if: always() && inputs.resume_run != '' && steps.admission-policy.outputs.maintainer == 'true'
        run: | # zizmor: ignore[github-env]
          printf 'FINITE_REVIEW_CLIENT_ID=\nFINITE_REVIEW_PRIVATE_KEY=\n' >>"$GITHUB_ENV"
      - name: Reuse authenticated publisher evidence from this build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_EVIDENCE: ${{ needs.build.outputs.evidence }}
        run: |
          set -euo pipefail
          [[ $BUILD_EVIDENCE == "image-$PROFILE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ]]
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$BUILD_EVIDENCE" --dir .bluebuild/upstream-build
          test -f .bluebuild/upstream-build/upstream-verified.json
      - name: Revalidate fresh security evidence for a resumed candidate
        id: reuse
        if: inputs.resume_run != ''
        env:
          GH_TOKEN: ${{ steps.review-token.outputs.token || github.token }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          # Expand these variables inside the Nix-provided child shell.
          # shellcheck disable=SC2016
          nix develop --file lib/ci-tools.nix release --command bash -c '
            sudo --preserve-env=GH_TOKEN,REGISTRY_TOKEN,GITHUB_ACTOR,GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_REF,GITHUB_EVENT_NAME,GITHUB_WORKFLOW_REF,GITHUB_SHA,FINITE_REVIEW_BOT_LOGIN \
              systemd-run --quiet --wait --pipe --service-type=exec \
              --unit="finite-security-reuse-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --property=MemoryMax=2G --property=MemorySwapMax=0 --property=RuntimeMaxSec=300 \
              --property=NoNewPrivileges=yes --property=CapabilityBoundingSet= \
              --uid="$(id -u)" --gid="$(id -g)" --working-directory="$PWD" \
              --setenv="PATH=$PATH" --setenv=GH_TOKEN --setenv=REGISTRY_TOKEN --setenv=GITHUB_ACTOR --setenv=GITHUB_ACTIONS \
              --setenv=GITHUB_REPOSITORY --setenv=GITHUB_REF --setenv=GITHUB_EVENT_NAME \
              --setenv=GITHUB_WORKFLOW_REF --setenv=GITHUB_SHA --setenv=FINITE_REVIEW_BOT_LOGIN \
              python3 scripts/ci/reuse-candidate-security.py \
              --origin-run "$RESUME_RUN" --profile "$PROFILE" --digest "$CANDIDATE_DIGEST" \
              --output ".bluebuild/security-$PROFILE"
          '
          status=$?
          set -e
          case "$status" in
            0) echo 'reused=true' >>"$GITHUB_OUTPUT" ;;
            3) echo 'Reusable evidence unavailable or expired; scanning the same candidate.' ;;
            *) exit "$status" ;;
          esac
      - name: Restore scanner database transport cache
        if: env.FINITE_GRYPE_DB_CACHE == 'true' && steps.reuse.outputs.reused != 'true'
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: grype-db-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-prefixes-first-match: grype-db-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
          nix: false
          save: true
          paths: ~/.cache/grype/db

      - name: Recheck publication before inventory and scanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/bluebuild/qualification-preflight.py --revision "$GITHUB_SHA"
      - name: Make room for the immutable image inventory
        if: steps.reuse.outputs.reused != 'true'
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: "80G"
      - name: Scan exact candidate and enforce image security policy
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          FINITE_REUSE_INVENTORY: ${{ env.FINITE_REUSE_INVENTORY }}
          FINITE_INVENTORY_ORIGIN_RUN: ${{ inputs.resume_run }}
          REUSED_SECURITY: ${{ steps.reuse.outputs.reused }}
        run: |
          if [[ $REUSED_SECURITY != true ]]; then
            nix develop --file lib/ci-tools.nix release --command bash scripts/bluebuild/security-run.sh \
            "ghcr.io/closure-labs/finite@$CANDIDATE_DIGEST" ".bluebuild/security-$PROFILE" \
            --profile "$PROFILE" --identity "$BUILD_IDENTITY" \
            --source-revision "$SOURCE_REVISION" \
            --upstream-receipt .bluebuild/upstream-build/upstream-verified.json
          fi
          echo "digest=$CANDIDATE_DIGEST" >>"$GITHUB_OUTPUT"
          echo "evidence=security-$PROFILE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"
      - name: Retain bounded scanner costs including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-costs-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .bluebuild/security-${{ inputs.profile }}/phase-timings.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain scanner evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .bluebuild/security-${{ inputs.profile }}/
          include-hidden-files: true
          retention-days: 90

  attest:
    needs: security
    uses: $/.github/workflows/attest-image.yml
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    with:
      profile: ${{ inputs.profile }}
      digest: ${{ needs.security.outputs.digest }}
      evidence: ${{ needs.security.outputs.evidence }}
      resume_run: ${{ inputs.resume_run }}

  sign:
    needs: [security, attest]
    if: github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main'
    environment: image-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Monitor hosted runner (Community)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            cosign.pub
            secretspec.toml
            flake.lock
            .github/actions/setup-nix/
            lib/
            scripts/ci/nix-resources.py
            scripts/ci/nix-cache.py
            scripts/ci/ci-options.py
            sources/
            automation/security/
            automation/decisions/
            scripts/bluebuild/security-policy.py
            scripts/ci/
          sparse-checkout-cone-mode: false
      - uses: $/.github/actions/setup-cosign
        with:
          cosign-release: v3.1.3
      - uses: $/.github/actions/setup-nix
        with:
          cache-mode: none
      - name: Read checked publication admission policy
        id: admission-policy
        run: |
          python3 - <<'PY_POLICY'
          import os
          from pathlib import Path
          import runpy
          policy = runpy.run_path('scripts/bluebuild/security-policy.py')['load_policy'](
              Path('automation/security/image-policy.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('maintainer=' + str(policy['mode'] == 'maintainer-decision').lower(), file=output)
          PY_POLICY
      - name: Resolve declared read-only authority App credentials
        if: steps.admission-policy.outputs.maintainer == 'true'
        env:
          FINITE_REVIEW_CLIENT_ID: ${{ vars.DECIDER_CLIENT || secrets.DECIDER_CLIENT }}
          FINITE_REVIEW_PRIVATE_KEY: ${{ secrets.DECIDER_KEY }}
        run: >-
          finite-ci-secrets-run review-app --
          secretspec export --file secretspec.toml --profile review-app --provider github-actions
          --scope review-app --reason 'Finite publication human authority verification' --format gha
      - name: Generate short-lived read-only authority token
        id: review-token
        if: steps.admission-policy.outputs.maintainer == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.FINITE_REVIEW_CLIENT_ID }}
          private-key: ${{ env.FINITE_REVIEW_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-administration: read
          permission-members: read
      - name: Clear App private credentials
        if: always() && steps.admission-policy.outputs.maintainer == 'true'
        run: | # zizmor: ignore[github-env]
          printf 'FINITE_REVIEW_CLIENT_ID=\nFINITE_REVIEW_PRIVATE_KEY=\n' >>"$GITHUB_ENV"
      - name: Authenticate native evidence and human admission before signing credentials
        env:
          GH_TOKEN: ${{ steps.review-token.outputs.token || github.token }}
          SECURITY_ARTIFACT: ${{ needs.security.outputs.evidence }}
          CANDIDATE_DIGEST: ${{ needs.security.outputs.digest }}
          FINITE_REVIEW_BOT_LOGIN: ${{ vars.FINITE_REVIEW_BOT_LOGIN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SECURITY_ARTIFACT" --dir .bluebuild/signing-security
          python3 scripts/ci/verify-security-admission.py --directory .bluebuild/signing-security \
            --image "ghcr.io/closure-labs/finite@$CANDIDATE_DIGEST"
      - name: Prepare pinned scoped credential resolver
        # The resolver path is realized from trusted main before keys are supplied.
        run: | # zizmor: ignore[github-env]
          resolver=$(nix build --file lib/ci-tools.nix ci-secrets-run --no-link --print-out-paths)
          [[ $resolver =~ ^/nix/store/[a-z0-9]{32}-finite-ci-secrets-run$ ]]
          echo "$resolver/bin" >>"$GITHUB_PATH"
      - name: Sign the independently scanned immutable digest
        env:
          CANDIDATE_DIGEST: ${{ needs.security.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          finite-ci-secrets-run image-signing -- bash <<'SIGN_IMAGE'
          set -euo pipefail
          set +x
          [[ -n ${COSIGN_PRIVATE_KEY:-} ]] || { echo 'Image-signing key is unavailable' >&2; exit 1; }
          if ! derived_public_key=$(timeout 30s cosign public-key --key env://COSIGN_PRIVATE_KEY 2>/dev/null); then
            echo 'Image-signing key could not derive a public key' >&2
            exit 1
          fi
          [[ $derived_public_key == "$(cat cosign.pub)" ]] || {
            echo 'Image-signing key does not match cosign.pub' >&2
            exit 1
          }
          unset derived_public_key
          [[ $CANDIDATE_DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ $(gh api repos/closure-labs/finite/git/ref/heads/main --jq .object.sha) == "$GITHUB_SHA" ]]
          image="ghcr.io/closure-labs/finite@$CANDIDATE_DIGEST"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login --username "$REGISTRY_USER" --password-stdin ghcr.io
          cosign sign --yes --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "$image"
          cosign verify --new-bundle-format=false --key cosign.pub "$image"
          SIGN_IMAGE

  preflight:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      actions: read
    env:
      PROFILE: ${{ inputs.profile }}
    steps:
      - name: Monitor hosted runner (Community)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
      - name: Reject obsolete publication before VM work
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_ARTIFACT: ${{ needs.build.outputs.evidence }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name "$IMAGE_ARTIFACT" --dir .bluebuild
          nix develop --file lib/ci-tools.nix shell --command python3 scripts/bluebuild/publication-current.py \
            --record ".bluebuild/$PROFILE-publication.json"

  qualification:
    needs: [build, sign, preflight]
    permissions:
      contents: read
      packages: write
      actions: read
    uses: $/.github/workflows/qualification.yml
    with:
      profile: ${{ inputs.profile }}
      channel: ${{ inputs.channel }}
      digest: ${{ needs.build.outputs.digest }}
      previous: ${{ needs.build.outputs.previous }}
      identity: ${{ needs.build.outputs.identity }}
      source_revision: ${{ needs.build.outputs.source_revision }}
      force_qualification: ${{ inputs.force_qualification }}

  promote:
    needs: [build, security, sign, qualification]
    if: >-
      always() && !cancelled() && needs.build.result == 'success' &&
      needs.security.result == 'success' && needs.sign.result == 'success' &&
      needs.qualification.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PROFILE: ${{ inputs.profile }}
      FINITE_QUALIFICATION_MODE: enforce
      FINITE_REVIEW_BOT_LOGIN: ${{ vars.FINITE_REVIEW_BOT_LOGIN }}
    steps:
      - name: Monitor hosted runner (Community)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
      - name: Read checked publication admission policy
        id: admission-policy
        run: |
          python3 - <<'PY_POLICY'
          import os
          from pathlib import Path
          import runpy
          policy = runpy.run_path('scripts/bluebuild/security-policy.py')['load_policy'](
              Path('automation/security/image-policy.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('maintainer=' + str(policy['mode'] == 'maintainer-decision').lower(), file=output)
          PY_POLICY
      - name: Resolve declared read-only authority App credentials
        if: steps.admission-policy.outputs.maintainer == 'true'
        env:
          FINITE_REVIEW_CLIENT_ID: ${{ vars.DECIDER_CLIENT || secrets.DECIDER_CLIENT }}
          FINITE_REVIEW_PRIVATE_KEY: ${{ secrets.DECIDER_KEY }}
        run: >-
          finite-ci-secrets-run review-app --
          secretspec export --file secretspec.toml --profile review-app --provider github-actions
          --scope review-app --reason 'Finite publication human authority verification' --format gha
      - name: Generate short-lived read-only authority token
        id: review-token
        if: steps.admission-policy.outputs.maintainer == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.FINITE_REVIEW_CLIENT_ID }}
          private-key: ${{ env.FINITE_REVIEW_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-administration: read
          permission-members: read
      - name: Clear App private credentials
        if: always() && steps.admission-policy.outputs.maintainer == 'true'
        run: | # zizmor: ignore[github-env]
          printf 'FINITE_REVIEW_CLIENT_ID=\nFINITE_REVIEW_PRIVATE_KEY=\n' >>"$GITHUB_ENV"
      - name: Download candidate and qualification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_ARTIFACT: ${{ needs.build.outputs.evidence }}
          SECURITY_ARTIFACT: ${{ needs.security.outputs.evidence }}
          QUALIFICATION_ARTIFACT: ${{ needs.qualification.outputs.evidence }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name "$IMAGE_ARTIFACT" --dir .bluebuild
          gh run download "$GITHUB_RUN_ID" --name "$QUALIFICATION_ARTIFACT" --dir .bluebuild
          gh run download "$GITHUB_RUN_ID" --name "$SECURITY_ARTIFACT" --dir ".bluebuild/security-$PROFILE"
      - name: Promote verified digest to public channels
        env:
          GH_TOKEN: ${{ steps.review-token.outputs.token || github.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | nix develop --file lib/ci-tools.nix shell --command skopeo login --username "$REGISTRY_USER" --password-stdin ghcr.io
          nix develop --file lib/ci-tools.nix shell --command python3 scripts/bluebuild/publication.py promote "$PROFILE"
      - name: Save promotion evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promotion-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .bluebuild/*.json
          include-hidden-files: true
          retention-days: 90
