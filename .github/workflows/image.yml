name: Build one BlueBuild image
on:
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      channel:
        type: string
        required: true
      publish:
        type: boolean
        default: false
      force_qualification:
        type: boolean
        default: false
      resume_run:
        type: string
        default: ""
      resume_digest:
        type: string
        default: ""
      diagnostic_security:
        type: boolean
        default: false
    outputs:
      digest:
        value: ${{ jobs.build.outputs.digest }}
      previous:
        value: ${{ jobs.build.outputs.previous }}
      identity:
        value: ${{ jobs.build.outputs.identity }}
      qualify:
        value: ${{ jobs.build.outputs.qualify }}
      evidence:
        value: ${{ jobs.build.outputs.evidence }}
      source_revision:
        value: ${{ jobs.build.outputs.source_revision }}
# Bootstrap public options; setup-nix resolves them through SecretSpec.
env:
  FINITE_OPTIMIZED_CACHES: ${{ vars.FINITE_OPTIMIZED_CACHES }}
  FINITE_CACHIX_WRITER: ${{ vars.FINITE_CACHIX_WRITER }}
  FINITE_REUSE_INVENTORY: ${{ vars.FINITE_REUSE_INVENTORY }}
  FINITE_GRYPE_DB_CACHE: ${{ vars.FINITE_GRYPE_DB_CACHE }}
  FINITE_QUALIFICATION_REUSE: ${{ vars.FINITE_QUALIFICATION_REUSE }}
  FINITE_QUALIFIED_ISO_PRESERVATION: ${{ vars.FINITE_QUALIFIED_ISO_PRESERVATION }}
  FINITE_QUALIFIED_ISO_CHANNELS: ${{ vars.FINITE_QUALIFIED_ISO_CHANNELS }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      digest: ${{ steps.resume.outputs.digest || steps.inspect.outputs.digest }}
      previous: ${{ steps.resume.outputs.previous || steps.prepare.outputs.previous }}
      identity: ${{ steps.resume.outputs.identity || steps.prepare.outputs.identity }}
      qualify: ${{ steps.resume.outputs.qualify || steps.prepare.outputs.qualify }}
      evidence: ${{ steps.resume.outputs.evidence || steps.prepare.outputs.evidence }}
      source_revision: ${{ steps.resume.outputs.source_revision || steps.prepare.outputs.source_revision }}
    env:
      PROFILE: ${{ inputs.profile }}
      CHANNEL: ${{ inputs.channel }}
      FINITE_QUALIFICATION_MODE: enforce
      FORCE_QUALIFICATION: ${{ inputs.force_qualification }}
    steps:
      - name: Monitor hosted runner (Community)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - name: Validate diagnostic boundary
        if: inputs.diagnostic_security
        env:
          PUBLISH: ${{ inputs.publish }}
          RESUME_RUN: ${{ inputs.resume_run }}
          RESUME_DIGEST: ${{ inputs.resume_digest }}
        run: |
          [[ $GITHUB_EVENT_NAME == workflow_dispatch && $GITHUB_REPOSITORY == closure-labs/finite ]]
          [[ $GITHUB_REF != refs/heads/main && $GITHUB_REF == refs/heads/* ]]
          [[ $PUBLISH == false && -z $RESUME_RUN && -z $RESUME_DIGEST ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-nix
      - name: Make room for the image build
        if: inputs.resume_run == '' && inputs.resume_digest == ''
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: "80G"
      - name: Prepare pinned image tools once
        run: |
          tools=$(nix build --file lib/ci-tools.nix image-tools --no-link --print-out-paths)
          test -x "$tools/bin/python3"
          # Add only pinned tool binaries. Host Nix and /usr/local/bin/bluebuild
          # remain on PATH; no development shell or compiler is needed here.
          test ! -e "$tools/bin/nix"
          test ! -e "$tools/bin/bluebuild"
          echo "$tools/bin" >>"$GITHUB_PATH"
      - name: Prepare pinned scanner tools only for requested diagnostics
        if: inputs.diagnostic_security
        run: |
          tools=$(nix build --file lib/ci-tools.nix scanner-tools --no-link --print-out-paths)
          for tool in python3 umoci syft grype; do test -x "$tools/bin/$tool"; done
          test ! -e "$tools/bin/nix"
          test ! -e "$tools/bin/bluebuild"
          echo "$tools/bin" >>"$GITHUB_PATH"
      - name: Validate extraction compatibility before diagnostic image work
        if: inputs.diagnostic_security
        run: python3 scripts/ci/extraction-layout-smoke.py --output .bluebuild/extraction-smoke.json
      # Authenticate the canonical pinned recipes before preparation rewrites
      # public channel tags to isolated candidate tags.
      - name: Authenticate pinned upstream publishers
        run: python3 scripts/ci/bluefin-upstream.py verify
      - name: Authenticate the locked runtime Cosign publisher
        run: python3 scripts/ci/cosign-runtime.py --output .bluebuild/cosign-runtime.json
      - name: Prepare candidate publication
        if: inputs.resume_run == '' && inputs.resume_digest == ''
        id: prepare
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          args=()
          if [[ $PUBLISH == true ]]; then args+=(--publish); fi
          python3 scripts/bluebuild/publication.py prepare "$PROFILE" "${args[@]}"
          echo "evidence=image-$PROFILE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"
      - name: Validate and resume immutable candidate
        id: resume
        if: inputs.resume_run != '' || inputs.resume_digest != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run }}
          RESUME_DIGEST: ${{ inputs.resume_digest }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          [[ $PUBLISH == true ]]
          python3 scripts/bluebuild/publication.py resume "$PROFILE" --run "$RESUME_RUN" --digest "$RESUME_DIGEST"
          echo "evidence=image-$PROFILE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"
      - name: Install the verified locked BlueBuild CLI
        if: inputs.resume_run == '' && inputs.resume_digest == ''
        run: bash scripts/bluebuild/install-cli.sh
      - name: Validate recipes and record generated Containerfile
        if: inputs.resume_run == '' && inputs.resume_digest == ''
        run: |
          mkdir -p .bluebuild
          bluebuild validate "recipes/$PROFILE.yml"
          bluebuild generate --registry ghcr.io --registry-namespace closure-labs \
            -o ".bluebuild/$PROFILE.Containerfile" "recipes/$PROFILE.yml"
      - name: Stage pinned payload
        if: inputs.resume_run == '' && inputs.resume_digest == ''
        run: python3 scripts/bluebuild/measure.py payload-staging bash scripts/bluebuild/stage.sh "$PROFILE"
      - name: Set up the BlueBuild builder
        if: inputs.resume_run == '' && inputs.resume_digest == ''
        # CLI v0.9.37 omits --load in Actions. Its named builder can opt in;
        # publication's explicit registry output still takes precedence.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: bluebuild
          driver: docker-container
          driver-opts: default-load=true
          use: false
          cache-binary: true
      - name: Build with BlueBuild
        if: inputs.resume_run == '' && inputs.resume_digest == ''
        # The CLI and cosign are already verified/locked above and by flake.lock.
        # The upstream composite action downloads and installs both a second time.
        env:
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
          BB_PASSWORD: ${{ github.token }}
          BB_USERNAME: ${{ github.repository_owner }}
          GH_PR_EVENT_NUMBER: ${{ github.event.number || '' }}
          RUST_LOG_STYLE: always
          CLICOLOR_FORCE: "1"
        run: >-
          python3
          scripts/bluebuild/measure.py image-build bash scripts/bluebuild/build.sh "$PROFILE" "$PUBLISH"
      - name: Verify assembled image
        if: inputs.resume_run == '' && inputs.resume_digest == ''
        id: inspect
        env:
          PUBLISH: ${{ inputs.publish }}
        run: bash scripts/bluebuild/inspect-built.sh "$PROFILE" "$CHANNEL" "$PUBLISH"
      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .bluebuild/
          include-hidden-files: true
          retention-days: 14
      - name: Diagnose the assembled unpublished candidate
        if: inputs.diagnostic_security && !inputs.publish
        run: bash scripts/ci/diagnose-built-candidate.sh "$PROFILE"
      - name: Retain diagnostic evidence including policy blockers
        if: always() && inputs.diagnostic_security && !inputs.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .bluebuild/diagnostic-${{ inputs.profile }}/
          include-hidden-files: true
          retention-days: 30
