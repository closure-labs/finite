name: Build one BlueBuild image
on:
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      channel:
        type: string
        required: true
      publish:
        type: boolean
        default: false
      force_qualification:
        type: boolean
        default: false
    outputs:
      digest:
        value: ${{ jobs.build.outputs.digest }}
      previous:
        value: ${{ jobs.build.outputs.previous }}
      identity:
        value: ${{ jobs.build.outputs.identity }}
      qualify:
        value: ${{ jobs.build.outputs.qualify }}
      evidence:
        value: ${{ jobs.build.outputs.evidence }}
    secrets:
      cosign_private_key:
        required: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      digest: ${{ steps.inspect.outputs.digest }}
      previous: ${{ steps.prepare.outputs.previous }}
      identity: ${{ steps.prepare.outputs.identity }}
      qualify: ${{ steps.prepare.outputs.qualify }}
      evidence: ${{ steps.prepare.outputs.evidence }}
    env:
      PROFILE: ${{ inputs.profile }}
      CHANNEL: ${{ inputs.channel }}
      FINITE_QUALIFICATION_MODE: enforce
      FORCE_QUALIFICATION: ${{ inputs.force_qualification }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: Make room for the image build
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: "80G"
      - name: Prepare candidate publication
        id: prepare
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          args=()
          if [[ $PUBLISH == true ]]; then args+=(--publish); fi
          nix develop --file lib/ci-tools.nix shell --command python3 \
            scripts/bluebuild/publication.py prepare "$PROFILE" "${args[@]}"
          echo "evidence=image-$PROFILE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"
      - name: Install the verified locked BlueBuild CLI
        run: nix develop --file lib/ci-tools.nix shell --command bash scripts/bluebuild/install-cli.sh
      - name: Stage pinned payload
        run: python3 scripts/bluebuild/measure.py payload-staging bash scripts/bluebuild/stage.sh "$PROFILE"
      - name: Set up the BlueBuild builder
        # CLI v0.9.37 omits --load in Actions. Its named builder can opt in;
        # publication's explicit registry output still takes precedence.
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          name: bluebuild
          driver: docker-container
          driver-opts: default-load=true
          use: false
          cache-binary: true
      - name: Build with BlueBuild
        # The CLI and cosign are already verified/locked above and by flake.lock.
        # The upstream composite action downloads and installs both a second time.
        env:
          PUBLISH: ${{ inputs.publish }}
          COSIGN_PRIVATE_KEY: ${{ inputs.publish && secrets.cosign_private_key || '' }}
          GH_TOKEN: ${{ github.token }}
          BB_PASSWORD: ${{ github.token }}
          BB_USERNAME: ${{ github.repository_owner }}
          GH_PR_EVENT_NUMBER: ${{ github.event.number || '' }}
          RUST_LOG_STYLE: always
          CLICOLOR_FORCE: "1"
        run: >-
          nix develop --file lib/ci-tools.nix shell --command python3
          scripts/bluebuild/measure.py image-build bash scripts/bluebuild/build.sh "$PROFILE" "$PUBLISH"
      - name: Validate recipes and record generated Containerfile
        run: |
          mkdir -p .bluebuild
          nix develop --file lib/ci-tools.nix shell --command bluebuild validate "recipes/$PROFILE.yml"
          nix develop --file lib/ci-tools.nix shell --command bluebuild generate --registry ghcr.io --registry-namespace closure-labs \
            -o ".bluebuild/$PROFILE.Containerfile" "recipes/$PROFILE.yml"
      - name: Verify assembled image
        id: inspect
        env:
          PUBLISH: ${{ inputs.publish }}
        run: nix develop --file lib/ci-tools.nix shell --command bash scripts/bluebuild/inspect-built.sh "$PROFILE" "$CHANNEL" "$PUBLISH"
      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .bluebuild/
          include-hidden-files: true
          retention-days: 14
