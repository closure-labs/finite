name: Release Purplefin

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Automatic uses conventional commits; override only when release impact differs
        required: true
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

concurrency:
  group: purplefin-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  IMAGE_REF: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    name: Select version and build every profile
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: write
      contents: write
    outputs:
      source_sha: ${{ steps.version.outputs.source_sha }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3

      - name: Calculate and commit the release version
        id: version
        env:
          REQUESTED_BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          [[ "${GITHUB_REF}" == refs/heads/main ]] || {
            echo "Releases may run only from main" >&2
            exit 1
          }
          initial_sha="$(git rev-parse HEAD)"
          [[ "${initial_sha}" == "${GITHUB_SHA}" ]] || {
            echo "Checkout does not match the dispatched commit" >&2
            exit 1
          }
          source_version="$(<VERSION)"
          [[ "${source_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?$ ]] || {
            echo "VERSION must contain X.Y.Z or X.Y.Z-dev.N" >&2
            exit 1
          }

          last_tag="$({
            git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              head -n 1 || true
          })"
          if [[ -z "${last_tag}" ]]; then
            version="${source_version%%-dev.*}"
            selected_bump="initial"
          else
            git merge-base --is-ancestor "${last_tag}" HEAD || {
              echo "Latest release tag ${last_tag} is not an ancestor of main" >&2
              exit 1
            }
            meaningful_commits="$({
              git log "${last_tag}..HEAD" \
                --format='%H' \
                --invert-grep \
                --grep='^Start Purplefin [0-9]\+\.[0-9]\+\.[0-9]\+-dev\.[0-9]\+$'
            })"
            [[ -n "${meaningful_commits}" ]] || {
              echo "No releasable commits exist after ${last_tag}" >&2
              exit 1
            }

            base_version="${last_tag#v}"
            IFS=. read -r major minor patch <<<"${base_version}"
            selected_bump="${REQUESTED_BUMP}"
            if [[ "${selected_bump}" == auto ]]; then
              release_log="$({
                git log "${last_tag}..HEAD" \
                  --format='%s%n%b' \
                  --invert-grep \
                  --grep='^Start Purplefin [0-9]\+\.[0-9]\+\.[0-9]\+-dev\.[0-9]\+$'
              })"
              if grep -Eq \
                '(^[[:alnum:]-]+(\([^)]*\))?!:)|(^BREAKING[ -]CHANGE:)' \
                <<<"${release_log}"; then
                selected_bump="major"
              elif grep -Eq '^feat(\([^)]*\))?:' <<<"${release_log}"; then
                selected_bump="minor"
              else
                selected_bump="patch"
              fi
            fi
            case "${selected_bump}" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="${major}.$((minor + 1)).0" ;;
              patch) version="${major}.${minor}.$((patch + 1))" ;;
              *)
                echo "Unsupported release bump: ${selected_bump}" >&2
                exit 1
                ;;
            esac
          fi

          tag="v${version}"
          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            echo "Release tag ${tag} already exists" >&2
            exit 1
          fi

          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          [[ "${remote_sha}" == "${initial_sha}" ]] || {
            echo "Main advanced after this release was dispatched" >&2
            exit 1
          }
          if [[ "${source_version}" != "${version}" ]]; then
            printf '%s\n' "${version}" >VERSION
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add VERSION
            git commit -m "Release Purplefin ${version}"
            gh auth setup-git
            git push origin HEAD:main
          fi
          source_sha="$(git rev-parse HEAD)"
          {
            echo "source_sha=${source_sha}"
            echo "tag=${tag}"
            echo "version=${version}"
          } >>"${GITHUB_OUTPUT}"
          printf 'Selected %s with a %s bump from %s\n' \
            "${tag}" "${selected_bump}" "${last_tag:-VERSION seed}"

      - name: Materialize Flake-generated build artifacts
        run: nix run .#export-artifacts -- .

      - name: Reuse or dispatch the release-candidate build
        id: build
        env:
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        shell: bash
        run: |
          run_id=''
          for _ in {1..6}; do
            run_id="$({
              gh run list \
                --workflow build.yml \
                --commit "${SOURCE_SHA}" \
                --limit 20 \
                --json conclusion,databaseId,status \
                --jq '.[] | select(.status == "queued" or .status == "in_progress" or .conclusion == "success") | .databaseId' |
                head -n 1
            })"
            [[ -z "${run_id}" ]] || break
            sleep 5
          done
          if [[ -z "${run_id}" ]]; then
            remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
            [[ "${remote_sha}" == "${SOURCE_SHA}" ]] || {
              echo "Main advanced before the candidate build was dispatched" >&2
              exit 1
            }
            previous_run_id="$({
              gh run list \
                --workflow build.yml \
                --event workflow_dispatch \
                --commit "${SOURCE_SHA}" \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty'
            })"
            gh workflow run build.yml --ref main -f force=true
            for _ in {1..24}; do
              run_id="$({
                gh run list \
                  --workflow build.yml \
                  --event workflow_dispatch \
                  --commit "${SOURCE_SHA}" \
                  --limit 5 \
                  --json databaseId \
                  --jq ".[] | select((.databaseId | tostring) != \"${previous_run_id}\") | .databaseId" |
                  head -n 1
              })"
              [[ -z "${run_id}" ]] || break
              sleep 5
            done
            [[ -n "${run_id}" ]] || {
              echo "Could not locate the release-candidate build" >&2
              exit 1
            }
          fi
          echo "run-id=${run_id}" >>"${GITHUB_OUTPUT}"

      - name: Wait for the release-candidate build
        env:
          RUN_ID: ${{ steps.build.outputs.run-id }}
        shell: bash
        run: gh run watch "${RUN_ID}" --exit-status

      - name: Require every published profile from the release source
        env:
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          profiles_are_current() {
            local entry expected_input metadata primary_tag profile
            while IFS= read -r entry; do
              profile="$(jq -r '.profile' <<<"${entry}")"
              primary_tag="$(jq -r '.tags | split(" ")[0]' <<<"${entry}")"
              expected_input="$(jq -r '.build_input' <<<"${entry}")"
              metadata="$({
                skopeo inspect --retry-times 3 \
                  "docker://${IMAGE_REF}:${primary_tag}"
              })" || return 1
              [[ "$(jq -er '.Labels["org.opencontainers.image.revision"]' <<<"${metadata}")" == "${SOURCE_SHA}" ]] || return 1
              [[ "$(jq -er '.Labels["org.opencontainers.image.version"]' <<<"${metadata}")" == "${VERSION}" ]] || return 1
              [[ "$(jq -er '.Labels["io.purplefin.build.profile"]' <<<"${metadata}")" == "${profile}" ]] || return 1
              [[ "$(jq -er '.Labels["io.purplefin.build.input"]' <<<"${metadata}")" == "${expected_input}" ]] || return 1
            done < <(jq -c '.[]' bootc/generated/image-matrix.json)
          }

          if ! profiles_are_current; then
            echo "The reusable build did not publish every release profile; forcing a complete candidate build"
            remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
            [[ "${remote_sha}" == "${SOURCE_SHA}" ]] || {
              echo "Main advanced before the complete candidate build" >&2
              exit 1
            }
            previous_run_id="$({
              gh run list \
                --workflow build.yml \
                --event workflow_dispatch \
                --commit "${SOURCE_SHA}" \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty'
            })"
            gh workflow run build.yml --ref main -f force=true
            run_id=''
            for _ in {1..24}; do
              run_id="$({
                gh run list \
                  --workflow build.yml \
                  --event workflow_dispatch \
                  --commit "${SOURCE_SHA}" \
                  --limit 5 \
                  --json databaseId \
                  --jq ".[] | select((.databaseId | tostring) != \"${previous_run_id}\") | .databaseId" |
                  head -n 1
              })"
              [[ -z "${run_id}" ]] || break
              sleep 5
            done
            [[ -n "${run_id}" ]] || {
              echo "Could not locate the complete candidate build" >&2
              exit 1
            }
            gh run watch "${run_id}" --exit-status
            profiles_are_current
          fi

  release:
    name: Promote tested digests and release source
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      actions: write
      attestations: read
      contents: write
      packages: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3

      - name: Materialize Flake-generated build artifacts
        run: nix run .#export-artifacts -- .

      - name: Validate release versions and source
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          release_pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          [[ "${VERSION}" =~ ${release_pattern} ]]
          [[ "$(<VERSION)" == "${VERSION}" ]]
          [[ "${SOURCE_SHA}" == "$(git rev-parse HEAD)" ]]
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          [[ "${remote_sha}" == "${SOURCE_SHA}" ]]
          if git rev-parse --verify --quiet "refs/tags/v${VERSION}"; then
            echo "Release tag v${VERSION} already exists" >&2
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3

      - name: Log in to GHCR
        shell: bash
        run: |
          install -d -m 0700 "${HOME}/.docker"
          registry_auth_file="${HOME}/.docker/config.json"
          printf '%s' "${GH_TOKEN}" |
            podman login \
              --authfile "${registry_auth_file}" \
              ghcr.io \
              --username "${GITHUB_ACTOR}" \
              --password-stdin
          echo "REGISTRY_AUTH_FILE=${registry_auth_file}" >>"${GITHUB_ENV}"

      - name: Verify and promote existing image digests
        env:
          COSIGN_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build-profile.yml@refs/heads/main
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          images='[]'
          install -d -m 0755 release-sboms
          while IFS= read -r entry; do
            profile="$(jq -r '.profile' <<<"${entry}")"
            primary_tag="$(jq -r '.tags | split(" ")[0]' <<<"${entry}")"
            source_ref="${IMAGE_REF}:${primary_tag}"
            metadata="$(skopeo inspect --retry-times 3 "docker://${source_ref}")"
            digest="$(jq -er '.Digest' <<<"${metadata}")"
            revision="$(jq -er '.Labels["org.opencontainers.image.revision"]' <<<"${metadata}")"
            image_version="$(jq -er '.Labels["org.opencontainers.image.version"]' <<<"${metadata}")"
            base_digest="$(jq -er '.Labels["org.opencontainers.image.base.digest"]' <<<"${metadata}")"
            build_input="$(jq -er '.Labels["io.purplefin.build.input"]' <<<"${metadata}")"
            [[ "${revision}" == "${SOURCE_SHA}" ]]
            [[ "${image_version}" == "${VERSION}" ]]

            immutable_ref="${IMAGE_REF}@${digest}"
            cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "${COSIGN_IDENTITY}" \
              "${immutable_ref}" >/dev/null
            gh attestation verify "oci://${immutable_ref}" \
              --bundle-from-oci \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/build-profile.yml" \
              --source-digest "${SOURCE_SHA}"
            gh attestation verify "oci://${immutable_ref}" \
              --bundle-from-oci \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/build-profile.yml" \
              --source-digest "${SOURCE_SHA}" \
              --predicate-type https://spdx.dev/Document/v2.3

            release_tag="${profile}-v${VERSION}"
            oras tag \
              --registry-config "${REGISTRY_AUTH_FILE}" \
              "${immutable_ref}" \
              "${release_tag}"
            release_digest="$({
              skopeo inspect --retry-times 3 --format '{{.Digest}}' \
                "docker://${IMAGE_REF}:${release_tag}"
            })"
            [[ "${release_digest}" == "${digest}" ]]

            digest_key="${digest#sha256:}"
            sbom_cache_ref="${IMAGE_REF}-sbom-cache:${profile}-${build_input}-${digest_key:0:16}"
            sbom_manifest="$({
              oras manifest fetch \
                --registry-config "${REGISTRY_AUTH_FILE}" \
                "${sbom_cache_ref}"
            })"
            jq -e \
              --arg build_input "${build_input}" \
              --arg digest "${digest}" \
              --arg profile "${profile}" '
                .artifactType == "application/spdx+json" and
                .annotations["io.purplefin.build.input"] == $build_input and
                .annotations["io.purplefin.build.profile"] == $profile and
                .annotations["io.purplefin.subject.digest"] == $digest and
                (.layers | length) == 1 and
                .layers[0].mediaType == "application/spdx+json"
              ' <<<"${sbom_manifest}" >/dev/null
            sbom_dir="$(mktemp -d -p "${RUNNER_TEMP}" "purplefin-${profile}-sbom.XXXXXX")"
            oras pull \
              --registry-config "${REGISTRY_AUTH_FILE}" \
              --output "${sbom_dir}" \
              "${sbom_cache_ref}"
            sbom="${sbom_dir}/sbom.spdx.json"
            jq -e '
              type == "object" and
              (.spdxVersion | type == "string" and startswith("SPDX-")) and
              (.packages | type == "array")
            ' "${sbom}" >/dev/null
            sbom_asset="purplefin-${profile}-v${VERSION}.spdx.json.gz"
            gzip -9c "${sbom}" >"release-sboms/${sbom_asset}"
            rm -f -- "${sbom}"
            rmdir -- "${sbom_dir}"

            image="$({
              jq -cn \
                --arg profile "${profile}" \
                --arg channel_tag "${primary_tag}" \
                --arg release_tag "${release_tag}" \
                --arg digest "${digest}" \
                --arg base_digest "${base_digest}" \
                --arg build_input "${build_input}" \
                --arg sbom_asset "${sbom_asset}" \
                '{profile: $profile, channel_tag: $channel_tag, release_tag: $release_tag, digest: $digest, base_digest: $base_digest, build_input: $build_input, sbom_asset: $sbom_asset}'
            })"
            images="$(jq -c --argjson image "${image}" '. + [$image]' <<<"${images}")"
          done < <(jq -c '.[]' bootc/generated/image-matrix.json)

          jq -n \
            --arg version "${VERSION}" \
            --arg source_commit "${SOURCE_SHA}" \
            --arg image "${IMAGE_REF}" \
            --argjson images "${images}" \
            '{version: $version, source_commit: $source_commit, image: $image, images: $images}' \
            >release-manifest.json
          sha256sum release-manifest.json >release-manifest.json.sha256

      - name: Create Git tag and GitHub release
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          mapfile -t sbom_assets < <(find release-sboms -type f -name '*.spdx.json.gz' -print | sort)
          expected_assets="$(jq 'length' bootc/generated/image-matrix.json)"
          (( ${#sbom_assets[@]} == expected_assets ))
          nix run .#release-notes -- "${VERSION}" CHANGELOG.md >release-notes.md
          grep -q '[^[:space:]]' release-notes.md
          gh release create "v${VERSION}" \
            release-manifest.json \
            release-manifest.json.sha256 \
            "${sbom_assets[@]}" \
            --draft \
            --notes-file release-notes.md \
            --target "${SOURCE_SHA}" \
            --title "Purplefin ${VERSION}"
          gh release edit "v${VERSION}" --draft=false

      - name: Commit the next development version
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          IFS=. read -r major minor patch <<<"${VERSION}"
          next_version="${major}.${minor}.$((patch + 1))-dev.0"
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          [[ "${remote_sha}" == "${SOURCE_SHA}" ]] || {
            echo "Main advanced before the post-release version commit" >&2
            exit 1
          }
          printf '%s\n' "${next_version}" >VERSION
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add VERSION
          git commit -m "Start Purplefin ${next_version}"
          gh auth setup-git
          git push origin HEAD:main

      - name: Log out of GHCR
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          registry_auth_file="${REGISTRY_AUTH_FILE:-${HOME}/.docker/config.json}"
          podman logout --authfile "${registry_auth_file}" ghcr.io || true
          rm -f "${registry_auth_file}"
