name: Prepare qualified release
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        required: true
        options: [finite, finite-next, finite-dev, finite-dev-next]
      iso_run:
        description: Successful ISO run at this revision
        type: string
        required: true
      build_run:
        description: Successful build run with Secure Boot acceptance at this revision
        type: string
        required: true
      tag:
        description: New per-channel release tag (finite-CHANNEL-VERSION)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: finite-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      artifact: ${{ steps.artifact-name.outputs.name }}
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: "80G"
      - uses: ./.github/actions/setup-nix
      - name: Validate and collect qualified evidence
        id: evidence
        env:
          CHANNEL: ${{ inputs.channel }}
          ISO_RUN: ${{ inputs.iso_run }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: nix develop --file lib/ci-tools.nix shell --command python3 scripts/bluebuild/release-evidence.py "$CHANNEL" "$ISO_RUN" "$BUILD_RUN"
      - name: Rescan the qualified immutable image before release
        env:
          IMAGE: ${{ steps.evidence.outputs.image }}
        run: |
          nix develop --file lib/ci-tools.nix release --command bash scripts/bluebuild/security-run.sh \
            "$IMAGE" .bluebuild/release-security
          cp .bluebuild/release-security/*.json .bluebuild/release/
      - name: Record release artifact identity
        id: artifact-name
        run: echo "name=unsigned-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"
      - name: Save unsigned release assets
        id: assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .bluebuild/release/
          include-hidden-files: true
          retention-days: 14
      - name: Save security evidence even when the release is blocked
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: .bluebuild/release-security/
          include-hidden-files: true
          retention-days: 90

  sign-release:
    needs: release
    if: github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            cosign.pub
            scripts/bluebuild/sign-release.sh
          sparse-checkout-cone-mode: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download completed release evidence
        env:
          ARTIFACT: ${{ needs.release.outputs.artifact }}
        run: gh run download "$GITHUB_RUN_ID" --name "$ARTIFACT" --dir .bluebuild/release
      - name: Sign release manifest in an isolated job
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: bash scripts/bluebuild/sign-release.sh
      - name: Create draft release with durable evidence
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ $RELEASE_TAG =~ ^finite-[a-z0-9][a-z0-9.-]*$ ]]
          gh release create "$RELEASE_TAG" .bluebuild/release/* --draft --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" --notes 'Qualified image, signed checksums, enforced vulnerability policy, SBOM, provenance and acceptance evidence. Review before publishing. Large ISO images are split; concatenate parts in filename order before use.'
