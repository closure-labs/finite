name: Retired — per-channel release (use Prepare two-image release approval)
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        required: true
        options: [finite, finite-dev]
      iso_run:
        description: Optional successful ISO run; defaults to the ISO qualified by build_run
        type: string
        required: false
        default: ""
      build_run:
        description: Successful build run with Secure Boot acceptance at this revision
        type: string
        required: true
      tag:
        description: New per-channel release tag (finite-VERSION or finite-dev-VERSION)
        type: string
        required: true
# Bootstrap public options; setup-nix resolves them through SecretSpec.
env:
  FINITE_OPTIMIZED_CACHES: ${{ vars.FINITE_OPTIMIZED_CACHES }}
  FINITE_CACHIX_WRITER: ${{ vars.FINITE_CACHIX_WRITER }}
  FINITE_REUSE_INVENTORY: ${{ vars.FINITE_REUSE_INVENTORY }}
  FINITE_GRYPE_DB_CACHE: ${{ vars.FINITE_GRYPE_DB_CACHE }}
  FINITE_QUALIFICATION_REUSE: ${{ vars.FINITE_QUALIFICATION_REUSE }}
  FINITE_QUALIFIED_ISO_PRESERVATION: ${{ vars.FINITE_QUALIFIED_ISO_PRESERVATION }}
  FINITE_QUALIFIED_ISO_CHANNELS: ${{ vars.FINITE_QUALIFIED_ISO_CHANNELS }}

permissions:
  contents: read
concurrency:
  group: finite-official-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      artifact: ${{ steps.artifact-name.outputs.name }}
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Monitor hosted runner (Community)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce legacy release boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/legacy-release-boundary.py
      - name: Validate release request
        env:
          CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_RUN: ${{ inputs.build_run }}
          ISO_RUN: ${{ inputs.iso_run }}
        run: python3 scripts/ci/release-request.py --check-tag
      - uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: "80G"
      - uses: $/.github/actions/setup-nix
      - name: Validate and collect qualified evidence
        id: evidence
        env:
          CHANNEL: ${{ inputs.channel }}
          ISO_RUN: ${{ inputs.iso_run }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: nix develop --file lib/ci-tools.nix shell --command python3 scripts/bluebuild/release-evidence.py "$CHANNEL" "$ISO_RUN" "$BUILD_RUN"
      - name: Restore Grype database transport cache (pilot)
        if: env.FINITE_GRYPE_DB_CACHE == 'true'
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: grype-db-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-prefixes-first-match: grype-db-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
          nix: false
          paths: ~/.cache/grype/db
          save: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
      - name: Rescan the qualified immutable image before release
        env:
          IMAGE: ${{ steps.evidence.outputs.image }}
        run: |
          nix develop --file lib/ci-tools.nix release --command bash scripts/bluebuild/security-run.sh \
            "$IMAGE" .bluebuild/release-security
          cp .bluebuild/release-security/*.json .bluebuild/release/
      - name: Record release artifact identity
        id: artifact-name
        run: echo "name=unsigned-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"
      - name: Save unsigned release assets
        id: assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .bluebuild/release/
          include-hidden-files: true
          retention-days: 14
      - name: Save security evidence even when the release is blocked
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: .bluebuild/release-security/
          include-hidden-files: true
          retention-days: 90

  sign-release:
    needs: release
    if: github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Monitor hosted runner (Community)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            cosign.pub
            VERSION
            CHANGELOG.md
            secretspec.toml
            flake.lock
            .github/actions/setup-nix/
            lib/
            scripts/ci/nix-resources.py
            scripts/ci/nix-cache.py
            scripts/ci/ci-options.py
            scripts/ci/release-request.py
            scripts/ci/legacy-release-boundary.py
            automation/security/image-policy.json
            scripts/ci/create-release-draft.sh
            scripts/bluebuild/sign-release.sh
            sources/secretspec.json
          sparse-checkout-cone-mode: false
      - name: Enforce legacy release boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/legacy-release-boundary.py
      - name: Validate release request
        env:
          CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_RUN: ${{ inputs.build_run }}
          ISO_RUN: ${{ inputs.iso_run }}
        run: python3 scripts/ci/release-request.py --check-tag
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: $/.github/actions/setup-nix
        with:
          cache-mode: none
      - name: Prepare pinned signing credential resolver
        run: | # zizmor: ignore[github-env]
          resolver=$(nix build --file lib/ci-tools.nix ci-secrets-run --no-link --print-out-paths)
          [[ $resolver =~ ^/nix/store/[a-z0-9]{32}-finite-ci-secrets-run$ ]]
          echo "$resolver/bin" >>"$GITHUB_PATH"
      - name: Download completed release evidence
        env:
          ARTIFACT: ${{ needs.release.outputs.artifact }}
        run: gh run download "$GITHUB_RUN_ID" --name "$ARTIFACT" --dir .bluebuild/release
      - name: Recheck current main policy before signing credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/legacy-release-boundary.py
      - name: Sign release manifest in an isolated job
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: finite-ci-secrets-run release-signing -- bash scripts/bluebuild/sign-release.sh
      - name: Recheck current main policy before publication credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/legacy-release-boundary.py
      - name: Create draft release with durable evidence
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_PAT }}
        run: finite-ci-secrets-run release-publishing -- bash scripts/ci/create-release-draft.sh
