name: Release Purplefin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version already present in VERSION (for example 0.1.0)
        required: true
        type: string
      next-version:
        description: Development version committed after release (for example 0.1.1-dev.0)
        required: true
        type: string

concurrency:
  group: purplefin-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  IMAGE_REF: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    name: Build every profile from the release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Validate and dispatch the release-candidate build
        id: build
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(<VERSION)" == "${VERSION}" ]]
          [[ "${GITHUB_SHA}" == "$(git rev-parse HEAD)" ]]
          if git rev-parse --verify --quiet "refs/tags/v${VERSION}"; then
            echo "Release tag v${VERSION} already exists" >&2
            exit 1
          fi

          previous_run_id="$({
            gh run list \
              --workflow build.yml \
              --event workflow_dispatch \
              --commit "${GITHUB_SHA}" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          })"
          gh workflow run build.yml --ref main -f force=true
          run_id=''
          for _ in {1..12}; do
            run_id="$({
              gh run list \
                --workflow build.yml \
                --event workflow_dispatch \
                --commit "${GITHUB_SHA}" \
                --limit 5 \
                --json databaseId \
                --jq ".[] | select((.databaseId | tostring) != \"${previous_run_id}\") | .databaseId" |
                head -n 1
            })"
            [[ -z "${run_id}" ]] || break
            sleep 5
          done
          [[ -n "${run_id}" ]]
          echo "run-id=${run_id}" >>"${GITHUB_OUTPUT}"

      - name: Wait for the release-candidate build
        env:
          RUN_ID: ${{ steps.build.outputs.run-id }}
        shell: bash
        run: gh run watch "${RUN_ID}" --exit-status

  release:
    name: Promote tested digests and release source
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      actions: write
      contents: write
      packages: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Validate release versions and source
        env:
          NEXT_VERSION: ${{ inputs.next-version }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          release_pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          development_pattern='^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$'
          [[ "${VERSION}" =~ ${release_pattern} ]]
          [[ "${NEXT_VERSION}" =~ ${development_pattern} ]]
          [[ "$(<VERSION)" == "${VERSION}" ]]
          [[ "${NEXT_VERSION}" != "${VERSION}" ]]
          [[ "${GITHUB_SHA}" == "$(git rev-parse HEAD)" ]]
          if git rev-parse --verify --quiet "refs/tags/v${VERSION}"; then
            echo "Release tag v${VERSION} already exists" >&2
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        shell: bash
        run: |
          install -d -m 0700 "${HOME}/.docker"
          registry_auth_file="${HOME}/.docker/config.json"
          printf '%s' "${GH_TOKEN}" |
            podman login \
              --authfile "${registry_auth_file}" \
              ghcr.io \
              --username "${GITHUB_ACTOR}" \
              --password-stdin
          echo "REGISTRY_AUTH_FILE=${registry_auth_file}" >>"${GITHUB_ENV}"

      - name: Verify and promote existing image digests
        env:
          COSIGN_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build-profile.yml@refs/heads/main
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          images='[]'
          while IFS= read -r entry; do
            profile="$(jq -r '.profile' <<<"${entry}")"
            primary_tag="$(jq -r '.tags | split(" ")[0]' <<<"${entry}")"
            source_ref="${IMAGE_REF}:${primary_tag}"
            metadata="$(skopeo inspect --retry-times 3 "docker://${source_ref}")"
            digest="$(jq -er '.Digest' <<<"${metadata}")"
            revision="$(jq -er '.Labels["org.opencontainers.image.revision"]' <<<"${metadata}")"
            image_version="$(jq -er '.Labels["org.opencontainers.image.version"]' <<<"${metadata}")"
            base_digest="$(jq -er '.Labels["org.opencontainers.image.base.digest"]' <<<"${metadata}")"
            build_input="$(jq -er '.Labels["io.purplefin.build.input"]' <<<"${metadata}")"
            [[ "${revision}" == "${GITHUB_SHA}" ]]
            [[ "${image_version}" == "${VERSION}" ]]

            immutable_ref="${IMAGE_REF}@${digest}"
            cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "${COSIGN_IDENTITY}" \
              "${immutable_ref}" >/dev/null

            release_tag="${profile}-v${VERSION}"
            skopeo copy --all "docker://${immutable_ref}" "docker://${IMAGE_REF}:${release_tag}"
            image="$({
              jq -cn \
                --arg profile "${profile}" \
                --arg channel_tag "${primary_tag}" \
                --arg release_tag "${release_tag}" \
                --arg digest "${digest}" \
                --arg base_digest "${base_digest}" \
                --arg build_input "${build_input}" \
                '{profile: $profile, channel_tag: $channel_tag, release_tag: $release_tag, digest: $digest, base_digest: $base_digest, build_input: $build_input}'
            })"
            images="$(jq -c --argjson image "${image}" '. + [$image]' <<<"${images}")"
          done < <(jq -c '.[]' build_files/image-matrix.json)

          jq -n \
            --arg version "${VERSION}" \
            --arg source_commit "${GITHUB_SHA}" \
            --arg image "${IMAGE_REF}" \
            --argjson images "${images}" \
            '{version: $version, source_commit: $source_commit, image: $image, images: $images}' \
            >release-manifest.json
          sha256sum release-manifest.json >release-manifest.json.sha256

      - name: Create Git tag and GitHub release
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          gh release create "v${VERSION}" \
            release-manifest.json \
            release-manifest.json.sha256 \
            --generate-notes \
            --target "${GITHUB_SHA}" \
            --title "Purplefin ${VERSION}"

      - name: Commit the next development version
        env:
          NEXT_VERSION: ${{ inputs.next-version }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          printf '%s\n' "${NEXT_VERSION}" >VERSION
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add VERSION
          git commit -m "Start Purplefin ${NEXT_VERSION}"
          gh auth setup-git
          git push origin HEAD:main
          gh workflow run build.yml --ref main -f force=false

      - name: Log out of GHCR
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          registry_auth_file="${REGISTRY_AUTH_FILE:-${HOME}/.docker/config.json}"
          podman logout --authfile "${registry_auth_file}" ghcr.io || true
          rm -f "${registry_auth_file}"
