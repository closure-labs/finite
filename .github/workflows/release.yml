name: Release Finite

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Automatic uses conventional commits; override only when release impact differs
        required: true
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

concurrency:
  group: finite-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  IMAGE_REF: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    name: Select version and build every profile
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Set up Nix and Cachix
        uses: ./.github/actions/setup-nix
        with:
          merge-queue-token: ${{ secrets.MERGE_QUEUE_TOKEN }}
          require-merge-queue-token: "true"

      - name: Calculate the release version
        id: version
        env:
          REQUESTED_BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          report="${RUNNER_TEMP}/finite-release-version.json"
          nix shell --accept-flake-config .#ci-release-control \
            -c finite-release-control select-version >"${report}"
          nix shell --accept-flake-config .#ci-github-output \
            -c finite-github-output "${report}" >/dev/null

      - name: Open the release version pull request
        id: release-version
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ env.MERGE_QUEUE_TOKEN }}
          base: main
          branch: automation/release-${{ steps.version.outputs.tag }}
          delete-branch: true
          commit-message: Release Finite ${{ steps.version.outputs.version }}
          title: Release Finite ${{ steps.version.outputs.version }}
          body: |
            Sets the stable source version for `${{ steps.version.outputs.tag }}`.

            The release continues only after the protected `main` branch accepts
            this commit through the required CI gate.

      - name: Validate and merge the release version
        if: >-
          steps.release-version.outputs.pull-request-number != '' &&
          steps.release-version.outputs.pull-request-operation != 'closed'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_AUTHOR: ${{ vars.AUTOMATION_UPDATE_LOGIN || 'app/github-actions' }}
          EXPECTED_BRANCH: automation/release-${{ steps.version.outputs.tag }}
          EXPECTED_FILES: VERSION
          EXPECTED_TITLE: Release Finite ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ env.MERGE_QUEUE_TOKEN }}
          PR_NUMBER: ${{ steps.release-version.outputs.pull-request-number }}
        run: >-
          nix shell --accept-flake-config .#ci-trusted-update
          -c finite-trusted-update

      - name: Resolve the protected release source
        id: source
        env:
          INITIAL_SHA: ${{ steps.version.outputs.initial_sha }}
          PR_NUMBER: ${{ steps.release-version.outputs.pull-request-number }}
          PR_OPERATION: ${{ steps.release-version.outputs.pull-request-operation }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          report="${RUNNER_TEMP}/finite-release-source.json"
          nix shell --accept-flake-config .#ci-release-control \
            -c finite-release-control resolve-source >"${report}"
          nix shell --accept-flake-config .#ci-github-output \
            -c finite-github-output "${report}" >/dev/null

      - name: Resolve Flake-generated build artifacts
        run: echo "FINITE_GENERATED_ROOT=$(nix build .#generated --no-link --print-out-paths)" >>"${GITHUB_ENV}"

      - name: Reuse or dispatch the release-candidate build
        id: build
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          report="${RUNNER_TEMP}/finite-candidate-run.json"
          nix shell --accept-flake-config .#ci-release-control \
            -c finite-release-control candidate-run >"${report}"
          nix shell --accept-flake-config .#ci-github-output \
            -c finite-github-output "${report}" >/dev/null

      - name: Wait for the release-candidate build
        env:
          RUN_ID: ${{ steps.build.outputs.run_id }}
        shell: bash
        run: gh run watch "${RUN_ID}" --exit-status

      - name: Require every published profile from the release source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          nix shell --accept-flake-config .#ci-release-control
          -c finite-release-control verify-graph


  release:
    name: Promote tested digests and release source
    needs: prepare
    concurrency:
      group: finite-publication
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: release
    permissions:
      actions: write
      attestations: read
      contents: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up Nix and Cachix
        uses: ./.github/actions/setup-nix
        with:
          merge-queue-token: ${{ secrets.MERGE_QUEUE_TOKEN }}
          require-merge-queue-token: "true"

      - name: Resolve Flake-generated build artifacts
        run: echo "FINITE_GENERATED_ROOT=$(nix build .#generated --no-link --print-out-paths)" >>"${GITHUB_ENV}"

      - name: Validate release versions and source
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          nix shell --accept-flake-config .#ci-release-control
          -c finite-release-control resolve-source

      - name: Log in to GHCR
        shell: bash
        run: |
          install -d -m 0700 "${HOME}/.docker"
          registry_auth_file="${HOME}/.docker/config.json"
          printf '%s' "${GH_TOKEN}" |
            podman login \
              --authfile "${registry_auth_file}" \
              ghcr.io \
              --username "${GITHUB_ACTOR}" \
              --password-stdin
          echo "REGISTRY_AUTH_FILE=${registry_auth_file}" >>"${GITHUB_ENV}"

      - name: Verify and promote existing image digests
        id: promotion
        env:
          COSIGN_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build-profile.yml@refs/heads/main
          SBOM_SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/attest-software-bill-of-materials.yml
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          report="${RUNNER_TEMP}/finite-release-promotion.json"
          nix shell --accept-flake-config .#ci-release-control \
            -c finite-release-control promote >"${report}"
          nix shell --accept-flake-config .#ci-github-output \
            -c finite-github-output "${report}" >/dev/null

      - name: Create Git tag and GitHub release
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          mapfile -t sbom_assets < <(find release-sboms -type f -name '*.spdx.json.gz' -print | sort)
          expected_assets="$(jq 'length' "${FINITE_GENERATED_ROOT}/bootc/generated/image-matrix.json")"
          (( ${#sbom_assets[@]} == expected_assets ))
          nix shell --accept-flake-config .#ci-release-notes \
            -c finite-release-notes "${VERSION}" CHANGELOG.md >release-notes.md
          grep -q '[^[:space:]]' release-notes.md
          gh release create "v${VERSION}" \
            release-manifest.json \
            release-manifest.json.sha256 \
            "${sbom_assets[@]}" \
            --draft \
            --notes-file release-notes.md \
            --target "${SOURCE_SHA}" \
            --title "Finite ${VERSION}"
          gh release edit "v${VERSION}" --draft=false

      - name: Clean generated release assets
        shell: bash
        run: |
          rm -rf -- release-sboms
          rm -f -- release-manifest.json release-manifest.json.sha256 release-notes.md

      - name: Select the next development version
        id: next-version
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          report="${RUNNER_TEMP}/finite-next-version.json"
          nix shell --accept-flake-config .#ci-release-control \
            -c finite-release-control next-version >"${report}"
          nix shell --accept-flake-config .#ci-github-output \
            -c finite-github-output "${report}" >/dev/null

      - name: Open the next development version pull request
        id: development-version
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ env.MERGE_QUEUE_TOKEN }}
          base: main
          branch: automation/start-${{ steps.next-version.outputs.next_version }}
          delete-branch: true
          commit-message: Start Finite ${{ steps.next-version.outputs.next_version }}
          title: Start Finite ${{ steps.next-version.outputs.next_version }}
          body: |
            Starts development after the `${{ needs.prepare.outputs.tag }}` release.

            Protected-branch validation must pass before this version advances.

      - name: Validate and merge the next development version
        if: >-
          steps.development-version.outputs.pull-request-number != '' &&
          steps.development-version.outputs.pull-request-operation != 'closed'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_AUTHOR: ${{ vars.AUTOMATION_UPDATE_LOGIN || 'app/github-actions' }}
          EXPECTED_BRANCH: automation/start-${{ steps.next-version.outputs.next_version }}
          EXPECTED_FILES: VERSION
          EXPECTED_TITLE: Start Finite ${{ steps.next-version.outputs.next_version }}
          GH_TOKEN: ${{ env.MERGE_QUEUE_TOKEN }}
          PR_NUMBER: ${{ steps.development-version.outputs.pull-request-number }}
        run: >-
          nix shell --accept-flake-config .#ci-trusted-update
          -c finite-trusted-update

      - name: Wait for the next development version merge
        if: >-
          steps.development-version.outputs.pull-request-number != '' &&
          steps.development-version.outputs.pull-request-operation != 'closed'
        env:
          PR_NUMBER: ${{ steps.development-version.outputs.pull-request-number }}
        run: >-
          nix shell --accept-flake-config .#ci-release-control
          -c finite-release-control wait-pr

      - name: Log out of GHCR
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          registry_auth_file="${REGISTRY_AUTH_FILE:-${HOME}/.docker/config.json}"
          podman logout --authfile "${registry_auth_file}" ghcr.io || true
          rm -f "${registry_auth_file}"
