name: Publish approved two-image release
on:
  push:
    branches: [main]
    paths: ['automation/decisions/releases/**']
  workflow_dispatch:
    inputs:
      proposal_hash:
        description: Merged maintainer-approved release proposal SHA-256
        type: string
        required: true
      packet_ref:
        description: Optional immutable recovery product packet; must match approved products and trusted producer
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: finite-official-release
  cancel-in-progress: false
env:
  FINITE_REVIEW_BOT_LOGIN: ${{ vars.FINITE_REVIEW_BOT_LOGIN }}
  FINITE_OPTIMIZED_CACHES: ${{ vars.FINITE_OPTIMIZED_CACHES }}
  FINITE_CACHIX_WRITER: ${{ vars.FINITE_CACHIX_WRITER }}
  FINITE_QUALIFICATION_REUSE: ${{ vars.FINITE_QUALIFICATION_REUSE }}
  FINITE_QUALIFIED_ISO_PRESERVATION: ${{ vars.FINITE_QUALIFIED_ISO_PRESERVATION }}
  FINITE_QUALIFIED_ISO_CHANNELS: ${{ vars.FINITE_QUALIFIED_ISO_CHANNELS }}
  FINITE_REUSE_INVENTORY: ${{ vars.FINITE_REUSE_INVENTORY }}
  FINITE_GRYPE_DB_CACHE: ${{ vars.FINITE_GRYPE_DB_CACHE }}
jobs:
  prepare:
    outputs:
      recovered_signed: ${{ steps.prepare.outputs.recovered_signed }}
      proposal_hash: ${{ steps.prepare.outputs.proposal_hash }}
    if: github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - name: Monitor hosted runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: "80G"
      - uses: ./.github/actions/setup-nix
      - name: Realize pinned release tools before authority credentials
        run: nix develop --file lib/ci-tools.nix release --command true
      - name: Resolve declared review App credentials
        env:
          FINITE_REVIEW_CLIENT_ID: ${{ vars.DECIDER_CLIENT || secrets.DECIDER_CLIENT }}
          FINITE_REVIEW_PRIVATE_KEY: ${{ secrets.DECIDER_KEY }}
        run: >-
          finite-ci-secrets-run review-app --
          secretspec export --file secretspec.toml --profile review-app --provider github-actions
          --scope review-app --reason 'Finite release authority verification' --format gha
      - name: Create repository-scoped authority token
        id: initial-authority-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.FINITE_REVIEW_CLIENT_ID }}
          private-key: ${{ env.FINITE_REVIEW_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-members: read
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
      - name: Clear App key before evidence processing
        run: | # zizmor: ignore[github-env]
          printf 'FINITE_REVIEW_CLIENT_ID=\nFINITE_REVIEW_PRIVATE_KEY=\n' >>"$GITHUB_ENV"
      - name: Record publisher correlation before expensive preparation
        env:
          GH_TOKEN: ${{ steps.initial-authority-token.outputs.token }}
          PROPOSAL_HASH: ${{ inputs.proposal_hash }}
        run: nix develop --file lib/ci-tools.nix release --command python3 scripts/ci/execute-release-set.py identity --proposal-hash "$PROPOSAL_HASH"
      - name: Retain native publisher identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-execution-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: .bluebuild/release-execution-identity.json
          if-no-files-found: error
          retention-days: 90
      - name: Stage approved product bytes before renewing authority
        id: stage
        env:
          GH_TOKEN: ${{ steps.initial-authority-token.outputs.token }}
          ARTIFACT_READ_TOKEN: ${{ github.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          PROPOSAL_HASH: ${{ inputs.proposal_hash }}
          PACKET_REF: ${{ inputs.packet_ref }}
        run: |
          nix develop --file lib/ci-tools.nix release --command bash <<'PREPARE'
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          python3 scripts/ci/execute-release-set.py stage --proposal-hash "$PROPOSAL_HASH" --packet-ref "$PACKET_REF"
          PREPARE
      - name: Resolve fresh review App credentials after product transfers
        env:
          FINITE_REVIEW_CLIENT_ID: ${{ vars.DECIDER_CLIENT || secrets.DECIDER_CLIENT }}
          FINITE_REVIEW_PRIVATE_KEY: ${{ secrets.DECIDER_KEY }}
        run: >-
          finite-ci-secrets-run review-app --
          secretspec export --file secretspec.toml --profile review-app --provider github-actions
          --scope review-app --reason 'Finite release authority after product transfers' --format gha
      - name: Create fresh repository-scoped authority token
        id: authority-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.FINITE_REVIEW_CLIENT_ID }}
          private-key: ${{ env.FINITE_REVIEW_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-members: read
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
      - name: Clear fresh App key before scanning
        run: | # zizmor: ignore[github-env]
          printf 'FINITE_REVIEW_CLIENT_ID=\nFINITE_REVIEW_PRIVATE_KEY=\n' >>"$GITHUB_ENV"
      - name: Reauthenticate staged products and rescan both images
        id: prepare
        env:
          GH_TOKEN: ${{ steps.authority-token.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          PROPOSAL_HASH: ${{ inputs.proposal_hash }}
          PACKET_REF: ${{ inputs.packet_ref }}
        run: |
          nix develop --file lib/ci-tools.nix release --command bash <<'PREPARE'
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          python3 scripts/ci/execute-release-set.py prepare --staged --proposal-hash "$PROPOSAL_HASH" --packet-ref "$PACKET_REF"
          PREPARE
      - name: Create a bounded signing request without product bytes
        env:
          GH_TOKEN: ${{ steps.authority-token.outputs.token }}
          PROPOSAL_HASH: ${{ steps.prepare.outputs.proposal_hash }}
        run: >-
          nix develop --file lib/ci-tools.nix release --command python3 scripts/ci/execute-release-set.py
          signing-request --proposal-hash "$PROPOSAL_HASH"
      - name: Retain authenticated signing evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signing-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: .bluebuild/release-signing-request/
          compression-level: 6
          if-no-files-found: error
          retention-days: 90
      - name: Retain preparation failure diagnostics without product payloads
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preparation-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .bluebuild/release-execution/release-set.json
            .bluebuild/release-execution/release-authority.json
            .bluebuild/release-execution/security-*/
            .bluebuild/release-execution/packet/decision-packet.json
          if-no-files-found: warn
          retention-days: 90

  sign:
    needs: prepare
    if: github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Retain the existing human release environment during migration.
    environment: release
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Monitor hosted runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: "80G"
      - uses: ./.github/actions/setup-nix
      - name: Realize pinned release tools before authority credentials
        run: nix develop --file lib/ci-tools.nix release --command true
      - name: Resolve declared review App credentials
        env:
          FINITE_REVIEW_CLIENT_ID: ${{ vars.DECIDER_CLIENT || secrets.DECIDER_CLIENT }}
          FINITE_REVIEW_PRIVATE_KEY: ${{ secrets.DECIDER_KEY }}
        run: >-
          finite-ci-secrets-run review-app --
          secretspec export --file secretspec.toml --profile review-app --provider github-actions
          --scope review-app --reason 'Finite release authority verification' --format gha
      - name: Create repository-scoped authority token
        id: initial-authority-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.FINITE_REVIEW_CLIENT_ID }}
          private-key: ${{ env.FINITE_REVIEW_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-members: read
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
      - name: Clear App key before evidence processing
        run: | # zizmor: ignore[github-env]
          printf 'FINITE_REVIEW_CLIENT_ID=\nFINITE_REVIEW_PRIVATE_KEY=\n' >>"$GITHUB_ENV"
      - name: Download authenticated exact producing attempt
        env:
          GH_TOKEN: ${{ steps.initial-authority-token.outputs.token }}
          ARTIFACT_READ_TOKEN: ${{ github.token }}
          PROPOSAL_HASH: ${{ needs.prepare.outputs.proposal_hash }}
        run: nix develop --file lib/ci-tools.nix release --command python3 scripts/ci/execute-release-set.py download --unsigned --metadata-only --proposal-hash "$PROPOSAL_HASH"
      - name: Realize pinned signing tools before exposing credentials
        run: | # zizmor: ignore[github-env]
          resolver=$(nix build --file lib/ci-tools.nix ci-secrets-run --no-link --print-out-paths)
          [[ $resolver =~ ^/nix/store/[a-z0-9]{32}-finite-ci-secrets-run$ ]]
          echo "$resolver/bin" >>"$GITHUB_PATH"
          # Expand the executable and output path inside the realized tool shell.
          # shellcheck disable=SC2016
          nix develop --file lib/ci-tools.nix release --command bash -c 'dirname "$(command -v cosign)" >>"$GITHUB_PATH"'
      - name: Resolve fresh review App credentials after artifact transfer
        env:
          FINITE_REVIEW_CLIENT_ID: ${{ vars.DECIDER_CLIENT || secrets.DECIDER_CLIENT }}
          FINITE_REVIEW_PRIVATE_KEY: ${{ secrets.DECIDER_KEY }}
        run: >-
          finite-ci-secrets-run review-app --
          secretspec export --file secretspec.toml --profile review-app --provider github-actions
          --scope review-app --reason 'Finite release authority verification' --format gha
      - name: Create fresh repository-scoped authority token
        id: authority-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.FINITE_REVIEW_CLIENT_ID }}
          private-key: ${{ env.FINITE_REVIEW_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-members: read
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
      - name: Clear fresh App key before authority checks
        run: | # zizmor: ignore[github-env]
          printf 'FINITE_REVIEW_CLIENT_ID=\nFINITE_REVIEW_PRIVATE_KEY=\n' >>"$GITHUB_ENV"
      - name: Revalidate current human release and security authority before keys
        env:
          GH_TOKEN: ${{ steps.authority-token.outputs.token }}
          PROPOSAL_HASH: ${{ needs.prepare.outputs.proposal_hash }}
        run: nix develop --file lib/ci-tools.nix release --command python3 scripts/ci/execute-release-set.py check --metadata-only --proposal-hash "$PROPOSAL_HASH"
      - name: Sign both approved asset manifests with scoped credentials
        if: needs.prepare.outputs.recovered_signed != 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          PROPOSAL_HASH: ${{ needs.prepare.outputs.proposal_hash }}
        run: >-
          finite-ci-secrets-run release-signing -- python3 scripts/ci/execute-release-set.py sign --metadata-only --proposal-hash "$PROPOSAL_HASH"
      - name: Retain signed execution packet for safe exact-byte retries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: .bluebuild/release-execution/
          compression-level: 6
          retention-days: 90
      - name: Persist signed bytes as an immutable recovery packet
        env:
          GH_TOKEN: ${{ steps.authority-token.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          PROPOSAL_HASH: ${{ needs.prepare.outputs.proposal_hash }}
        run: |
          nix develop --file lib/ci-tools.nix release --command bash <<'PERSIST'
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          python3 scripts/ci/execute-release-set.py persist-signed --metadata-only --proposal-hash "$PROPOSAL_HASH"
          PERSIST
  publish:
    needs: [prepare, sign]
    if: github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - name: Monitor hosted runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: "80G"
      - uses: ./.github/actions/setup-nix
      - name: Realize pinned release tools before authority credentials
        run: nix develop --file lib/ci-tools.nix release --command true
      - name: Resolve declared review App credentials
        env:
          FINITE_REVIEW_CLIENT_ID: ${{ vars.DECIDER_CLIENT || secrets.DECIDER_CLIENT }}
          FINITE_REVIEW_PRIVATE_KEY: ${{ secrets.DECIDER_KEY }}
        run: >-
          finite-ci-secrets-run review-app --
          secretspec export --file secretspec.toml --profile review-app --provider github-actions
          --scope review-app --reason 'Finite release authority verification' --format gha
      - name: Create repository-scoped authority token
        id: initial-authority-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.FINITE_REVIEW_CLIENT_ID }}
          private-key: ${{ env.FINITE_REVIEW_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-members: read
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
      - name: Clear App key before evidence processing
        run: | # zizmor: ignore[github-env]
          printf 'FINITE_REVIEW_CLIENT_ID=\nFINITE_REVIEW_PRIVATE_KEY=\n' >>"$GITHUB_ENV"
      - name: Download authenticated signed producing attempt
        env:
          GH_TOKEN: ${{ steps.initial-authority-token.outputs.token }}
          ARTIFACT_READ_TOKEN: ${{ github.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          PROPOSAL_HASH: ${{ needs.prepare.outputs.proposal_hash }}
        run: |
          nix develop --file lib/ci-tools.nix release --command bash <<'DOWNLOAD'
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          python3 scripts/ci/execute-release-set.py download --metadata-only --proposal-hash "$PROPOSAL_HASH"
          DOWNLOAD
      - name: Realize publishing tools before exposing the release PAT
        run: | # zizmor: ignore[github-env]
          resolver=$(nix build --file lib/ci-tools.nix ci-secrets-run --no-link --print-out-paths)
          [[ $resolver =~ ^/nix/store/[a-z0-9]{32}-finite-ci-secrets-run$ ]]
          echo "$resolver/bin" >>"$GITHUB_PATH"
          # Preserve the realized release tools without evaluating Nix with credentials.
          # shellcheck disable=SC2016
          nix develop --file lib/ci-tools.nix release --command bash -c 'tr ":" "\n" <<<"$PATH" >>"$GITHUB_PATH"'
      - name: Resolve fresh review App credentials after artifact transfer
        env:
          FINITE_REVIEW_CLIENT_ID: ${{ vars.DECIDER_CLIENT || secrets.DECIDER_CLIENT }}
          FINITE_REVIEW_PRIVATE_KEY: ${{ secrets.DECIDER_KEY }}
        run: >-
          finite-ci-secrets-run review-app --
          secretspec export --file secretspec.toml --profile review-app --provider github-actions
          --scope review-app --reason 'Finite release authority verification' --format gha
      - name: Create fresh repository-scoped authority token
        id: authority-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.FINITE_REVIEW_CLIENT_ID }}
          private-key: ${{ env.FINITE_REVIEW_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-members: read
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
      - name: Clear fresh App key before authority checks
        run: | # zizmor: ignore[github-env]
          printf 'FINITE_REVIEW_CLIENT_ID=\nFINITE_REVIEW_PRIVATE_KEY=\n' >>"$GITHUB_ENV"
      - name: Revalidate authority and stage both signed releases
        env:
          GH_TOKEN: ${{ steps.authority-token.outputs.token }}
          RELEASE_PUBLISH_TOKEN: ${{ secrets.MERGE_QUEUE_PAT }}
          PROPOSAL_HASH: ${{ needs.prepare.outputs.proposal_hash }}
        run: >-
          finite-ci-secrets-run release-set-publishing --
          python3 scripts/ci/execute-release-set.py stage-publication --proposal-hash "$PROPOSAL_HASH"
      - name: Resolve fresh review App credentials after asset staging
        env:
          FINITE_REVIEW_CLIENT_ID: ${{ vars.DECIDER_CLIENT || secrets.DECIDER_CLIENT }}
          FINITE_REVIEW_PRIVATE_KEY: ${{ secrets.DECIDER_KEY }}
        run: >-
          finite-ci-secrets-run review-app --
          secretspec export --file secretspec.toml --profile review-app --provider github-actions
          --scope review-app --reason 'Finite release authority verification' --format gha
      - name: Create fresh repository-scoped authority token
        id: commit-authority-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.FINITE_REVIEW_CLIENT_ID }}
          private-key: ${{ env.FINITE_REVIEW_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-members: read
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
      - name: Clear fresh App key before authority checks
        run: | # zizmor: ignore[github-env]
          printf 'FINITE_REVIEW_CLIENT_ID=\nFINITE_REVIEW_PRIVATE_KEY=\n' >>"$GITHUB_ENV"
      - name: Revalidate current authority and commit both publications
        env:
          GH_TOKEN: ${{ steps.commit-authority-token.outputs.token }}
          RELEASE_PUBLISH_TOKEN: ${{ secrets.MERGE_QUEUE_PAT }}
          PROPOSAL_HASH: ${{ needs.prepare.outputs.proposal_hash }}
        run: >-
          finite-ci-secrets-run release-set-publishing --
          python3 scripts/ci/execute-release-set.py commit-publication --proposal-hash "$PROPOSAL_HASH"
