name: Delivery and decision pipeline health
on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_run: # zizmor: ignore[dangerous-triggers] Trusted main code reads metadata only.
    workflows: [Build Finite, Prepare two-image release approval, Publish approved two-image release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: finite-delivery-health
  cancel-in-progress: false
env:
  FINITE_REVIEW_BOT_LOGIN: ${{ vars.FINITE_REVIEW_BOT_LOGIN }}
  FINITE_CI_VARS: ${{ toJSON(vars) }}
jobs:
  reconcile:
    if: >-
      github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main' &&
      vars.FINITE_REVIEW_APP_ID != '' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == 'closure-labs/finite' &&
        github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'schedule' ||
         github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Monitor hosted runner (Community)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
        with:
          job-profile: controller
      - name: Generate short-lived repository-scoped review token
        id: health-token
        uses: $/.github/actions/review-app-token
        with:
          client-id: ${{ vars.DECIDER_CLIENT || secrets.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          reason: Finite human decision authority App
          permissions: |
            contents: read
            pull-requests: read
            actions: read
      - name: Generate the preparation and audit token
        id: review-token
        if: always()
        uses: $/.github/actions/review-app-token
        with:
          client-id: ${{ vars.DECIDER_CLIENT || secrets.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          reason: Finite human decision authority App
          permissions: |
            contents: read
            pull-requests: read
            actions: write
            issues: write
      - name: Report delivery and publisher health
        id: health
        if: always() && steps.health-token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.health-token.outputs.token }}
        run: python3 scripts/ci/delivery-health.py
      - name: Retain delivery health
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delivery-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: .bluebuild/delivery-health.json
          retention-days: 30
      - name: Reconcile release preparation from the same-job snapshot
        id: preparation
        if: always() && steps.health.outputs.snapshot == 'true' && steps.review-token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.review-token.outputs.token }}
        run: python3 scripts/ci/reconcile-delivery.py --report .bluebuild/delivery-health.json
      - name: Report audit and human decision health independently
        id: decision-health
        if: always() && steps.review-token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.review-token.outputs.token }}
        run: python3 scripts/ci/decision-health.py
      - name: Preserve independent health and preparation failures
        if: always()
        env:
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          PREPARATION_OUTCOME: ${{ steps.preparation.outcome }}
          AUDIT_OUTCOME: ${{ steps.decision-health.outcome }}
        run: |
          [[ $HEALTH_OUTCOME == success && $PREPARATION_OUTCOME == success && $AUDIT_OUTCOME == success ]]
  next-development:
    if: >-
      github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main' &&
      vars.FINITE_REVIEW_APP_ID != '' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.name == 'Publish approved two-image release' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'closure-labs/finite'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Monitor hosted runner (Community)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Stage the next development cycle after both stable releases
        id: cycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/release-cycle.py
      - uses: $/.github/actions/setup-nix
        with:
          job-profile: controller
        if: steps.cycle.outputs.changed == 'true'
      - name: Generate a token for the development PR only
        id: review-token
        if: steps.cycle.outputs.changed == 'true'
        uses: $/.github/actions/review-app-token
        with:
          client-id: ${{ vars.DECIDER_CLIENT || secrets.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          reason: Finite post-release development PR
          permissions: |
            contents: write
            pull-requests: write
      - name: Propose the next development version
        if: steps.cycle.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.review-token.outputs.token }}
          base: main
          branch: automation/next-development-${{ steps.cycle.outputs.stable }}
          delete-branch: true
          commit-message: 'release: start ${{ steps.cycle.outputs.development }} after the stable pair'
          title: 'Start ${{ steps.cycle.outputs.development }} after stable ${{ steps.cycle.outputs.stable }}'
          add-paths: |
            VERSION
            CHANGELOG.md
          body: |
            Both stable products are published at the same source revision:
            - https://github.com/closure-labs/finite/releases/tag/finite-${{ steps.cycle.outputs.stable }}
            - https://github.com/closure-labs/finite/releases/tag/finite-dev-${{ steps.cycle.outputs.stable }}

            Start the next patch development cycle. Review and merge this PR through
            the normal queue. Successful qualification of both images then prepares
            one paired prerelease proposal; its human approval and protected signing
            gate remain required. Prereleases never become GitHub's latest release.
