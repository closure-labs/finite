name: Admit trusted pull-request CI

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Trusted main code; native metadata only, never PR checkout.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_run: # zizmor: ignore[dangerous-triggers] Only native blocked PR run metadata is consumed.
    workflows: [Build Finite, CodeQL Advanced, Collect maintainer decision events, Verify maintainer decision authority]
    types: [completed]

env:
  FINITE_CI_VARS: ${{ toJSON(vars) }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  discover:
    if: >-
      github.repository == 'closure-labs/finite' &&
      (github.event_name == 'pull_request_target' ||
       ((github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_review') &&
        (github.event.workflow_run.conclusion == 'action_required' ||
         (github.event.workflow_run.name == 'Collect maintainer decision events' &&
          github.event.workflow_run.event == 'pull_request_review' &&
          github.event.workflow_run.conclusion == 'success'))) ||
       (github.event.workflow_run.name == 'Verify maintainer decision authority' &&
        (github.event.workflow_run.event == 'workflow_run' ||
         github.event.workflow_run.event == 'schedule' ||
         github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      has-targets: ${{ steps.targets.outputs.has-targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Discover only native CI executions requiring approval
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          value = json.loads(subprocess.check_output(
              ['python3', 'scripts/ci/ci-run-admission.py', '--discover'], text=True, timeout=240))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(value, separators=(',', ':')) + '\n')
              output.write('has-targets=' + str(bool(value['include'])).lower() + '\n')
          PYTHON

  approve-execution:
    needs: discover
    if: needs.discover.outputs.has-targets == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    concurrency:
      group: finite-ci-admission-${{ github.repository_id }}-${{ matrix.number }}-${{ matrix.head }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Monitor hosted runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
        with:
          job-profile: controller
      - name: Prepare pinned dependency parser before credentials
        id: dependency-tools
        run: |
          tools=$(nix build --file lib/ci-tools.nix image-tools --no-link --print-out-paths)
          [[ $tools =~ ^/nix/store/[a-z0-9]{32}-finite-ci-image-tools$ ]]
          printf 'path=%s\n' "$tools" >>"$GITHUB_OUTPUT"
      - name: Generate token limited to execution approval and identity reads
        id: ci-token
        uses: $/.github/actions/review-app-token
        with:
          client-id: ${{ vars.DECIDER_CLIENT || secrets.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          reason: Finite trusted CI execution admission
          permissions: |
            actions: write
            contents: read
            pull-requests: read
            members: read
      - name: Authenticate live PR author and approve only current-head CI runs
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
          FINITE_CI_ADMISSION_APP_SLUG: ${{ steps.ci-token.outputs.app-slug }}
          FINITE_REVIEW_BOT_LOGIN: ${{ vars.FINITE_REVIEW_BOT_LOGIN }}
          FINITE_REVIEW_APP_ID: ${{ vars.FINITE_REVIEW_APP_ID }}
          DEPENDENCY_TOOLS: ${{ steps.dependency-tools.outputs.path }}
          TARGET_PR: ${{ matrix.number }}
          EXPECTED_HEAD: ${{ matrix.head }}
          TARGET_RUNS: ${{ toJSON(matrix.runs) }}
        run: >-
          "$DEPENDENCY_TOOLS/bin/python3" scripts/ci/ci-run-admission.py --pull-request "$TARGET_PR"
          --head "$EXPECTED_HEAD" --runs "$TARGET_RUNS"
