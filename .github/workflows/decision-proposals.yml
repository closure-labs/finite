name: Reconcile maintainer decisions
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Only trusted main code handles authenticated native artifacts.
    workflows: [Build Finite, Audit published image security]
    types: [completed]
  push:
    branches: [main]
    paths: ['automation/decisions/security/**']
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Reconcile decisions or propose the narrow human-reviewed policy activation
        type: choice
        options: [reconcile, propose-cutover]
        default: reconcile
      producer_run:
        description: Trusted main producer run to propose; empty runs health and reconciliation
        type: string
        default: ''
      disposition:
        description: Proposed human decision; automatic reconciliation proposes accepted findings only
        type: choice
        options: [accepted, rejected, revoked]
        default: accepted
      rationale:
        description: Required explanation for rejection or revocation
        type: string
        default: ''
      decision_hash:
        description: Current accepted decision hash to revoke; no new scan is required
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: finite-decision-reconciliation
  cancel-in-progress: false
env:
  FINITE_OPTIMIZED_CACHES: ${{ vars.FINITE_OPTIMIZED_CACHES }}
  FINITE_CACHIX_WRITER: ${{ vars.FINITE_CACHIX_WRITER }}
  FINITE_REUSE_INVENTORY: ${{ vars.FINITE_REUSE_INVENTORY }}
  FINITE_GRYPE_DB_CACHE: ${{ vars.FINITE_GRYPE_DB_CACHE }}
  FINITE_QUALIFICATION_REUSE: ${{ vars.FINITE_QUALIFICATION_REUSE }}
  FINITE_QUALIFIED_ISO_PRESERVATION: ${{ vars.FINITE_QUALIFIED_ISO_PRESERVATION }}
  FINITE_QUALIFIED_ISO_CHANNELS: ${{ vars.FINITE_QUALIFIED_ISO_CHANNELS }}
jobs:
  reconcile:
    # Bootstrap is additive: existing image/release enforcement remains active
    # until the review App and an explicit human baseline have been installed.
    if: >-
      github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main' &&
      vars.FINITE_REVIEW_APP_ID != '' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'schedule' ||
         github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Monitor hosted runner (Community)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: Resolve declared review App credentials
        env:
          FINITE_REVIEW_CLIENT_ID: ${{ vars.DECIDER_CLIENT || secrets.DECIDER_CLIENT }}
          FINITE_REVIEW_PRIVATE_KEY: ${{ secrets.DECIDER_KEY }}
        run: >-
          finite-ci-secrets-run review-app --
          secretspec export --file secretspec.toml --profile review-app --provider github-actions
          --scope review-app --reason 'Finite human decision authority App' --format gha
      - name: Generate short-lived repository-scoped review token
        id: review-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.FINITE_REVIEW_CLIENT_ID }}
          private-key: ${{ env.FINITE_REVIEW_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write
          permission-issues: write
          permission-administration: read
          permission-members: read
      - name: Clear App private credentials
        run: | # zizmor: ignore[github-env]
          printf 'FINITE_REVIEW_CLIENT_ID=\nFINITE_REVIEW_PRIVATE_KEY=\n' >>"$GITHUB_ENV"
      - name: Propose findings or reconcile approved decisions
        env:
          GH_TOKEN: ${{ steps.review-token.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          FINITE_REVIEW_BOT_LOGIN: ${{ vars.FINITE_REVIEW_BOT_LOGIN }}
          FINITE_REVIEW_APP_ID: ${{ vars.FINITE_REVIEW_APP_ID }}
          PRODUCER_RUN: ${{ github.event.workflow_run.id || inputs.producer_run }}
          DECISION_OPERATION: ${{ inputs.operation || 'reconcile' }}
          PROPOSAL_DISPOSITION: ${{ inputs.disposition || 'accepted' }}
          DECISION_RATIONALE: ${{ inputs.rationale || '' }}
          DECISION_HASH: ${{ inputs.decision_hash || '' }}
        run: |
          nix develop --file lib/ci-tools.nix release --command bash <<'CONTROLLER'
          set -euo pipefail
          if [[ $DECISION_OPERATION == propose-cutover ]]; then
            [[ $GITHUB_EVENT_NAME == workflow_dispatch && $PRODUCER_RUN =~ ^[1-9][0-9]*$ ]]
            [[ $PROPOSAL_DISPOSITION == accepted && -z $DECISION_RATIONALE && -z $DECISION_HASH ]]
            python3 scripts/ci/decision-controller.py propose-cutover --run "$PRODUCER_RUN" --packet-directory .bluebuild/cutover-native
            exit 0
          fi
          [[ $DECISION_OPERATION == reconcile ]]
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if [[ $PROPOSAL_DISPOSITION == revoked ]]; then
            [[ -z $PRODUCER_RUN && -n $DECISION_HASH && -n $DECISION_RATIONALE ]]
            python3 scripts/ci/decision-controller.py revoke --decision-hash "$DECISION_HASH" --rationale "$DECISION_RATIONALE"
          else
            [[ -z $DECISION_HASH ]]
            if [[ $PROPOSAL_DISPOSITION == rejected ]]; then
              [[ -n $PRODUCER_RUN && -n $DECISION_RATIONALE ]]
            fi
            if [[ -n $PRODUCER_RUN ]]; then
              [[ $PRODUCER_RUN =~ ^[1-9][0-9]*$ ]]
              python3 scripts/ci/decision-controller.py collect --run "$PRODUCER_RUN" --packet-directory .bluebuild/decision-packet \
                --disposition "$PROPOSAL_DISPOSITION" --rationale "$DECISION_RATIONALE"
            fi
          fi
          python3 scripts/ci/reconcile-decisions.py
          CONTROLLER
