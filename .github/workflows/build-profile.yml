name: Build one Purplefin profile

on:
  workflow_call:
    inputs:
      cache-only:
        required: false
        default: false
        type: boolean
      upstream-base-digest:
        required: true
        type: string
      build-input:
        required: true
        type: string
      profile:
        required: true
        type: string
      parent-digest:
        required: false
        default: ""
        type: string
      parent-image:
        required: true
        type: string
      parent-profile:
        required: false
        default: ""
        type: string
      parent-tag:
        required: false
        default: ""
        type: string
      publish:
        required: true
        type: boolean
      runner:
        required: false
        default: ubuntu-24.04
        type: string
      use-stage-cache:
        required: false
        default: true
        type: boolean
      tags:
        required: true
        type: string
      version:
        required: true
        type: string
    outputs:
      digest:
        description: Immutable digest of the published, rechunked image
        value: ${{ jobs.build.outputs.digest }}

env:
  IMAGE_REF: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR for publishing and build cache
        if: inputs.publish || inputs.cache-only
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          install -d -m 0700 "${HOME}/.docker"
          registry_auth_file="${HOME}/.docker/config.json"
          printf '%s' "${GHCR_TOKEN}" |
            podman login \
              --authfile "${registry_auth_file}" \
              ghcr.io \
              --username "${GITHUB_ACTOR}" \
              --password-stdin
          echo "REGISTRY_AUTH_FILE=${registry_auth_file}" >>"${GITHUB_ENV}"

      - name: Install ORAS
        if: inputs.publish || inputs.cache-only
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3

      - name: Reclaim stale cache-runner images
        if: inputs.cache-only
        shell: bash
        run: |
          mapfile -t stale_images < <(
            podman images \
              --filter 'label=io.purplefin.build.profile' \
              --format '{{.ID}}' |
              sort -u
          )
          if (( ${#stale_images[@]} > 0 )); then
            podman rmi --force "${stale_images[@]}"
          fi
          podman image prune --force

      - name: Check local cache capacity
        if: inputs.cache-only
        shell: bash
        run: |
          graph_root="$(podman info --format '{{.Store.GraphRoot}}')"
          available_bytes="$(df --output=avail -B1 "${graph_root}" | tail -n 1)"
          minimum_bytes=$((10 * 1024 * 1024 * 1024))
          if (( available_bytes < minimum_bytes )); then
            printf 'Container storage at %s has only %d GiB free; 10 GiB is required.\n' \
              "${graph_root}" "$((available_bytes / 1024 / 1024 / 1024))" >&2
            exit 1
          fi
          printf 'Container storage at %s has %d GiB free.\n' \
            "${graph_root}" "$((available_bytes / 1024 / 1024 / 1024))"

      - name: Resolve immutable build inputs
        id: inputs
        env:
          BUILD_INPUT: ${{ inputs.build-input }}
          BUILD_PROFILE: ${{ inputs.profile }}
          PARENT_DIGEST: ${{ inputs.parent-digest }}
          PARENT_IMAGE: ${{ inputs.parent-image }}
          PARENT_PROFILE: ${{ inputs.parent-profile }}
          PARENT_TAG: ${{ inputs.parent-tag }}
        shell: bash
        run: |
          if [[ -n "${PARENT_PROFILE}" && -z "${PARENT_DIGEST}" ]]; then
            [[ -n "${PARENT_TAG}" ]] || {
              echo 'A parent digest or tag is required for derived builds' >&2
              exit 2
            }
            PARENT_DIGEST="$(
              skopeo inspect --retry-times 3 --format '{{.Digest}}' \
                "docker://${PARENT_IMAGE}:${PARENT_TAG}"
            )"
          fi
          [[ "${PARENT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Invalid parent digest: ${PARENT_DIGEST}" >&2
            exit 2
          }
          {
            echo "parent_digest=${PARENT_DIGEST}"
            echo "sbom_repo=${IMAGE_REF}-sbom-cache"
            echo "stage_ref=${IMAGE_REF}-stage-cache:${BUILD_PROFILE}-${BUILD_INPUT}"
          } >>"${GITHUB_OUTPUT}"

      - name: Probe rechunked stage cache
        if: inputs.use-stage-cache
        id: stage
        env:
          BUILD_INPUT: ${{ inputs.build-input }}
          BUILD_PROFILE: ${{ inputs.profile }}
          PARENT_DIGEST: ${{ steps.inputs.outputs.parent_digest }}
          STAGE_REF: ${{ steps.inputs.outputs.stage_ref }}
          UPSTREAM_BASE_DIGEST: ${{ inputs.upstream-base-digest }}
        shell: bash
        run: |
          if metadata="$(skopeo inspect --retry-times 3 "docker://${STAGE_REF}" 2>/dev/null)" &&
            jq -e \
              --arg build_input "${BUILD_INPUT}" \
              --arg parent_digest "${PARENT_DIGEST}" \
              --arg profile "${BUILD_PROFILE}" \
              --arg upstream_digest "${UPSTREAM_BASE_DIGEST}" \
              '.Labels["io.purplefin.build.input"] == $build_input and
               .Labels["io.purplefin.build.profile"] == $profile and
               .Labels["io.purplefin.upstream.digest"] == $upstream_digest and
               .Labels["org.opencontainers.image.base.digest"] == $parent_digest' \
              <<<"${metadata}" >/dev/null; then
            digest="$(jq -er '.Digest' <<<"${metadata}")"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            {
              echo "digest=${digest}"
              echo 'hit=true'
            } >>"${GITHUB_OUTPUT}"
          else
            echo 'hit=false' >>"${GITHUB_OUTPUT}"
          fi

      - name: Build image from immutable parent
        if: steps.stage.outputs.hit != 'true'
        env:
          BUILD_INPUT: ${{ inputs.build-input }}
          BUILD_PROFILE: ${{ inputs.profile }}
          PARENT_DIGEST: ${{ steps.inputs.outputs.parent_digest }}
          PARENT_IMAGE: ${{ inputs.parent-image }}
          PARENT_PROFILE: ${{ inputs.parent-profile }}
          PARENT_TAG: ${{ inputs.parent-tag }}
          CACHE_WRITE: ${{ inputs.publish || inputs.cache-only }}
          CACHE_READ: ${{ inputs.use-stage-cache }}
          PURPLEFIN_VERSION: ${{ inputs.version }}
          TAGS: ${{ inputs.tags }}
          UPSTREAM_BASE_DIGEST: ${{ inputs.upstream-base-digest }}
        shell: bash
        run: |
          read -r -a tags <<<"${TAGS}"
          primary_image="${IMAGE_REF}:${tags[0]}"
          created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          containerfile=./Containerfile
          cache_ref="${IMAGE_REF}-build-cache"
          cache_args=(--layers)
          parent_args=()

          if [[ -n "${PARENT_PROFILE}" ]]; then
            containerfile=./Containerfile.derived
            parent_args+=(
              --label "io.purplefin.parent.digest=${PARENT_DIGEST}"
              --label "io.purplefin.parent.profile=${PARENT_PROFILE}"
              --build-arg "PARENT_PROFILE=${PARENT_PROFILE}"
            )
          fi
          base_ref="${PARENT_IMAGE}@${PARENT_DIGEST}"
          if [[ "${CACHE_WRITE}" == true ]]; then
            cache_args+=(--cache-to "${cache_ref}")
            if [[ "${CACHE_READ}" == true ]] && \
              skopeo list-tags "docker://${cache_ref}" >/dev/null 2>&1; then
              cache_args+=(--cache-from "${cache_ref}" --cache-ttl 168h)
            fi
          fi

          buildah bud \
            --file "${containerfile}" \
            --pull=always \
            "${cache_args[@]}" \
            "${parent_args[@]}" \
            --label "io.purplefin.build.input=${BUILD_INPUT}" \
            --label "io.purplefin.build.profile=${BUILD_PROFILE}" \
            --label "io.purplefin.upstream.digest=${UPSTREAM_BASE_DIGEST}" \
            --label "org.opencontainers.image.base.digest=${PARENT_DIGEST}" \
            --label "org.opencontainers.image.created=${created}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --build-arg "BASE_REF=${base_ref}" \
            --build-arg "BUILD_PROFILE=${BUILD_PROFILE}" \
            --build-arg "PURPLEFIN_VERSION=${PURPLEFIN_VERSION}" \
            --format docker \
            --tls-verify=true \
            --tag "${primary_image}" \
            .

      - name: Rechunk bootc image for efficient updates
        if: steps.stage.outputs.hit != 'true'
        id: rechunk
        env:
          CACHE_ONLY: ${{ inputs.cache-only }}
          PUBLISH: ${{ inputs.publish }}
          STAGE_REF: ${{ steps.inputs.outputs.stage_ref }}
          TAGS: ${{ inputs.tags }}
        shell: bash
        run: |
          read -r -a tags <<<"${TAGS}"
          primary_image="${IMAGE_REF}:${tags[0]}"
          preserved_labels="$({
            podman inspect "${primary_image}" |
              jq -c '
                .[0].Config.Labels // {} |
                with_entries(
                  select(
                    .key != "containers.bootc" and
                    .key != "io.buildah.version" and
                    (.key | startswith("ostree.") | not)
                  )
                )
              '
          })"
          label_args=()
          while IFS= read -r label; do
            label_args+=(--label "${label}")
          done < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"${preserved_labels}")

          output_dir=''
          remote_ref=''
          run_args=()
          if [[ "${PUBLISH}" == true ]]; then
            remote_ref="${primary_image}"
          elif [[ "${CACHE_ONLY}" == true ]]; then
            remote_ref="${STAGE_REF}"
          else
            output_dir="$(mktemp -d -p "${RUNNER_TEMP}" purplefin-rechunk.XXXXXX)"
          fi

          if [[ -n "${remote_ref}" ]]; then
            output="docker://${remote_ref}"
            run_args+=(
              --env REGISTRY_AUTH_FILE=/run/registry-auth.json
              --volume "${REGISTRY_AUTH_FILE}:/run/registry-auth.json:ro"
            )
          else
            output="oci-archive:/run/out/purplefin.oci"
            run_args+=(--volume "${output_dir}:/run/out")
          fi

          podman run --rm --pull=never --privileged \
            --mount "type=image,src=${primary_image},target=/rpm-ostree" \
            "${run_args[@]}" \
            --entrypoint /usr/bin/rpm-ostree \
            "${primary_image}" \
            compose build-chunked-oci \
              --max-layers 127 \
              --format-version=2 \
              "${label_args[@]}" \
              --bootc \
              --rootfs /rpm-ostree \
              --output "${output}"

          if [[ -n "${remote_ref}" ]]; then
            metadata="$(skopeo inspect --retry-times 3 "docker://${remote_ref}")"
            jq -e --argjson expected "${preserved_labels}" '
              (.Labels // {}) as $actual |
              $expected |
              to_entries |
              all(.[]; $actual[.key] == .value)
            ' <<<"${metadata}" >/dev/null
            digest="$(jq -er '.Digest' <<<"${metadata}")"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            {
              echo "digest=${digest}"
              echo "remote_ref=${remote_ref}"
            } >>"${GITHUB_OUTPUT}"
          else
            archive="${output_dir}/purplefin.oci"
            chunked_image="$(podman pull --quiet "oci-archive:${archive}")"
            podman inspect "${chunked_image}" |
              jq -e --argjson expected "${preserved_labels}" '
                (.[0].Config.Labels // {}) as $actual |
                $expected |
                to_entries |
                all(.[]; $actual[.key] == .value)
              ' >/dev/null
            podman tag "${chunked_image}" "${primary_image}"
            echo "archive=${archive}" >>"${GITHUB_OUTPUT}"
          fi

      - name: Promote immutable image and apply aliases
        if: inputs.publish
        id: push
        env:
          STAGE_DIGEST: ${{ steps.stage.outputs.digest }}
          STAGE_HIT: ${{ steps.stage.outputs.hit }}
          STAGE_REF: ${{ steps.inputs.outputs.stage_ref }}
          RECHUNK_DIGEST: ${{ steps.rechunk.outputs.digest }}
          TAGS: ${{ inputs.tags }}
        shell: bash
        run: |
          read -r -a tags <<<"${TAGS}"
          primary_ref="${IMAGE_REF}:${tags[0]}"
          if [[ "${STAGE_HIT}" == true ]]; then
            digest="${STAGE_DIGEST}"
            oras cp \
              --from-registry-config "${REGISTRY_AUTH_FILE}" \
              --to-registry-config "${REGISTRY_AUTH_FILE}" \
              "${STAGE_REF}@${digest}" \
              "${primary_ref}"
          else
            digest="${RECHUNK_DIGEST}"
          fi
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]

          published_digest="$({
            skopeo inspect --retry-times 3 --format '{{.Digest}}' \
              "docker://${primary_ref}"
          })"
          [[ "${published_digest}" == "${digest}" ]]

          if (( ${#tags[@]} > 1 )); then
            oras tag \
              --registry-config "${REGISTRY_AUTH_FILE}" \
              "${IMAGE_REF}@${digest}" \
              "${tags[@]:1}"
          fi

          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"

      - name: Select immutable image digest
        if: inputs.publish || inputs.cache-only
        id: image
        env:
          PUBLISH: ${{ inputs.publish }}
          PUBLISHED_DIGEST: ${{ steps.push.outputs.digest }}
          RECHUNK_DIGEST: ${{ steps.rechunk.outputs.digest }}
          STAGE_DIGEST: ${{ steps.stage.outputs.digest }}
          STAGE_REF: ${{ steps.inputs.outputs.stage_ref }}
        shell: bash
        run: |
          digest="${PUBLISHED_DIGEST:-${RECHUNK_DIGEST:-${STAGE_DIGEST}}}"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [[ "${PUBLISH}" == true ]]; then
            image_ref="${IMAGE_REF}"
          else
            image_ref="${STAGE_REF}"
          fi
          {
            echo "digest=${digest}"
            echo "ref=${image_ref}"
          } >>"${GITHUB_OUTPUT}"

      - name: Pull matching cached SBOM
        if: inputs.publish || inputs.cache-only
        id: sbom-cache
        env:
          BUILD_INPUT: ${{ inputs.build-input }}
          BUILD_PROFILE: ${{ inputs.profile }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SBOM_REPO: ${{ steps.inputs.outputs.sbom_repo }}
        shell: bash
        run: |
          digest_key="${IMAGE_DIGEST#sha256:}"
          sbom_ref="${SBOM_REPO}:${BUILD_PROFILE}-${BUILD_INPUT}-${digest_key:0:16}"
          output_dir="$(mktemp -d -p "${RUNNER_TEMP}" purplefin-sbom.XXXXXX)"
          if manifest="$({
            oras manifest fetch \
              --registry-config "${REGISTRY_AUTH_FILE}" \
              "${sbom_ref}" 2>/dev/null
          })" &&
            jq -e \
              --arg build_input "${BUILD_INPUT}" \
              --arg digest "${IMAGE_DIGEST}" \
              --arg profile "${BUILD_PROFILE}" '
                .artifactType == "application/spdx+json" and
                .annotations["io.purplefin.build.input"] == $build_input and
                .annotations["io.purplefin.build.profile"] == $profile and
                .annotations["io.purplefin.subject.digest"] == $digest and
                (.layers | length) == 1 and
                .layers[0].mediaType == "application/spdx+json"
              ' <<<"${manifest}" >/dev/null; then
            oras pull \
              --registry-config "${REGISTRY_AUTH_FILE}" \
              --output "${output_dir}" \
              "${sbom_ref}"
            sbom="${output_dir}/sbom.spdx.json"
            [[ -f "${sbom}" ]]
            {
              echo 'hit=true'
              echo "path=${sbom}"
            } >>"${GITHUB_OUTPUT}"
          else
            rmdir "${output_dir}"
            echo 'hit=false' >>"${GITHUB_OUTPUT}"
          fi

      - name: Install cosign
        if: inputs.publish
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify immutable image
        if: inputs.publish
        env:
          COSIGN_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build-profile.yml@refs/heads/main
          DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          immutable_image="${IMAGE_REF}@${DIGEST}"
          cosign sign --yes "${immutable_image}"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${COSIGN_IDENTITY}" \
            "${immutable_image}" >/dev/null

      - name: Generate SBOM
        if: >-
          (inputs.publish || inputs.cache-only) &&
          steps.sbom-cache.outputs.hit != 'true'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        env:
          TMPDIR: ${{ runner.temp }}
        with:
          artifact-name: sbom-${{ inputs.profile }}.spdx.json
          format: spdx-json
          image: ${{ steps.image.outputs.ref }}@${{ steps.image.outputs.digest }}
          output-file: sbom.spdx.json
          registry-password: ${{ github.token }}
          registry-username: ${{ github.actor }}
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Validate and select SBOM
        if: inputs.publish || inputs.cache-only
        id: sbom
        env:
          CACHED_SBOM: ${{ steps.sbom-cache.outputs.path }}
        shell: bash
        run: |
          sbom="${CACHED_SBOM:-sbom.spdx.json}"
          [[ -f "${sbom}" ]]
          jq -e '
            type == "object" and
            (.spdxVersion | type == "string" and startswith("SPDX-")) and
            (.packages | type == "array")
          ' "${sbom}" >/dev/null
          size="$(wc -c <"${sbom}")"
          maximum_size=$((16 * 1024 * 1024))
          if (( size > maximum_size )); then
            printf 'SBOM is %d bytes; actions/attest accepts at most %d bytes.\n' \
              "${size}" "${maximum_size}" >&2
            exit 1
          fi
          echo "path=${sbom}" >>"${GITHUB_OUTPUT}"

      - name: Store SBOM cache artifact
        if: >-
          (inputs.publish || inputs.cache-only) &&
          steps.sbom-cache.outputs.hit != 'true'
        env:
          BUILD_INPUT: ${{ inputs.build-input }}
          BUILD_PROFILE: ${{ inputs.profile }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SBOM_REPO: ${{ steps.inputs.outputs.sbom_repo }}
        shell: bash
        run: |
          digest_key="${IMAGE_DIGEST#sha256:}"
          sbom_ref="${SBOM_REPO}:${BUILD_PROFILE}-${BUILD_INPUT}-${digest_key:0:16}"
          oras push \
            --registry-config "${REGISTRY_AUTH_FILE}" \
            --artifact-type application/spdx+json \
            --annotation "io.purplefin.build.input=${BUILD_INPUT}" \
            --annotation "io.purplefin.build.profile=${BUILD_PROFILE}" \
            --annotation "io.purplefin.subject.digest=${IMAGE_DIGEST}" \
            "${sbom_ref}" \
            sbom.spdx.json:application/spdx+json

      - name: Attest build provenance
        if: inputs.publish
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          subject-digest: ${{ steps.push.outputs.digest }}
          subject-name: ${{ env.IMAGE_REF }}
          subject-version: ${{ inputs.version }}

      - name: Attest SBOM
        if: inputs.publish
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          sbom-path: ${{ steps.sbom.outputs.path }}
          subject-digest: ${{ steps.push.outputs.digest }}
          subject-name: ${{ env.IMAGE_REF }}
          subject-version: ${{ inputs.version }}

      - name: Remove local OCI archive
        if: always()
        env:
          BUILT_ARCHIVE: ${{ steps.rechunk.outputs.archive }}
        shell: bash
        run: |
          if [[ -n "${BUILT_ARCHIVE}" ]]; then
            rm -f -- "${BUILT_ARCHIVE}"
            rmdir -- "${BUILT_ARCHIVE%/*}" 2>/dev/null || true
          fi

      - name: Remove local SBOM
        if: always()
        env:
          CACHED_SBOM: ${{ steps.sbom-cache.outputs.path }}
        shell: bash
        run: |
          rm -f -- sbom.spdx.json
          if [[ -n "${CACHED_SBOM}" ]]; then
            rm -f -- "${CACHED_SBOM}"
            rmdir -- "${CACHED_SBOM%/*}" 2>/dev/null || true
          fi

      - name: Remove cache-only images
        if: always() && inputs.cache-only
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t profile_images < <(
            podman images \
              --filter 'label=io.purplefin.build.profile' \
              --format '{{.ID}}' |
              sort -u
          )
          if (( ${#profile_images[@]} > 0 )); then
            podman rmi --force "${profile_images[@]}" || true
          fi
          mapfile -t cache_images < <(
            podman images \
              --filter "reference=${IMAGE_REF}-build-cache:*" \
              --format '{{.ID}}'
          )
          if (( ${#cache_images[@]} > 0 )); then
            podman rmi --force "${cache_images[@]}" || true
          fi
          podman image prune --force || true

      - name: Log out of GHCR
        if: always() && (inputs.publish || inputs.cache-only)
        continue-on-error: true
        shell: bash
        run: |
          registry_auth_file="${REGISTRY_AUTH_FILE:-${HOME}/.docker/config.json}"
          podman logout --authfile "${registry_auth_file}" ghcr.io || true
          rm -f "${registry_auth_file}"
