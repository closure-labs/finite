name: Build one Purplefin profile

on:
  workflow_call:
    inputs:
      upstream-base-digest:
        required: true
        type: string
      build-input:
        required: true
        type: string
      profile:
        required: true
        type: string
      parent-digest:
        required: false
        default: ""
        type: string
      parent-image:
        required: true
        type: string
      parent-from-npins:
        required: false
        default: false
        type: boolean
      parent-profile:
        required: false
        default: ""
        type: string
      parent-tag:
        required: false
        default: ""
        type: string
      publish:
        required: true
        type: boolean
      reuse-existing:
        required: false
        default: true
        type: boolean
      tags:
        required: true
        type: string
      version:
        required: true
        type: string
    outputs:
      digest:
        description: Immutable digest of the published, rechunked image
        value: ${{ jobs.build.outputs.digest }}

env:
  IMAGE_REF: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Initialize build report
        shell: bash
        run: echo "BUILD_STARTED_AT=$(date +%s)" >>"${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3

      - name: Materialize Flake-generated build artifacts
        shell: bash
        run: nix run .#export-artifacts -- .

      - name: Log in to GHCR for publishing and build cache
        if: inputs.publish
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          install -d -m 0700 "${HOME}/.docker"
          registry_auth_file="${HOME}/.docker/config.json"
          printf '%s' "${GHCR_TOKEN}" |
            podman login \
              --authfile "${registry_auth_file}" \
              ghcr.io \
              --username "${GITHUB_ACTOR}" \
              --password-stdin
          echo "REGISTRY_AUTH_FILE=${registry_auth_file}" >>"${GITHUB_ENV}"

      - name: Install ORAS
        if: inputs.publish
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3

      - name: Install cosign
        if: inputs.publish
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve immutable build inputs
        id: inputs
        env:
          PARENT_DIGEST: ${{ inputs.parent-digest }}
          PARENT_IMAGE: ${{ inputs.parent-image }}
          PARENT_PROFILE: ${{ inputs.parent-profile }}
          PARENT_TAG: ${{ inputs.parent-tag }}
        shell: bash
        run: |
          if [[ -n "${PARENT_PROFILE}" && -z "${PARENT_DIGEST}" ]]; then
            [[ -n "${PARENT_TAG}" ]] || {
              echo 'A parent digest or tag is required for derived builds' >&2
              exit 2
            }
            PARENT_DIGEST="$(
              skopeo inspect --retry-times 3 --format '{{.Digest}}' \
                "docker://${PARENT_IMAGE}:${PARENT_TAG}"
            )"
          fi
          [[ "${PARENT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Invalid parent digest: ${PARENT_DIGEST}" >&2
            exit 2
          }
          {
            echo "parent_digest=${PARENT_DIGEST}"
            echo "sbom_repo=${IMAGE_REF}-sbom-cache"
          } >>"${GITHUB_OUTPUT}"

      - name: Reuse matching published image
        if: inputs.publish && inputs.reuse-existing
        id: reuse
        env:
          BUILD_INPUT: ${{ inputs.build-input }}
          BUILD_PROFILE: ${{ inputs.profile }}
          COSIGN_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build-profile.yml@refs/heads/main
          EXPECTED_PARENT_DIGEST: ${{ steps.inputs.outputs.parent_digest }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_UPSTREAM_DIGEST: ${{ inputs.upstream-base-digest }}
          EXPECTED_VERSION: ${{ inputs.version }}
          TAGS: ${{ inputs.tags }}
        shell: bash
        run: |
          started=${SECONDS}
          record_duration() {
            echo "seconds=$((SECONDS - started))" >>"${GITHUB_OUTPUT}"
          }
          trap record_duration EXIT

          read -r -a tags <<<"${TAGS}"
          if digest="$(nix run .#image-reuse -- "${tags[0]}")" &&
            [[ -n "${digest}" ]]; then
            if image_id="$({
              podman pull --quiet \
                --authfile "${REGISTRY_AUTH_FILE}" \
                "${IMAGE_REF}@${digest}"
            })"; then
              podman tag "${image_id}" "${IMAGE_REF}:${tags[0]}"
              {
                echo 'hit=true'
                echo "digest=${digest}"
              } >>"${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "${BUILD_PROFILE}: matching image could not be pulled; building it again" >&2
          fi
          echo 'hit=false' >>"${GITHUB_OUTPUT}"

      - name: Load npins-locked upstream image
        if: inputs.parent-from-npins && steps.reuse.outputs.hit != 'true'
        run: nix run .#load-bluefin

      - name: Build image from immutable parent
        if: steps.reuse.outputs.hit != 'true'
        id: build
        env:
          BUILD_INPUT: ${{ inputs.build-input }}
          BUILD_PROFILE: ${{ inputs.profile }}
          PARENT_DIGEST: ${{ steps.inputs.outputs.parent_digest }}
          PARENT_FROM_NPINS: ${{ inputs.parent-from-npins }}
          PARENT_IMAGE: ${{ inputs.parent-image }}
          PARENT_PROFILE: ${{ inputs.parent-profile }}
          PARENT_TAG: ${{ inputs.parent-tag }}
          CACHE_WRITE: ${{ inputs.publish }}
          PURPLEFIN_VERSION: ${{ inputs.version }}
          TAGS: ${{ inputs.tags }}
          UPSTREAM_BASE_DIGEST: ${{ inputs.upstream-base-digest }}
        shell: bash
        run: |
          started=${SECONDS}
          record_duration() {
            echo "seconds=$((SECONDS - started))" >>"${GITHUB_OUTPUT}"
          }
          trap record_duration EXIT

          read -r -a tags <<<"${TAGS}"
          primary_image="${IMAGE_REF}:${tags[0]}"
          created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          containerfile=./bootc/Containerfile
          cache_ref="${IMAGE_REF}-build-cache"
          cache_args=(--layers)
          parent_args=()

          if [[ -n "${PARENT_PROFILE}" ]]; then
            containerfile=./bootc/Containerfile.derived
            parent_args+=(
              --label "io.purplefin.parent.digest=${PARENT_DIGEST}"
              --label "io.purplefin.parent.profile=${PARENT_PROFILE}"
              --build-arg "PARENT_PROFILE=${PARENT_PROFILE}"
            )
          fi
          base_ref="${PARENT_IMAGE}@${PARENT_DIGEST}"
          pull_policy=always
          if [[ "${PARENT_FROM_NPINS}" == true ]]; then
            [[ -n "${PARENT_TAG}" ]]
            base_ref="${PARENT_IMAGE}:${PARENT_TAG}"
            pull_policy=never
          fi
          cache_available=false
          if skopeo list-tags "docker://${cache_ref}" >/dev/null 2>&1; then
            cache_available=true
            cache_args+=(--cache-from "${cache_ref}" --cache-ttl 168h)
          fi
          if [[ "${CACHE_WRITE}" == true ]]; then
            cache_args+=(--cache-to "${cache_ref}")
          fi
          {
            echo "cache_available=${cache_available}"
            echo "cache_ref=${cache_ref}"
            echo "cache_write=${CACHE_WRITE}"
          } >>"${GITHUB_OUTPUT}"

          buildah bud \
            --file "${containerfile}" \
            --pull="${pull_policy}" \
            "${cache_args[@]}" \
            "${parent_args[@]}" \
            --label "io.purplefin.build.input=${BUILD_INPUT}" \
            --label "io.purplefin.build.profile=${BUILD_PROFILE}" \
            --label "io.purplefin.upstream.digest=${UPSTREAM_BASE_DIGEST}" \
            --label "org.opencontainers.image.base.digest=${PARENT_DIGEST}" \
            --label "org.opencontainers.image.created=${created}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --build-arg "BASE_REF=${base_ref}" \
            --build-arg "BUILD_PROFILE=${BUILD_PROFILE}" \
            --build-arg "PURPLEFIN_VERSION=${PURPLEFIN_VERSION}" \
            --format docker \
            --tls-verify=true \
            --tag "${primary_image}" \
            .

      - name: Rechunk bootc image for efficient updates
        if: steps.reuse.outputs.hit != 'true'
        id: rechunk
        env:
          PUBLISH: ${{ inputs.publish }}
          TAGS: ${{ inputs.tags }}
        shell: bash
        run: |
          started=${SECONDS}
          record_duration() {
            echo "seconds=$((SECONDS - started))" >>"${GITHUB_OUTPUT}"
          }
          trap record_duration EXIT

          read -r -a tags <<<"${TAGS}"
          primary_image="${IMAGE_REF}:${tags[0]}"
          preserved_labels="$({
            podman inspect "${primary_image}" |
              jq -c '
                .[0].Config.Labels // {} |
                with_entries(
                  select(
                    .key != "containers.bootc" and
                    .key != "io.buildah.version" and
                    (.key | startswith("ostree.") | not)
                  )
                )
              '
          })"
          label_args=()
          while IFS= read -r label; do
            label_args+=(--label "${label}")
          done < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"${preserved_labels}")

          output_dir=''
          remote_ref=''
          run_args=()
          if [[ "${PUBLISH}" == true ]]; then
            remote_ref="${primary_image}"
          else
            output_dir="$(mktemp -d -p "${RUNNER_TEMP}" purplefin-rechunk.XXXXXX)"
          fi

          if [[ -n "${remote_ref}" ]]; then
            output="docker://${remote_ref}"
            run_args+=(
              --env REGISTRY_AUTH_FILE=/run/registry-auth.json
              --volume "${REGISTRY_AUTH_FILE}:/run/registry-auth.json:ro"
            )
          else
            output="oci-archive:/run/out/purplefin.oci"
            run_args+=(--volume "${output_dir}:/run/out")
          fi

          podman run --rm --pull=never --privileged \
            --mount "type=image,src=${primary_image},target=/rpm-ostree" \
            "${run_args[@]}" \
            --entrypoint /usr/bin/rpm-ostree \
            "${primary_image}" \
            compose build-chunked-oci \
              --max-layers 127 \
              --format-version=2 \
              "${label_args[@]}" \
              --bootc \
              --rootfs /rpm-ostree \
              --output "${output}"

          if [[ -n "${remote_ref}" ]]; then
            metadata="$(skopeo inspect --retry-times 3 "docker://${remote_ref}")"
            jq -e --argjson expected "${preserved_labels}" '
              (.Labels // {}) as $actual |
              $expected |
              to_entries |
              all(.[]; $actual[.key] == .value)
            ' <<<"${metadata}" >/dev/null
            digest="$(jq -er '.Digest' <<<"${metadata}")"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            {
              echo "digest=${digest}"
              echo "remote_ref=${remote_ref}"
            } >>"${GITHUB_OUTPUT}"
          else
            archive="${output_dir}/purplefin.oci"
            chunked_image="$(podman pull --quiet "oci-archive:${archive}")"
            podman inspect "${chunked_image}" |
              jq -e --argjson expected "${preserved_labels}" '
                (.[0].Config.Labels // {}) as $actual |
                $expected |
                to_entries |
                all(.[]; $actual[.key] == .value)
              ' >/dev/null
            podman tag "${chunked_image}" "${primary_image}"
            echo "archive=${archive}" >>"${GITHUB_OUTPUT}"
          fi

      - name: Promote immutable image and apply aliases
        if: inputs.publish
        id: push
        env:
          RECHUNK_DIGEST: ${{ steps.rechunk.outputs.digest }}
          REUSED_DIGEST: ${{ steps.reuse.outputs.digest }}
          TAGS: ${{ inputs.tags }}
        shell: bash
        run: |
          read -r -a tags <<<"${TAGS}"
          primary_ref="${IMAGE_REF}:${tags[0]}"
          digest="${REUSED_DIGEST:-${RECHUNK_DIGEST}}"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]

          published_digest="$({
            skopeo inspect --retry-times 3 --format '{{.Digest}}' \
              "docker://${primary_ref}"
          })"
          [[ "${published_digest}" == "${digest}" ]]

          if (( ${#tags[@]} > 1 )); then
            oras tag \
              --registry-config "${REGISTRY_AUTH_FILE}" \
              "${IMAGE_REF}@${digest}" \
              "${tags[@]:1}"
          fi

          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"

      - name: Select immutable image digest
        if: inputs.publish
        id: image
        env:
          PUBLISHED_DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          digest="${PUBLISHED_DIGEST}"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "digest=${digest}"
            echo "ref=${IMAGE_REF}"
          } >>"${GITHUB_OUTPUT}"

      - name: Pull matching cached SBOM
        if: inputs.publish
        id: sbom-cache
        env:
          BUILD_INPUT: ${{ inputs.build-input }}
          BUILD_PROFILE: ${{ inputs.profile }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SBOM_REPO: ${{ steps.inputs.outputs.sbom_repo }}
        shell: bash
        run: |
          digest_key="${IMAGE_DIGEST#sha256:}"
          sbom_ref="${SBOM_REPO}:${BUILD_PROFILE}-${BUILD_INPUT}-${digest_key:0:16}"
          output_dir="$(mktemp -d -p "${RUNNER_TEMP}" purplefin-sbom.XXXXXX)"
          if manifest="$({
            oras manifest fetch \
              --registry-config "${REGISTRY_AUTH_FILE}" \
              "${sbom_ref}" 2>/dev/null
          })" &&
            jq -e \
              --arg build_input "${BUILD_INPUT}" \
              --arg digest "${IMAGE_DIGEST}" \
              --arg profile "${BUILD_PROFILE}" '
                .artifactType == "application/spdx+json" and
                .annotations["io.purplefin.build.input"] == $build_input and
                .annotations["io.purplefin.build.profile"] == $profile and
                .annotations["io.purplefin.subject.digest"] == $digest and
                (.layers | length) == 1 and
                .layers[0].mediaType == "application/spdx+json"
              ' <<<"${manifest}" >/dev/null; then
            oras pull \
              --registry-config "${REGISTRY_AUTH_FILE}" \
              --output "${output_dir}" \
              "${sbom_ref}"
            sbom="${output_dir}/sbom.spdx.json"
            [[ -f "${sbom}" ]]
            {
              echo 'hit=true'
              echo "path=${sbom}"
            } >>"${GITHUB_OUTPUT}"
          else
            rmdir "${output_dir}"
            echo 'hit=false' >>"${GITHUB_OUTPUT}"
          fi

      - name: Sign and verify immutable image
        if: inputs.publish
        env:
          COSIGN_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build-profile.yml@refs/heads/main
          DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          immutable_image="${IMAGE_REF}@${DIGEST}"
          cosign sign --yes "${immutable_image}"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${COSIGN_IDENTITY}" \
            "${immutable_image}" >/dev/null

      - name: Generate SBOM from mounted image root
        if: >-
          inputs.publish &&
          steps.sbom-cache.outputs.hit != 'true'
        env:
          SOURCE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_REF: ${{ steps.image.outputs.ref }}
        id: sbom_generation
        shell: bash
        run: |
          started=${SECONDS}
          record_duration() {
            echo "seconds=$((SECONDS - started))" >>"${GITHUB_OUTPUT}"
          }
          trap record_duration EXIT

          syft_store="$(nix build .#syft --no-link --print-out-paths)"
          syft_cmd="${syft_store}/bin/syft"
          [[ -x "${syft_cmd}" ]]

          mapfile -t syft_closure < <(
            nix-store --query --requisites "${syft_store}"
          )
          syft_mounts=()
          for store_path in "${syft_closure[@]}"; do
            syft_mounts+=(--volume "${store_path}:${store_path}:ro")
          done

          immutable_image="${SOURCE_REF}@${SOURCE_DIGEST}"
          podman pull --authfile "${REGISTRY_AUTH_FILE}" "${immutable_image}"
          podman run --rm --pull=never \
            --cpus 4 \
            --env SYFT_CACHE_DIR=/tmp/syft-cache \
            --memory 4g \
            --network none \
            --security-opt label=disable \
            --user 0 \
            --volume "${PWD}/.github/syft.yaml:/run/purplefin-syft.yaml:ro" \
            "${syft_mounts[@]}" \
            --entrypoint "${syft_cmd}" \
            "${immutable_image}" \
            scan dir:/ \
              --config /run/purplefin-syft.yaml \
              --exclude './nix/store/**' \
              --source-name "${SOURCE_REF}" \
              --source-version "${SOURCE_DIGEST}" \
              --output spdx-json |
            jq -c '
              .packages |= map(
                if has("externalRefs") then
                  .externalRefs |= map(
                    select(.referenceType != "cpe23Type")
                  ) |
                  if (.externalRefs | length) == 0 then
                    del(.externalRefs)
                  else
                    .
                  end
                else
                  .
                end
              )
            ' >sbom.spdx.json

      - name: Validate and select SBOM
        if: inputs.publish
        id: sbom
        env:
          CACHED_SBOM: ${{ steps.sbom-cache.outputs.path }}
        shell: bash
        run: |
          sbom="${CACHED_SBOM:-sbom.spdx.json}"
          [[ -f "${sbom}" ]]
          jq -e '
            type == "object" and
            (.spdxVersion | type == "string" and startswith("SPDX-")) and
            (.packages | type == "array") and
            any(.packages[].externalRefs[]?; .referenceType == "purl") and
            all(.packages[].externalRefs[]?; .referenceType != "cpe23Type")
          ' "${sbom}" >/dev/null
          size="$(wc -c <"${sbom}")"
          maximum_size=$((16 * 1024 * 1024))
          if (( size > maximum_size )); then
            printf 'SBOM is %d bytes; actions/attest accepts at most %d bytes.\n' \
              "${size}" "${maximum_size}" >&2
            exit 1
          fi
          echo "path=${sbom}" >>"${GITHUB_OUTPUT}"

      - name: Store SBOM cache artifact
        if: >-
          inputs.publish &&
          steps.sbom-cache.outputs.hit != 'true'
        env:
          BUILD_INPUT: ${{ inputs.build-input }}
          BUILD_PROFILE: ${{ inputs.profile }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SBOM_REPO: ${{ steps.inputs.outputs.sbom_repo }}
        shell: bash
        run: |
          digest_key="${IMAGE_DIGEST#sha256:}"
          sbom_ref="${SBOM_REPO}:${BUILD_PROFILE}-${BUILD_INPUT}-${digest_key:0:16}"
          oras push \
            --registry-config "${REGISTRY_AUTH_FILE}" \
            --artifact-type application/spdx+json \
            --annotation "io.purplefin.build.input=${BUILD_INPUT}" \
            --annotation "io.purplefin.build.profile=${BUILD_PROFILE}" \
            --annotation "io.purplefin.subject.digest=${IMAGE_DIGEST}" \
            "${sbom_ref}" \
            sbom.spdx.json:application/spdx+json

      - name: Attest build provenance
        if: inputs.publish
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          subject-digest: ${{ steps.push.outputs.digest }}
          subject-name: ${{ env.IMAGE_REF }}
          subject-version: ${{ inputs.version }}

      - name: Attest SBOM
        if: inputs.publish
        id: sbom_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          sbom-path: ${{ steps.sbom.outputs.path }}
          subject-digest: ${{ steps.push.outputs.digest }}
          subject-name: ${{ env.IMAGE_REF }}
          subject-version: ${{ inputs.version }}

      - name: Summarize profile build
        if: always()
        env:
          BUILD_INPUT: ${{ inputs.build-input }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUILD_PROFILE: ${{ inputs.profile }}
          BUILD_SECONDS: ${{ steps.build.outputs.seconds }}
          CACHE_AVAILABLE: ${{ steps.build.outputs.cache_available }}
          CACHE_REF: ${{ steps.build.outputs.cache_ref }}
          CACHE_WRITE: ${{ steps.build.outputs.cache_write }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          PARENT_DIGEST: ${{ steps.inputs.outputs.parent_digest }}
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
          PUBLISH: ${{ inputs.publish }}
          RECHUNK_OUTCOME: ${{ steps.rechunk.outcome }}
          RECHUNK_SECONDS: ${{ steps.rechunk.outputs.seconds }}
          REUSE_DIGEST: ${{ steps.reuse.outputs.digest }}
          REUSE_HIT: ${{ steps.reuse.outputs.hit }}
          REUSE_SECONDS: ${{ steps.reuse.outputs.seconds }}
          SBOM_ATTESTATION_OUTCOME: ${{ steps.sbom_attestation.outcome }}
          SBOM_CACHE_HIT: ${{ steps.sbom-cache.outputs.hit }}
          SBOM_GENERATION_OUTCOME: ${{ steps.sbom_generation.outcome }}
          SBOM_GENERATION_SECONDS: ${{ steps.sbom_generation.outputs.seconds }}
          TAGS: ${{ inputs.tags }}
        shell: bash
        run: |
          finished_at="$(date +%s)"
          started_at="${BUILD_STARTED_AT:-${finished_at}}"
          [[ "${started_at}" =~ ^[0-9]+$ ]] || started_at="${finished_at}"
          total_seconds=$((finished_at - started_at))

          mode=validation
          image_digest=local-only
          sbom_state='not requested'
          attestations='not requested'
          if [[ "${PUBLISH}" == true ]]; then
            mode=publish
            image_digest="${IMAGE_DIGEST:-unavailable}"
            if [[ "${SBOM_CACHE_HIT}" == true ]]; then
              sbom_state=reused
            elif [[ "${SBOM_GENERATION_OUTCOME}" == success ]]; then
              sbom_state="generated (${SBOM_GENERATION_SECONDS:-0}s)"
            else
              sbom_state="${SBOM_GENERATION_OUTCOME:-skipped}"
            fi
            attestations="provenance=${PROVENANCE_OUTCOME:-skipped}; SPDX=${SBOM_ATTESTATION_OUTCOME:-skipped}"
          fi

          {
            echo "### Profile ${BUILD_PROFILE}"
            echo
            echo '| Property | Value |'
            echo '| --- | --- |'
            echo "| Mode | \`${mode}\` |"
            echo "| Build input | \`${BUILD_INPUT}\` |"
            echo "| Tags | \`${TAGS}\` |"
            echo "| Parent digest | \`${PARENT_DIGEST:-unresolved}\` |"
            echo "| Image digest | \`${image_digest}\` |"
            echo "| Published image reuse | \`${REUSE_HIT:-false}\` (${REUSE_SECONDS:-0}s; \`${REUSE_DIGEST:-none}\`) |"
            echo "| Registry cache | \`${CACHE_AVAILABLE:-unknown}\` available; \`${CACHE_WRITE:-false}\` updated; \`${CACHE_REF:-unresolved}\` |"
            echo "| Image build | \`${BUILD_OUTCOME:-skipped}\` (${BUILD_SECONDS:-0}s) |"
            echo "| Rechunk | \`${RECHUNK_OUTCOME:-skipped}\` (${RECHUNK_SECONDS:-0}s) |"
            echo "| SBOM | \`${sbom_state}\` |"
            echo "| Attestations | \`${attestations}\` |"
            echo "| Total duration | ${total_seconds}s |"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Remove local OCI archive
        if: always()
        env:
          BUILT_ARCHIVE: ${{ steps.rechunk.outputs.archive }}
        shell: bash
        run: |
          if [[ -n "${BUILT_ARCHIVE}" ]]; then
            rm -f -- "${BUILT_ARCHIVE}"
            rmdir -- "${BUILT_ARCHIVE%/*}" 2>/dev/null || true
          fi

      - name: Remove local SBOM
        if: always()
        env:
          CACHED_SBOM: ${{ steps.sbom-cache.outputs.path }}
        shell: bash
        run: |
          rm -f -- sbom.spdx.json
          if [[ -n "${CACHED_SBOM}" ]]; then
            rm -f -- "${CACHED_SBOM}"
            rmdir -- "${CACHED_SBOM%/*}" 2>/dev/null || true
          fi

      - name: Log out of GHCR
        if: always() && inputs.publish
        continue-on-error: true
        shell: bash
        run: |
          registry_auth_file="${REGISTRY_AUTH_FILE:-${HOME}/.docker/config.json}"
          podman logout --authfile "${registry_auth_file}" ghcr.io || true
          rm -f "${registry_auth_file}"
