name: Build one Finite profile

on:
  workflow_call:
    inputs:
      upstream-base-digest:
        required: true
        type: string
      build-input:
        required: true
        type: string
      profile:
        required: true
        type: string
      parent-digest:
        required: false
        default: ""
        type: string
      parent-image:
        required: true
        type: string
      parent-from-lock:
        required: false
        default: false
        type: boolean
      parent-profile:
        required: false
        default: ""
        type: string
      parent-tag:
        required: false
        default: ""
        type: string
      reuse-existing:
        required: false
        default: true
        type: boolean
      upstream-source:
        required: false
        default: bluefin
        type: string
      version:
        required: true
        type: string

env:
  IMAGE_REF: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Initialize build report
        shell: bash
        run: echo "BUILD_STARTED_AT=$(date +%s)" >>"${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix and Cachix
        uses: ./.github/actions/setup-nix

      - name: Log in to GHCR for staging and build cache
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          install -d -m 0700 "${HOME}/.docker"
          registry_auth_file="${HOME}/.docker/config.json"
          printf '%s' "${GHCR_TOKEN}" |
            podman login \
              --authfile "${registry_auth_file}" \
              ghcr.io \
              --username "${GITHUB_ACTOR}" \
              --password-stdin
          echo "REGISTRY_AUTH_FILE=${registry_auth_file}" >>"${GITHUB_ENV}"

      - name: Stage immutable profile image
        id: stage
        env:
          BUILD_INPUT: ${{ inputs.build-input }}
          BUILD_PROFILE: ${{ inputs.profile }}
          CACHE_WRITE: "true"
          COSIGN_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build-profile.yml@refs/heads/main
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_UPSTREAM_DIGEST: ${{ inputs.upstream-base-digest }}
          EXPECTED_VERSION: ${{ inputs.version }}
          PARENT_DIGEST: ${{ inputs.parent-digest }}
          PARENT_FROM_LOCK: ${{ inputs.parent-from-lock }}
          PARENT_IMAGE: ${{ inputs.parent-image }}
          PARENT_PROFILE: ${{ inputs.parent-profile }}
          PARENT_TAG: ${{ inputs.parent-tag }}
          REUSE_EXISTING: ${{ inputs.reuse-existing }}
          UPSTREAM_SOURCE: ${{ inputs.upstream-source }}
        shell: bash
        run: |
          report="${RUNNER_TEMP}/finite-profile-stage.json"
          nix shell --accept-flake-config .#ci-profile-stage \
            -c finite-profile-stage >"${report}"
          nix shell --accept-flake-config .#ci-github-output \
            -c finite-github-output "${report}" >/dev/null

      - name: Sign and verify immutable image
        if: steps.stage.outputs.reuse_hit != 'true'
        env:
          COSIGN_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build-profile.yml@refs/heads/main
          DIGEST: ${{ steps.stage.outputs.digest }}
        shell: bash
        run: >-
          nix shell --accept-flake-config .#ci-image-sign
          -c finite-image-sign

      - name: Check for verified build provenance
        id: provenance_check
        env:
          COSIGN_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build-profile.yml@refs/heads/main
          DIGEST: ${{ steps.stage.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if nix shell --accept-flake-config .#ci-image-verify -c finite-image-verify \
            --image "${IMAGE_REF}" --digest "${DIGEST}" \
            --cosign-identity "${COSIGN_IDENTITY}" --source-sha "${GITHUB_SHA}" \
            --provenance-workflow "${GITHUB_REPOSITORY}/.github/workflows/build-profile.yml" \
            --attempts 1 >/dev/null 2>&1; then
            echo 'hit=true' >>"${GITHUB_OUTPUT}"
          else
            echo 'hit=false' >>"${GITHUB_OUTPUT}"
          fi

      - name: Attest build provenance
        if: steps.provenance_check.outputs.hit != 'true'
        id: provenance_first
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          subject-digest: ${{ steps.stage.outputs.digest }}
          subject-name: ${{ env.IMAGE_REF }}
          subject-version: ${{ inputs.version }}

      - name: Retry build provenance attestation
        if: >-
          steps.provenance_check.outputs.hit != 'true' &&
          steps.provenance_first.outcome == 'failure'
        id: provenance_retry
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          subject-digest: ${{ steps.stage.outputs.digest }}
          subject-name: ${{ env.IMAGE_REF }}
          subject-version: ${{ inputs.version }}

      - name: Verify build provenance
        env:
          COSIGN_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build-profile.yml@refs/heads/main
          DIGEST: ${{ steps.stage.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          nix shell --accept-flake-config .#ci-image-verify -c finite-image-verify
          --image "${IMAGE_REF}" --digest "${DIGEST}"
          --cosign-identity "${COSIGN_IDENTITY}" --source-sha "${GITHUB_SHA}"
          --provenance-workflow "${GITHUB_REPOSITORY}/.github/workflows/build-profile.yml"

      - name: Summarize profile build
        if: always()
        env:
          BUILD_INPUT: ${{ inputs.build-input }}
          BUILD_OUTCOME: ${{ steps.stage.outputs.build_outcome }}
          BUILD_PROFILE: ${{ inputs.profile }}
          BUILD_SECONDS: ${{ steps.stage.outputs.build_seconds }}
          CACHE_AVAILABLE: ${{ steps.stage.outputs.cache_available }}
          CACHE_REF: ${{ steps.stage.outputs.cache_ref }}
          CACHE_WRITE: ${{ steps.stage.outputs.cache_write }}
          IMAGE_DIGEST: ${{ steps.stage.outputs.digest }}
          PARENT_DIGEST: ${{ steps.stage.outputs.parent_digest }}
          PROVENANCE_FIRST_OUTCOME: ${{ steps.provenance_first.outcome }}
          PROVENANCE_HIT: ${{ steps.provenance_check.outputs.hit }}
          PROVENANCE_RETRY_OUTCOME: ${{ steps.provenance_retry.outcome }}
          RECHUNK_OUTCOME: ${{ steps.stage.outputs.rechunk_outcome }}
          RECHUNK_MODE: ${{ steps.stage.outputs.rechunk_mode }}
          RECHUNK_PREVIOUS_DIGEST: ${{ steps.stage.outputs.previous_build_digest }}
          RECHUNK_SECONDS: ${{ steps.stage.outputs.rechunk_seconds }}
          REUSE_DIGEST: ${{ steps.stage.outputs.reuse_digest }}
          REUSE_HIT: ${{ steps.stage.outputs.reuse_hit }}
          REUSE_SECONDS: ${{ steps.stage.outputs.reuse_seconds }}
          UPSTREAM_LOAD_SECONDS: ${{ steps.stage.outputs.upstream_load_seconds }}
        shell: bash
        run: |
          finished_at="$(date +%s)"
          started_at="${BUILD_STARTED_AT:-${finished_at}}"
          [[ "${started_at}" =~ ^[0-9]+$ ]] || started_at="${finished_at}"
          total_seconds=$((finished_at - started_at))

          mode=stage
          image_digest="${IMAGE_DIGEST:-unavailable}"
          attestations="provenance=reused"
          if [[ "${PROVENANCE_HIT}" != true ]]; then
            attestations="provenance=${PROVENANCE_FIRST_OUTCOME:-skipped}/${PROVENANCE_RETRY_OUTCOME:-not-needed}"
          fi

          {
            echo "### Profile ${BUILD_PROFILE}"
            echo
            echo '| Property | Value |'
            echo '| --- | --- |'
            echo "| Mode | \`${mode}\` |"
            echo "| Build input | \`${BUILD_INPUT}\` |"
            echo "| Parent digest | \`${PARENT_DIGEST:-unresolved}\` |"
            echo "| Image digest | \`${image_digest}\` |"
            echo "| Published image reuse | \`${REUSE_HIT:-false}\` (${REUSE_SECONDS:-0}s; \`${REUSE_DIGEST:-none}\`) |"
            echo "| Registry cache | \`${CACHE_AVAILABLE:-unknown}\` available; \`${CACHE_WRITE:-false}\` updated; \`${CACHE_REF:-unresolved}\` |"
            echo "| Upstream load | ${UPSTREAM_LOAD_SECONDS:-0}s |"
            echo "| Container build | \`${BUILD_OUTCOME:-skipped}\` (${BUILD_SECONDS:-0}s) |"
            echo "| Rechunk | \`${RECHUNK_OUTCOME:-skipped}\` (${RECHUNK_SECONDS:-0}s; \`${RECHUNK_MODE:-not-run}\`; previous \`${RECHUNK_PREVIOUS_DIGEST:-none}\`) |"
            echo "| Attestations | \`${attestations}\` |"
            echo "| Total duration | ${total_seconds}s |"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Log out of GHCR
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          registry_auth_file="${REGISTRY_AUTH_FILE:-${HOME}/.docker/config.json}"
          podman logout --authfile "${registry_auth_file}" ghcr.io || true
          rm -f "${registry_auth_file}"
