name: Validate native upgrades and rollback
on:
  push:
    branches: [qualification/native-lifecycle]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finite-native-lifecycle-validation
  cancel-in-progress: true
env:
  FINITE_CI_VARS: ${{ toJSON(vars) }}
jobs:
  payload:
    name: Build shared native payload once
    if: github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/qualification/native-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      revision: ${{ steps.pack.outputs.revision }}
      run: ${{ steps.pack.outputs.runId }}
      attempt: ${{ steps.pack.outputs.runAttempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
        with:
          job-profile: image
          resource-mode: native-qualification
      - name: Materialize the locked payload
        run: |
          mkdir -p .bluebuild
          python3 scripts/native-installer/watch-memory.py \
            nix build --impure --accept-flake-config --no-update-lock-file --no-write-lock-file \
            --max-jobs 1 --cores 2 --file lib/ci-payload.nix payload --no-link --print-out-paths > .bluebuild/payload-path
      - name: Bind payload archive to this source and run
        id: pack
        run: |
          python3 scripts/bluebuild/shared-payload.py create "$(cat .bluebuild/payload-path)" .bluebuild/payload.tar
      - name: Upload the immutable shared payload
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-lifecycle-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: .bluebuild/payload.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  runtimes:
    name: Build the two locked bootc RPMs once
    if: github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/qualification/native-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build matching Fedora 44 and Fedora 45 runtimes
        run: |
          python3 scripts/native-installer/watch-memory.py python3 scripts/bluebuild/stage-bootc-runtime.py \
            --validation-fedora44 --output .bluebuild/lifecycle-runtimes/44
          python3 scripts/native-installer/watch-memory.py python3 scripts/bluebuild/stage-bootc-runtime.py \
            --output .bluebuild/lifecycle-runtimes/45
      - name: Upload the RPMs with their source locks and build receipts
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-lifecycle-runtimes-${{ github.run_id }}-${{ github.run_attempt }}
          path: .bluebuild/lifecycle-runtimes/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  lifecycle:
    name: Qualify ${{ matrix.profile }} lifecycle
    needs: [payload, runtimes]
    if: github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/qualification/native-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        profile: [finite-native, finite-native-dev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: "110G"
      - uses: $/.github/actions/setup-nix
        with:
          job-profile: image
          resource-mode: native-qualification
      - uses: $/.github/actions/setup-cosign
      - name: Install the verified locked BlueBuild CLI
        run: bash scripts/bluebuild/install-cli.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: bluebuild
          driver: docker-container
          driver-opts: default-load=true
          use: false
      - name: Prepare pinned VM tools under the qualification cap
        run: python3 scripts/native-installer/watch-memory.py python3 scripts/ci/vm_tools.py # zizmor: ignore[github-env]
      - name: Check KVM access on the ephemeral runner
        run: |
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Download the same-run shared payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.payload.outputs.artifact_id }}
          path: .bluebuild/lifecycle-payload
          merge-multiple: true
      - name: Stage and verify the shared payload
        env:
          PAYLOAD_ID: ${{ needs.payload.outputs.artifact_id }}
          PAYLOAD_SHA: ${{ needs.payload.outputs.sha256 }}
          PAYLOAD_REVISION: ${{ needs.payload.outputs.revision }}
          PAYLOAD_RUN: ${{ needs.payload.outputs.run }}
          PAYLOAD_ATTEMPT: ${{ needs.payload.outputs.attempt }}
        run: |
          python3 scripts/bluebuild/shared-payload.py stage .bluebuild/lifecycle-payload/payload.tar \
            --artifact-id "$PAYLOAD_ID" --sha256 "$PAYLOAD_SHA" --revision "$PAYLOAD_REVISION" \
            --run "$PAYLOAD_RUN" --attempt "$PAYLOAD_ATTEMPT" > .bluebuild/lifecycle-payload.json
          rm -- .bluebuild/lifecycle-payload/payload.tar
      - name: Download the same-run bootc runtimes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.runtimes.outputs.artifact_id }}
          path: ${{ runner.temp }}/native-lifecycle-runtimes
          merge-multiple: true
      - name: Build both generations and qualify the lifecycle
        env:
          NATIVE_PROFILE: ${{ matrix.profile }}
        run: python3 scripts/native-installer/watch-memory.py bash scripts/native-installer/hosted-validation.sh "$NATIVE_PROFILE"
      - name: Retain native lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
          path: |
            .bluebuild/native-validation/${{ matrix.profile }}/
            .bluebuild/native-iso/${{ matrix.profile }}/installation.json
            .bluebuild/native-iso/${{ matrix.profile }}/SHA256SUMS
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
