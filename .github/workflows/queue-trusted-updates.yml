name: Queue trusted update bots

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: queue-trusted-update-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  enqueue:
    name: Enqueue trusted update
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
      (github.event.pull_request.head.ref == 'update_flake_lock_action' &&
      github.event.pull_request.title == 'Update Nix flake inputs'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge into the required queue
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN || github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          gh pr merge \
            --auto \
            --merge \
            --match-head-commit "${HEAD_SHA}" \
            "${PR_URL}"
