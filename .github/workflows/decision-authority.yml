name: Verify maintainer decision authority

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      pull_request:
        description: Recheck approval for this open PR's current head and current queue target
        required: true
        type: string
  workflow_run: # zizmor: ignore[dangerous-triggers] Metadata only; trusted main is checked out.
    workflows: [Collect maintainer decision events]
    types: [completed]

env:
  FINITE_OPTIMIZED_CACHES: ${{ vars.FINITE_OPTIMIZED_CACHES }}
  FINITE_CACHIX_WRITER: ${{ vars.FINITE_CACHIX_WRITER }}
  FINITE_REUSE_INVENTORY: ${{ vars.FINITE_REUSE_INVENTORY }}
  FINITE_GRYPE_DB_CACHE: ${{ vars.FINITE_GRYPE_DB_CACHE }}
  FINITE_QUALIFICATION_REUSE: ${{ vars.FINITE_QUALIFICATION_REUSE }}
  FINITE_QUALIFIED_ISO_PRESERVATION: ${{ vars.FINITE_QUALIFIED_ISO_PRESERVATION }}
  FINITE_QUALIFIED_ISO_CHANNELS: ${{ vars.FINITE_QUALIFIED_ISO_CHANNELS }}
permissions:
  contents: read
  actions: read
  packages: read

jobs:
  discover:
    if: >-
      github.repository == 'closure-labs/finite' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
       (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      has-targets: ${{ steps.targets.outputs.has-targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Resolve authenticated native targets without authority credentials
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY_RUN: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
          FINITE_REVIEW_APP_ID: ${{ vars.FINITE_REVIEW_APP_ID }}
          RECHECK_PR: ${{ inputs.pull_request || '' }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          mode = '--collector-run' if os.environ['GITHUB_EVENT_NAME'] == 'workflow_run' else '--recovery-run'
          command = ['python3', 'scripts/ci/decision-check.py', mode, os.environ['AUTHORITY_RUN'], '--resolve-targets']
          if os.environ.get('RECHECK_PR'):
              command += ['--recheck-pr', os.environ['RECHECK_PR']]
          result = subprocess.check_output(command, text=True, timeout=240)
          matrix = json.loads(result)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
              output.write('has-targets=' + str(bool(matrix['include'])).lower() + '\n')
          PYTHON
  authority:
    needs: discover
    if: needs.discover.outputs.has-targets == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    concurrency:
      group: finite-maintainer-authority-${{ github.repository_id }}-${{ matrix.number }}-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Monitor hosted runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
      - name: Resolve declared review App credentials
        env:
          FINITE_REVIEW_CLIENT_ID: ${{ vars.DECIDER_CLIENT || secrets.DECIDER_CLIENT }}
          FINITE_REVIEW_PRIVATE_KEY: ${{ secrets.DECIDER_KEY }}
        run: >-
          finite-ci-secrets-run review-app --
          secretspec export --file secretspec.toml --profile review-app --provider github-actions
          --scope review-app --reason 'Finite human decision authority App' --format gha
      - name: Generate short-lived repository-scoped review token
        id: review-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.FINITE_REVIEW_CLIENT_ID }}
          private-key: ${{ env.FINITE_REVIEW_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
          permission-actions: read
          permission-administration: read
          permission-members: read
      - name: Clear App private credentials
        run: | # zizmor: ignore[github-env]
          printf 'FINITE_REVIEW_CLIENT_ID=\nFINITE_REVIEW_PRIVATE_KEY=\n' >>"$GITHUB_ENV"
      - name: Authenticate review and publish App-origin authority check
        env:
          GH_TOKEN: ${{ steps.review-token.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          FINITE_REVIEW_BOT_LOGIN: ${{ vars.FINITE_REVIEW_BOT_LOGIN }}
          FINITE_REVIEW_APP_ID: ${{ vars.FINITE_REVIEW_APP_ID }}
          AUTHORITY_RUN: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
          TARGET_PR: ${{ matrix.number }}
          EXPECTED_HEAD: ${{ matrix.head }}
          TARGET_SHA: ${{ matrix.target }}
        run: |
          nix develop --file lib/ci-tools.nix release --command bash <<'AUTHORITY'
          set -euo pipefail
          trap 'oras logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          mode=--collector-run
          if [[ $GITHUB_EVENT_NAME != workflow_run ]]; then mode=--recovery-run; fi
          python3 scripts/ci/decision-check.py "$mode" "$AUTHORITY_RUN" \
            --pull-request "$TARGET_PR" --expected-head "$EXPECTED_HEAD" --target-sha "$TARGET_SHA"
          AUTHORITY
