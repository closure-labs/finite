name: Update Bluefin stable pin

on:
  schedule:
    - cron: "7 7 * * *"
  workflow_dispatch:

concurrency:
  group: update-bluefin-stable
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    name: Refresh and validate Bluefin stable
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix and Cachix
        uses: ./.github/actions/setup-nix
        with:
          merge-queue-token: ${{ secrets.MERGE_QUEUE_TOKEN }}

      - name: Refresh and verify Bluefin OCI lock
        id: pin
        run: >-
          nix shell --accept-flake-config .#ci-source-update
          -c finite-source-update bluefin "${GITHUB_OUTPUT}"

      - name: Refresh and verify Bluefin DX OCI lock
        id: pin_dx
        run: >-
          nix shell --accept-flake-config .#ci-source-update
          -c finite-source-update bluefin-dx "${GITHUB_OUTPUT}"

      - name: Open or update pull request
        if: steps.pin.outputs.changed == 'true' || steps.pin_dx.outputs.changed == 'true'
        id: update
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ env.MERGE_QUEUE_TOKEN || github.token }}
          branch: automation/update-bluefin-stable
          delete-branch: true
          commit-message: "sources: update Bluefin stable"
          title: "sources: update Bluefin stable"
          body: |
            Refreshes the Bluefin stable container source to immutable digest
            `${{ steps.pin.outputs.digest }}` and the Bluefin DX digest
            `${{ steps.pin_dx.outputs.digest }}`, verifying both Cosign identities.

            The candidate validates the complete repository and image graph
            before auto-merge is enabled.

      - name: Validate and enable auto-merge
        if: >-
          steps.update.outputs.pull-request-number != '' &&
          steps.update.outputs.pull-request-operation != 'closed'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_AUTHOR: ${{ vars.AUTOMATION_UPDATE_LOGIN || 'app/github-actions' }}
          EXPECTED_BRANCH: automation/update-bluefin-stable
          EXPECTED_FILES: sources/bluefin.json,sources/bluefin-dx.json
          EXPECTED_TITLE: "sources: update Bluefin stable"
          GH_TOKEN: ${{ env.MERGE_QUEUE_TOKEN || github.token }}
          PR_NUMBER: ${{ steps.update.outputs.pull-request-number }}
        run: >-
          nix shell --accept-flake-config .#ci-trusted-update
          -c finite-trusted-update
