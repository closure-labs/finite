name: Build installation ISO
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Ongoing update channel
        type: choice
        required: true
        default: bluefin-generic
        options: [bluefin-generic, next, bluefin-dx-generic, dev-next]
      digest:
        description: Verified image digest (sha256 followed by 64 hex digits)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: finite-iso
  cancel-in-progress: false
jobs:
  iso:
    if: github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: "80G"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install BlueBuild CLI and Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          docker create --name bluebuild-cli ghcr.io/blue-build/cli:v0.9.37-installer
          docker cp bluebuild-cli:/out/bluebuild /tmp/bluebuild
          sudo install -m 0755 /tmp/bluebuild /usr/local/bin/bluebuild
          docker rm bluebuild-cli
          bluebuild --version
      - name: Authenticate and generate ISO
        env:
          CHANNEL: ${{ inputs.channel }}
          DIGEST: ${{ inputs.digest }}
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | skopeo login --username "$REGISTRY_USER" --password-stdin ghcr.io
          printf '%s' "$REGISTRY_TOKEN" | docker login --username "$REGISTRY_USER" --password-stdin ghcr.io
          bash scripts/bluebuild/iso.sh "$CHANNEL" "$DIGEST"
      - name: Upload ISO, source record and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finite-iso-${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .bluebuild/iso/*.iso
            .bluebuild/iso/SHA256SUMS
            .bluebuild/iso/installation.json
            .bluebuild/iso/signature.json
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
