# Historical failures remain visible; docs/gitleaks-workflow.md explains the tradeoff.
name: Audit repository secret history
on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-secret-history
  cancel-in-progress: false
jobs:
  history:
    name: Repository historical audit (nonblocking debt)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require protected-main history audit
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Checkout immutable history snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Install checksum-pinned upstream Gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          test "$("$RUNNER_TEMP/gitleaks/gitleaks" version)" = 8.30.1
      - name: Audit all fetched branch tag and pull-request history
        id: audit
        working-directory: candidate
        run: |
          set -euo pipefail
          timeout 120s git fetch --force origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' '+refs/pull/*:refs/remotes/pull/*'
          test "$(git rev-parse --is-shallow-repository)" = false
          log_opts='--all --full-history --diff-merges=first-parent --text --no-ext-diff --no-textconv'
          # Standard engine fingerprints, generated only by current-main tooling.
          # Failure or timeout stops the audit; never fall back to stale ignores.
          timeout --signal=TERM --kill-after=5s 120s python3 -I scripts/ci/history_finding_ids.py \
            --candidate . --anchor "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/verified-history-ids.gitleaksignore"
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks-default.toml"
          umask 077
          mkdir -p "$RUNNER_TEMP/finite-history-evidence"
          python3 -I scripts/ci/history_snapshot.py --candidate . \
            --config "$RUNNER_TEMP/gitleaks-default.toml" \
            --ignores "$RUNNER_TEMP/verified-history-ids.gitleaksignore" \
            --manifest "$RUNNER_TEMP/finite-history-evidence/refs-and-scanner.json"
          report=$(mktemp "$RUNNER_TEMP/finite-history.XXXXXX.json")
          trap 'rm -f "$report"' EXIT
          set +e
          timeout --signal=TERM --kill-after=15s 600s "$RUNNER_TEMP/gitleaks/gitleaks" git . \
            --config "$RUNNER_TEMP/gitleaks-default.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/verified-history-ids.gitleaksignore" --ignore-gitleaks-allow \
            --redact=100 --no-banner --log-level=error --exit-code=2 \
            --report-format=json --report-path="$report" \
            --log-opts="$log_opts" >/dev/null 2>&1
          status=$?
          set -e
          # Only fixed verdicts and aggregate counts reach logs. Partial/error
          # reports never become a clean receipt; raw reports are never uploaded.
          python3 -I scripts/ci/history_snapshot.py --candidate . --check \
            --manifest "$RUNNER_TEMP/finite-history-evidence/refs-and-scanner.json"
          python3 -I scripts/ci/history_scan_summary.py --status "$status" --report "$report" \
            --candidate . --output "$RUNNER_TEMP/finite-history-evidence/summary.json"
      - name: Preserve public ref bindings and aggregate-only scan categories
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: history-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/finite-history-evidence/
          if-no-files-found: error
          retention-days: 30
