name: Update Image Builder CLI digest

on:
  schedule:
    - cron: "13 9 * * 1"
  workflow_dispatch:

concurrency:
  group: update-image-builder-cli
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    name: Refresh and validate Image Builder CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve latest Image Builder CLI digest
        id: resolve
        env:
          IMAGE_BUILDER_TAG: ghcr.io/osbuild/image-builder-cli:latest
        shell: bash
        run: |
          digest="$({
            skopeo inspect \
              --retry-times 3 \
              --format '{{.Digest}}' \
              "docker://${IMAGE_BUILDER_TAG}"
          })"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          current="$({
            sed -nE \
              's#^    default: ghcr.io/osbuild/image-builder-cli@(sha256:[0-9a-f]{64})$#\1#p' \
              .github/actions/build-installer/action.yml
          })"
          [[ "${current}" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [[ "${digest}" == "${current}" ]]; then
            echo 'changed=false' >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          sed -i -E \
            "s#^    default: ghcr.io/osbuild/image-builder-cli@sha256:[0-9a-f]{64}$#    default: ghcr.io/osbuild/image-builder-cli@${digest}#" \
            .github/actions/build-installer/action.yml
          [[ "$(git diff --name-only)" == .github/actions/build-installer/action.yml ]]
          [[ "$(
            grep -cF \
              "    default: ghcr.io/osbuild/image-builder-cli@${digest}" \
              .github/actions/build-installer/action.yml
          )" == 1 ]]
          echo 'changed=true' >>"${GITHUB_OUTPUT}"
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"

      - name: Open or update pull request
        if: steps.resolve.outputs.changed == 'true'
        id: update
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.MERGE_QUEUE_TOKEN || github.token }}
          branch: update_image_builder_cli
          delete-branch: true
          commit-message: Update Image Builder CLI digest
          title: Update Image Builder CLI digest
          body: |
            Refreshes the OSBuild Image Builder CLI from its mutable discovery
            tag to the resolved immutable digest `${{ steps.resolve.outputs.digest }}`.

            The candidate runs the repository CI gate and builds and smoke-boots
            the generic installer before auto-merge is enabled.

      - name: Set up Nix and Cachix
        if: >-
          steps.update.outputs.pull-request-number != '' &&
          steps.update.outputs.pull-request-operation != 'closed'
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}

      - name: Validate and enable auto-merge
        if: >-
          steps.update.outputs.pull-request-number != '' &&
          steps.update.outputs.pull-request-operation != 'closed'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_AUTHOR: ${{ vars.AUTOMATION_UPDATE_LOGIN || 'app/github-actions' }}
          EXPECTED_BRANCH: update_image_builder_cli
          EXPECTED_TITLE: Update Image Builder CLI digest
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN || github.token }}
          PR_NUMBER: ${{ steps.update.outputs.pull-request-number }}
        run: nix run .#trusted-update
