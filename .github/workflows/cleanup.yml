name: Clean obsolete Finite package versions

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report candidates without deleting package versions
        required: true
        default: true
        type: boolean

concurrency:
  group: finite-package-cleanup
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    name: Remove versions carrying only retired tags
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: package-cleanup
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix and Cachix
        uses: ./.github/actions/setup-nix

      - name: Find and optionally delete obsolete versions
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          nix shell --accept-flake-config .#ci-package-cleanup
          -c finite-package-cleanup
