name: Build and seal production native image
on:
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      channel:
        type: string
        required: true
      force_qualification:
        type: boolean
        default: false
      resume_run:
        type: string
        default: ""
      resume_digest:
        type: string
        default: ""
      payload_artifact_id:
        type: string
        default: ""
      payload_sha256:
        type: string
        default: ""
      payload_revision:
        type: string
        default: ""
      payload_run:
        type: string
        default: ""
      payload_attempt:
        type: string
        default: ""
    outputs:
      digest:
        value: ${{ jobs.seal.outputs.digest || jobs.root.outputs.digest }}
      evidence:
        value: ${{ jobs.seal.outputs.evidence || jobs.root.outputs.evidence }}
      previous:
        value: ${{ jobs.root.outputs.previous }}
      identity:
        value: ${{ jobs.root.outputs.identity }}
      qualify:
        value: ${{ jobs.root.outputs.qualify }}
      source_revision:
        value: ${{ jobs.root.outputs.source_revision }}
env:
  FINITE_CI_VARS: ${{ toJSON(vars) }}

permissions:
  contents: read
  packages: write
  actions: read
jobs:
  root:
    uses: $/.github/workflows/image.yml
    with:
      profile: ${{ inputs.profile }}
      channel: ${{ inputs.channel }}
      publish: true
      force_qualification: ${{ inputs.force_qualification }}
      resume_run: ${{ inputs.resume_run }}
      resume_digest: ${{ inputs.resume_digest }}
      payload_artifact_id: ${{ inputs.payload_artifact_id }}
      payload_sha256: ${{ inputs.payload_sha256 }}
      payload_revision: ${{ inputs.payload_revision }}
      payload_run: ${{ inputs.payload_run }}
      payload_attempt: ${{ inputs.payload_attempt }}
  seal:
    needs: root
    if: inputs.resume_run == '' && inputs.resume_digest == ''
    uses: $/.github/workflows/boot-signing.yml
    with:
      profile: ${{ inputs.profile }}
      digest: ${{ needs.root.outputs.digest }}
      revision: ${{ needs.root.outputs.source_revision }}
      identity: ${{ needs.root.outputs.identity }}
      root_evidence: ${{ needs.root.outputs.evidence }}
