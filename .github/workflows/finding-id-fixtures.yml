name: Finding-ID scanner fixtures
on:
  pull_request:
    paths:
      - .github/workflows/build.yml
      - .github/workflows/finding-id-fixtures.yml
      - scripts/ci/finding_id_packets.py
      - scripts/ci/decision_controller.py
      - scripts/ci/decision_packets.py
      - scripts/ci/security_admission.py
      - scripts/ci/security_decisions.py
      - tests/ci/gitleaks-workflow.py
      - .github/workflows/repository-secret-history.yml
      - scripts/ci/history_scan_summary.py
      - tests/ci/history-scan-summary.py
  push:
    branches: [main]
    paths:
      - .github/workflows/build.yml
      - .github/workflows/finding-id-fixtures.yml
      - scripts/ci/finding_id_packets.py
      - scripts/ci/decision_controller.py
      - scripts/ci/decision_packets.py
      - scripts/ci/security_admission.py
      - scripts/ci/security_decisions.py
      - tests/ci/gitleaks-workflow.py
      - .github/workflows/repository-secret-history.yml
      - scripts/ci/history_scan_summary.py
      - tests/ci/history-scan-summary.py
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install fixture parser
        run: sudo apt-get update -qq && sudo apt-get install -y python3-yaml
      - name: Install checksum-pinned upstream Gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          test "$("$RUNNER_TEMP/gitleaks/gitleaks" version)" = 8.30.1
      - name: Run real scanner and byte-authentication fixtures without credentials
        run: |
          export PATH="$RUNNER_TEMP/gitleaks:$PATH"
          python3 tests/ci/gitleaks-workflow.py
          python3 tests/ci/history-scan-summary.py
