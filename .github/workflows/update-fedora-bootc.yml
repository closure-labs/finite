name: Update Fedora bootc installer base digest

on:
  schedule:
    - cron: "29 9 * * 1"
  workflow_dispatch:

concurrency:
  group: update-fedora-bootc-installer-base
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    name: Refresh and validate Fedora bootc installer base
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix and Cachix
        uses: ./.github/actions/setup-nix
        with:
          merge-queue-token: ${{ secrets.MERGE_QUEUE_TOKEN }}

      - name: Resolve latest Fedora bootc digest
        id: resolve
        run: >-
          nix shell --accept-flake-config .#ci-source-update
          -c purplefin-source-update fedora-bootc "${GITHUB_OUTPUT}"

      - name: Open or update pull request
        if: steps.resolve.outputs.changed == 'true'
        id: update
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ env.MERGE_QUEUE_TOKEN || github.token }}
          branch: update_fedora_bootc_installer_base
          delete-branch: true
          commit-message: Update Fedora bootc installer base digest
          title: Update Fedora bootc installer base digest
          body: |
            Refreshes the Fedora bootc 44 installer live environment from its
            mutable discovery tag to the resolved immutable digest
            `${{ steps.resolve.outputs.digest }}`.

            The candidate runs the repository CI gate and builds and
            smoke-boots the generic installer before auto-merge is enabled.

      - name: Validate and enable auto-merge
        if: >-
          steps.update.outputs.pull-request-number != '' &&
          steps.update.outputs.pull-request-operation != 'closed'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_AUTHOR: ${{ vars.AUTOMATION_UPDATE_LOGIN || 'app/github-actions' }}
          EXPECTED_BRANCH: update_fedora_bootc_installer_base
          EXPECTED_FILES: sources/fedora-bootc.json
          EXPECTED_TITLE: Update Fedora bootc installer base digest
          GH_TOKEN: ${{ env.MERGE_QUEUE_TOKEN || github.token }}
          PR_NUMBER: ${{ steps.update.outputs.pull-request-number }}
        run: >-
          nix shell --accept-flake-config .#ci-trusted-update
          -c purplefin-trusted-update
