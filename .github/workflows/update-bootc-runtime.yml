name: Update native bootc to an official release
on:
  schedule:
    - cron: "47 8 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-bootc-runtime
  cancel-in-progress: false
env:
  FINITE_CI_VARS: ${{ toJSON(vars) }}
jobs:
  update:
    if: github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
      - name: Select a stable release containing the upstream fix
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/update-bootc-runtime.py
      - name: Resolve updater credentials only for a qualifying release
        if: steps.resolve.outputs.changed == 'true'
        uses: $/.github/actions/setup-nix
        with:
          merge-queue-token: ${{ secrets.MERGE_QUEUE_PAT }}
          require-merge-queue-token: "true"
      - name: Propose the official release source
        if: steps.resolve.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ env.MERGE_QUEUE_TOKEN }}
          branch: automation/update-bootc-runtime
          delete-branch: true
          add-paths: sources/bootc-runtime.json
          commit-message: "sources: update native bootc to an official release"
          title: "sources: update native bootc to an official release"
          body: |
            Selects an official stable bootc release newer than 1.17.4, after
            verifying that its immutable tag commit contains the XBOOTLDR fix.
            Verifies the archive version and records its source checksum.

            Both profiles and the installer consume the same runtime source.
            Normal pull-request checks and protected review still apply.
