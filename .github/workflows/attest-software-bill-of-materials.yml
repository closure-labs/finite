name: Attest software bill of materials

on:
  workflow_call:
    inputs:
      build-input:
        required: true
        type: string
      profile:
        required: true
        type: string
      source-digest:
        required: true
        type: string
      subject-tag:
        required: true
        type: string
      upstream-base-digest:
        required: true
        type: string
      version:
        required: true
        type: string

env:
  IMAGE_REF: ghcr.io/${{ github.repository }}

jobs:
  attest:
    name: Attest software bill of materials for ${{ inputs.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix and Cachix
        uses: ./.github/actions/setup-nix

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          install -d -m 0700 "${HOME}/.docker"
          registry_auth_file="${HOME}/.docker/config.json"
          printf '%s' "${GH_TOKEN}" | podman login --authfile "${registry_auth_file}" ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
          echo "REGISTRY_AUTH_FILE=${registry_auth_file}" >>"${GITHUB_ENV}"

      - name: Resolve and verify the published image
        id: image
        env:
          BUILD_INPUT: ${{ inputs.build-input }}
          BUILD_PROFILE: ${{ inputs.profile }}
          EXPECTED_UPSTREAM_DIGEST: ${{ inputs.upstream-base-digest }}
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_REVISION: ${{ inputs.source-digest }}
          GH_TOKEN: ${{ github.token }}
          SUBJECT_TAG: ${{ inputs.subject-tag }}
        shell: bash
        run: |
          digest="$(nix shell --accept-flake-config .#ci-skopeo -c skopeo inspect \
            --retry-times 3 --format '{{.Digest}}' "docker://${IMAGE_REF}:${SUBJECT_TAG}")"
          report="${RUNNER_TEMP}/finite-image-verify.json"
          nix shell --accept-flake-config .#ci-image-verify -c finite-image-verify \
            --image "${IMAGE_REF}" --digest "${digest}" \
            --cosign-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-profile.yml@refs/heads/main" \
            --source-sha "${EXPECTED_REVISION}" \
            --provenance-workflow "${GITHUB_REPOSITORY}/.github/workflows/build-profile.yml" \
            --expect-label "io.finite.build.input=${BUILD_INPUT}" \
            --expect-label "io.finite.build.profile=${BUILD_PROFILE}" \
            --expect-label "io.finite.upstream.digest=${EXPECTED_UPSTREAM_DIGEST}" \
            --expect-label "org.opencontainers.image.revision=${EXPECTED_REVISION}" \
            --expect-label "org.opencontainers.image.version=${EXPECTED_VERSION}" >"${report}"
          nix shell --accept-flake-config .#ci-github-output \
            -c finite-github-output "${report}" >/dev/null

      - name: Restore or generate software bill of materials
        id: sbom
        env:
          GH_TOKEN: ${{ github.token }}
          SBOM_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SBOM_IMAGE_REF: ${{ env.IMAGE_REF }}
          SBOM_SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/attest-software-bill-of-materials.yml
          SBOM_SOURCE_DIGEST: ${{ inputs.source-digest }}
        shell: bash
        run: |
          set +e
          nix shell --accept-flake-config .#ci-image-sbom \
            -c finite-image-sbom extract sbom.spdx.json
          status=$?
          set -e
          case "${status}" in
            0) echo 'hit=true' >>"${GITHUB_OUTPUT}" ;;
            3)
              nix shell --accept-flake-config .#ci-image-sbom \
                -c finite-image-sbom generate sbom.spdx.json
              echo 'hit=false' >>"${GITHUB_OUTPUT}"
              ;;
            *) exit "${status}" ;;
          esac

      - name: Attest newly generated software bill of materials
        if: steps.sbom.outputs.hit != 'true'
        id: attestation
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          sbom-path: sbom.spdx.json
          subject-digest: ${{ steps.image.outputs.digest }}
          subject-name: ${{ env.IMAGE_REF }}
          subject-version: ${{ inputs.version }}

      - name: Retry software bill of materials attestation
        if: steps.sbom.outputs.hit != 'true' && steps.attestation.outcome == 'failure'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          sbom-path: sbom.spdx.json
          subject-digest: ${{ steps.image.outputs.digest }}
          subject-name: ${{ env.IMAGE_REF }}
          subject-version: ${{ inputs.version }}

      - name: Verify the published software bill of materials attestation
        if: steps.sbom.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SBOM_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SBOM_IMAGE_REF: ${{ env.IMAGE_REF }}
          SBOM_SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/attest-software-bill-of-materials.yml
          SBOM_SOURCE_DIGEST: ${{ inputs.source-digest }}
        shell: bash
        run: |
          nix shell --accept-flake-config .#ci-image-verify -c finite-image-verify \
            --image "${IMAGE_REF}" --digest "${SBOM_IMAGE_DIGEST}" \
            --cosign-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-profile.yml@refs/heads/main" \
            --source-sha "${SBOM_SOURCE_DIGEST}" \
            --sbom-workflow "${SBOM_SIGNER_WORKFLOW}" >/dev/null
          nix shell --accept-flake-config .#ci-image-sbom \
            -c finite-image-sbom extract verified-sbom.spdx.json
          nix shell --accept-flake-config .#ci-image-sbom \
            -c finite-image-sbom equivalent sbom.spdx.json verified-sbom.spdx.json

      - name: Clean up
        if: always()
        shell: bash
        run: |
          rm -f -- sbom.spdx.json verified-sbom.spdx.json
          podman logout --authfile "${REGISTRY_AUTH_FILE:-${HOME}/.docker/config.json}" ghcr.io || true
