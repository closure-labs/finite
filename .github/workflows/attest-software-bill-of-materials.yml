name: Attest software bill of materials

on:
  workflow_call:
    inputs:
      build-input:
        required: true
        type: string
      profile:
        required: true
        type: string
      source-digest:
        required: true
        type: string
      subject-tag:
        required: true
        type: string
      upstream-base-digest:
        required: true
        type: string
      version:
        required: true
        type: string

env:
  IMAGE_REF: ghcr.io/${{ github.repository }}

jobs:
  attest:
    name: Attest software bill of materials for ${{ inputs.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix and Cachix
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}
          toolset: workflow-sbom

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          install -d -m 0700 "${HOME}/.docker"
          registry_auth_file="${HOME}/.docker/config.json"
          printf '%s' "${GH_TOKEN}" | podman login --authfile "${registry_auth_file}" ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
          echo "REGISTRY_AUTH_FILE=${registry_auth_file}" >>"${GITHUB_ENV}"

      - name: Resolve and verify the published image
        id: image
        env:
          BUILD_INPUT: ${{ inputs.build-input }}
          BUILD_PROFILE: ${{ inputs.profile }}
          EXPECTED_UPSTREAM_DIGEST: ${{ inputs.upstream-base-digest }}
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_REVISION: ${{ inputs.source-digest }}
          GH_TOKEN: ${{ github.token }}
          SUBJECT_TAG: ${{ inputs.subject-tag }}
        shell: bash
        run: |
          metadata="$(skopeo inspect --retry-times 3 "docker://${IMAGE_REF}:${SUBJECT_TAG}")"
          digest="$(jq -er '.Digest' <<<"${metadata}")"
          jq -e --arg build_input "${BUILD_INPUT}" --arg profile "${BUILD_PROFILE}" \
            --arg revision "${EXPECTED_REVISION}" --arg upstream_digest "${EXPECTED_UPSTREAM_DIGEST}" \
            --arg version "${EXPECTED_VERSION}" '
              .Labels["io.purplefin.build.input"] == $build_input and
              .Labels["io.purplefin.build.profile"] == $profile and
              .Labels["io.purplefin.upstream.digest"] == $upstream_digest and
              .Labels["org.opencontainers.image.revision"] == $revision and
              .Labels["org.opencontainers.image.version"] == $version
            ' <<<"${metadata}" >/dev/null
          cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-profile.yml@refs/heads/main" \
            "${IMAGE_REF}@${digest}" >/dev/null
          gh attestation verify "oci://${IMAGE_REF}@${digest}" \
            --bundle-from-oci --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/build-profile.yml" \
            --source-digest "${EXPECTED_REVISION}" \
            --predicate-type https://slsa.dev/provenance/v1 >/dev/null
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"

      - name: Restore or generate software bill of materials
        id: sbom
        env:
          GH_TOKEN: ${{ github.token }}
          SBOM_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SBOM_IMAGE_REF: ${{ env.IMAGE_REF }}
          SBOM_SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/attest-software-bill-of-materials.yml
          SBOM_SOURCE_DIGEST: ${{ inputs.source-digest }}
        shell: bash
        run: |
          set +e
          purplefin-image-sbom extract sbom.spdx.json
          status=$?
          set -e
          case "${status}" in
            0) echo 'hit=true' >>"${GITHUB_OUTPUT}" ;;
            3) purplefin-image-sbom generate sbom.spdx.json; echo 'hit=false' >>"${GITHUB_OUTPUT}" ;;
            *) exit "${status}" ;;
          esac

      - name: Attest newly generated software bill of materials
        if: steps.sbom.outputs.hit != 'true'
        id: attestation
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          sbom-path: sbom.spdx.json
          subject-digest: ${{ steps.image.outputs.digest }}
          subject-name: ${{ env.IMAGE_REF }}
          subject-version: ${{ inputs.version }}

      - name: Retry software bill of materials attestation
        if: steps.sbom.outputs.hit != 'true' && steps.attestation.outcome == 'failure'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          sbom-path: sbom.spdx.json
          subject-digest: ${{ steps.image.outputs.digest }}
          subject-name: ${{ env.IMAGE_REF }}
          subject-version: ${{ inputs.version }}

      - name: Verify the published software bill of materials attestation
        if: steps.sbom.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SBOM_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SBOM_IMAGE_REF: ${{ env.IMAGE_REF }}
          SBOM_SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/attest-software-bill-of-materials.yml
          SBOM_SOURCE_DIGEST: ${{ inputs.source-digest }}
        shell: bash
        run: |
          for _ in {1..6}; do
            if purplefin-image-sbom extract verified-sbom.spdx.json &&
              purplefin-image-sbom equivalent sbom.spdx.json verified-sbom.spdx.json; then
              exit 0
            fi
            sleep 5
          done
          echo 'The published software bill of materials attestation could not be verified' >&2
          exit 1

      - name: Clean up
        if: always()
        shell: bash
        run: |
          rm -f -- sbom.spdx.json verified-sbom.spdx.json
          podman logout --authfile "${REGISTRY_AUTH_FILE:-${HOME}/.docker/config.json}" ghcr.io || true
