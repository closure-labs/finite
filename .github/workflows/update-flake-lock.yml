name: Update Nix flake inputs

on:
  schedule:
    - cron: "31 9 * * 1"
  workflow_dispatch:

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    name: Refresh every locked input
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix and Cachix
        uses: ./.github/actions/setup-nix
        with:
          merge-queue-token: ${{ secrets.MERGE_QUEUE_TOKEN }}
          require-merge-queue-token: "true"

      - name: Update the Flake and devenv locks
        id: source
        run: >-
          nix shell --accept-flake-config .#ci-update-locks
          -c finite-update-locks "${GITHUB_OUTPUT}"

      - name: Validate synchronized locks
        if: steps.source.outputs.changed == 'true'
        run: >-
          nix shell --accept-flake-config .#ci-lock-validate
          -c finite-ci-validate-locks

      - name: Open or update pull request
        if: steps.source.outputs.changed == 'true'
        id: update
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ env.MERGE_QUEUE_TOKEN }}
          base: main
          branch: automation/weekly-flake-input-refresh
          delete-branch: true
          commit-message: "locks: refresh Nix and devenv inputs"
          title: "locks: refresh Nix and devenv inputs"
          body: |
            Automated weekly refresh of the Flake and devenv inputs.

            Required validation and protected-branch policy still apply.

      - name: Validate and enable auto-merge
        if: >-
          steps.update.outputs.pull-request-number != '' &&
          steps.update.outputs.pull-request-operation != 'closed'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_AUTHOR: ${{ vars.AUTOMATION_UPDATE_LOGIN || 'app/github-actions' }}
          EXPECTED_BRANCH: automation/weekly-flake-input-refresh
          EXPECTED_FILES: flake.lock,devenv.lock
          EXPECTED_TITLE: "locks: refresh Nix and devenv inputs"
          GH_TOKEN: ${{ env.MERGE_QUEUE_TOKEN }}
          PR_NUMBER: ${{ steps.update.outputs.pull-request-number }}
        run: >-
          nix shell --accept-flake-config .#ci-trusted-update
          -c finite-trusted-update
