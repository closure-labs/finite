name: Update Nix flake inputs

on:
  schedule:
    - cron: "31 9 * * 1"
  workflow_dispatch:

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    name: Refresh every locked input
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix and Cachix
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}
          toolset: workflow-maintenance

      - name: Update the Flake lock
        id: source
        run: purplefin-source-update flake "${GITHUB_OUTPUT}"

      - name: Open or update pull request
        if: steps.source.outputs.changed == 'true'
        id: update
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.MERGE_QUEUE_TOKEN || github.token }}
          base: main
          branch: automation/weekly-flake-input-refresh
          delete-branch: true
          commit-message: "flake.lock: refresh all inputs"
          title: "flake.lock: refresh all inputs"
          body: |
            Automated weekly refresh of every locked flake input.

            Required validation and protected-branch policy still apply.

      - name: Validate and enable auto-merge
        if: >-
          steps.update.outputs.pull-request-number != '' &&
          steps.update.outputs.pull-request-operation != 'closed'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_AUTHOR: ${{ vars.AUTOMATION_UPDATE_LOGIN || 'app/github-actions' }}
          EXPECTED_BRANCH: automation/weekly-flake-input-refresh
          EXPECTED_TITLE: "flake.lock: refresh all inputs"
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN || github.token }}
          PR_NUMBER: ${{ steps.update.outputs.pull-request-number }}
        run: purplefin-trusted-update
