name: Audit repository security policy

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finite-repository-security-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check audit App configuration
        env:
          SECAUDIT_CLIENTID: ${{ vars.SECAUDIT_CLIENTID }}
          SECAUDIT_PEM: ${{ secrets.SECAUDIT_PEM }}
        run: |
          [[ -n "$SECAUDIT_CLIENTID" ]] || {
            echo "::error::SECAUDIT_CLIENTID is not available to this repository"
            exit 1
          }
          [[ -n "$SECAUDIT_PEM" ]] || {
            echo "::error::SECAUDIT_PEM is not available to this repository"
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: Generate repository-scoped audit token
        id: audit-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SECAUDIT_CLIENTID }}
          private-key: ${{ secrets.SECAUDIT_PEM }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
      - name: Compare live settings with reviewed policy
        env:
          GH_TOKEN: ${{ steps.audit-token.outputs.token }}
        run: |
          set -o pipefail
          nix shell --file lib/ci-tools.nix ci-repository-security-audit -c finite-repository-security-audit \
            --repository "$GITHUB_REPOSITORY" | tee repository-security-audit.json
      - name: Save audit result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: repository-security-audit.json
          retention-days: 30
