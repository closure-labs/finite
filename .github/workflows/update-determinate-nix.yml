name: Update Determinate Nix

on:
  schedule:
    - cron: "29 9 * * 1"
  workflow_dispatch:

concurrency:
  group: update-determinate-nix
  cancel-in-progress: false

# Bootstrap public options; setup-nix resolves them through SecretSpec.
env:
  FINITE_OPTIMIZED_CACHES: ${{ vars.FINITE_OPTIMIZED_CACHES }}
  FINITE_CACHIX_WRITER: ${{ vars.FINITE_CACHIX_WRITER }}
  FINITE_REUSE_INVENTORY: ${{ vars.FINITE_REUSE_INVENTORY }}
  FINITE_GRYPE_DB_CACHE: ${{ vars.FINITE_GRYPE_DB_CACHE }}
  FINITE_QUALIFICATION_REUSE: ${{ vars.FINITE_QUALIFICATION_REUSE }}
  FINITE_QUALIFIED_ISO_PRESERVATION: ${{ vars.FINITE_QUALIFIED_ISO_PRESERVATION }}
  FINITE_QUALIFIED_ISO_CHANNELS: ${{ vars.FINITE_QUALIFIED_ISO_CHANNELS }}

permissions:
  contents: read

jobs:
  update:
    name: Refresh and validate Determinate Nix
    if: github.repository == 'closure-labs/finite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix and Cachix
        uses: $/.github/actions/setup-nix

      - name: Prepare trusted updater tools before changing sources
        id: updater-tools
        run: |
          update=$(nix build --file lib/ci-tools.nix ci-source-update --no-link --print-out-paths)
          [[ $update =~ ^/nix/store/[a-z0-9]{32}-finite-source-update$ ]]
          public=$(nix build --file lib/ci-tools.nix image-tools --no-link --print-out-paths)
          [[ $public =~ ^/nix/store/[a-z0-9]{32}-finite-ci-image-tools$ ]]
          queue=$(nix build --file lib/ci-tools.nix ci-trusted-update --no-link --print-out-paths)
          [[ $queue =~ ^/nix/store/[a-z0-9]{32}-finite-trusted-update$ ]]
          mapper=$(nix build --file lib/ci-tools.nix ci-github-actions-secrets --no-link --print-out-paths)
          [[ $mapper =~ ^/nix/store/[a-z0-9]{32}-finite-github-actions-secrets$ ]]
          printf 'update=%s\npublic=%s\nqueue=%s\nmapper=%s\n' \
            "$update" "$public" "$queue" "$mapper" >>"$GITHUB_OUTPUT"

      - name: Resolve latest Determinate Nix release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_TOOL: ${{ steps.updater-tools.outputs.update }}
        run: '"${UPDATE_TOOL}/bin/finite-source-update" determinate-nix "$GITHUB_OUTPUT"'

      - name: Validate generated text
        if: steps.resolve.outputs.changed == 'true'
        env:
          PUBLIC_TOOLS: ${{ steps.updater-tools.outputs.public }}
        run: PATH="${PUBLIC_TOOLS}/bin:$PATH" bash tests/repository/text-style.sh

      - name: Resolve queue credential after public source validation
        if: steps.resolve.outputs.changed == 'true'
        id: queue-credentials
        env:
          CREDENTIAL_MAPPER: ${{ steps.updater-tools.outputs.mapper }}
          GITHUB_ACTIONS_MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_PAT }}
        run: |
          [[ -n "$GITHUB_ACTIONS_MERGE_QUEUE_TOKEN" ]] || {
            echo "::error::MERGE_QUEUE_TOKEN is required for protected-branch automation"
            exit 1
          }
          "${CREDENTIAL_MAPPER}/bin/finite-github-actions-secrets"

      - name: Open or update pull request
        if: steps.resolve.outputs.changed == 'true'
        id: update
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ env.MERGE_QUEUE_TOKEN }}
          branch: automation/update-determinate-nix
          delete-branch: true
          commit-message: "sources: update Determinate Nix"
          title: "sources: update Determinate Nix"
          body: |
            Refreshes the pinned Determinate Nix installer and SELinux policy
            from the latest stable upstream release.

            The candidate validates the repository and both active recipes
            before auto-merge is enabled.

      - name: Validate and enable auto-merge
        if: >-
          steps.update.outputs.pull-request-number != '' &&
          steps.update.outputs.pull-request-operation != 'closed'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_AUTHOR: ${{ vars.AUTOMATION_UPDATE_LOGIN || 'app/github-actions' }}
          EXPECTED_BRANCH: automation/update-determinate-nix
          EXPECTED_FILES: sources/determinate-nix.json
          EXPECTED_TITLE: "sources: update Determinate Nix"
          GH_TOKEN: ${{ env.MERGE_QUEUE_TOKEN }}
          PR_NUMBER: ${{ steps.update.outputs.pull-request-number }}
          QUEUE_TOOL: ${{ steps.updater-tools.outputs.queue }}
        run: '"${QUEUE_TOOL}/bin/finite-trusted-update"'

      - name: Clear queue credential
        if: always() && steps.queue-credentials.outcome != 'skipped'
        run: | # zizmor: ignore[github-env]
          printf 'MERGE_QUEUE_TOKEN=\n' >>"$GITHUB_ENV"
