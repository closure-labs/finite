# SPDX-License-Identifier: CC0-1.0
#
# Baseline tuning for the OV02C10 module in the Dell XPS 13 9350.
# The 10-bit sensor has a 0x40 pedestal, represented in libcamera's
# 16-bit tuning scale as 4096. The CCM corrects the green bias observed
# when the Simple pipeline uses its identity-matrix fallback.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Ccm:
      ccms:
        - ct: 6500
          ccm: [ 1.0, 0.0, 0.0,
                 0.0, 0.9, 0.0,
                 0.0, 0.0, 1.0 ]
  - Adjust:
  - Agc:
...
