[project]
name = "purplefin"
revision = "1.0"
require_reason = "agents"

[providers]
github-actions = "env"
local = "env"

[profiles.default]
CACHIX_AUTH_TOKEN = { description = "Cachix write token; local runs read the workstation-owned token file only when the environment does not already provide it", required = false, providers = ["local"] }

[profiles.local-cache]
CACHIX_AUTH_TOKEN = { required = true, providers = ["local"] }

[profiles.github-actions]
CACHIX_AUTH_TOKEN = { description = "Cachix proof-cache write token supplied by GitHub Actions", required = false, providers = ["github-actions"], ref = { item = "GITHUB_ACTIONS_CACHIX_AUTH_TOKEN" } }
MERGE_QUEUE_TOKEN = { description = "Token allowed to create and enqueue trusted update pull requests", required = false, providers = ["github-actions"], ref = { item = "GITHUB_ACTIONS_MERGE_QUEUE_TOKEN" } }

[scopes.cachix]
secrets = ["CACHIX_AUTH_TOKEN"]

[scopes.github-actions]
secrets = ["CACHIX_AUTH_TOKEN", "MERGE_QUEUE_TOKEN"]
