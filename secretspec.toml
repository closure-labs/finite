# SecretSpec >= 0.19. GitHub supplies env values; local tasks use encrypted pass.
# pass entries: secretspec/finite/PROFILE/KEY (same profile/key names in CI).
[project]
name = "finite"
revision = "1.0"
require_reason = "agents"

[providers]
github-actions = "env"
local = "pass://"

# The interactive developer environment never resolves signing or GitHub keys.
[profiles.default]
CACHIX_AUTH_TOKEN = { description = "Optional local Finite Cachix credential", required = false, providers = ["local", "pass"] }
FINITE_OPTIMIZED_CACHES = { description = "Enable measured optimized Nix cache lanes", required = false, default = "false" }
FINITE_CACHIX_WRITER = { description = "Enable the trusted Cachix writer pilot", required = false, default = "false" }
FINITE_REUSE_INVENTORY = { description = "Enable authenticated native inventory reuse", required = false, default = "false" }
FINITE_GRYPE_DB_CACHE = { description = "Enable Grype database transport cache", required = false, default = "false" }
FINITE_QUALIFICATION_REUSE = { description = "Enable exact qualification reuse within 24 hours", required = false, default = "false" }
FINITE_QUALIFIED_ISO_PRESERVATION = { description = "Preserve exact pristine qualified ISO bytes", required = false, default = "false" }
FINITE_QUALIFIED_ISO_CHANNELS = { description = "ISO preservation channel allowlist; comma separated supported channels or all", required = false, default = "finite" }

[profiles.local-cache.defaults]
inherit = false
[profiles.local-cache]
CACHIX_AUTH_TOKEN = { description = "Local proof-cache write credential", required = true }

# GitHub workflows map repository-available MERGE_QUEUE_PAT to the stable
# MERGE_QUEUE_TOKEN profile key; existing local pass entries keep that key.
# Keep legacy updater mappings until their action callers migrate.
[profiles.github-actions.defaults]
inherit = false
[profiles.github-actions]
CACHIX_AUTH_TOKEN = { description = "Legacy Cachix credential supplied by GitHub Actions", required = false, providers = ["github-actions"], ref = { item = "GITHUB_ACTIONS_CACHIX_AUTH_TOKEN" } }
MERGE_QUEUE_TOKEN = { description = "Legacy trusted updater token supplied by GitHub Actions", required = false, providers = ["github-actions"], ref = { item = "GITHUB_ACTIONS_MERGE_QUEUE_TOKEN" } }

[profiles.ci-options.defaults]
inherit = false
[profiles.ci-options]
FINITE_OPTIMIZED_CACHES = { description = "Enable measured optimized Nix cache lanes", required = false, default = "false" }
FINITE_CACHIX_WRITER = { description = "Enable the trusted Cachix writer pilot", required = false, default = "false" }
FINITE_REUSE_INVENTORY = { description = "Enable authenticated native inventory reuse", required = false, default = "false" }
FINITE_GRYPE_DB_CACHE = { description = "Enable Grype database transport cache", required = false, default = "false" }
FINITE_QUALIFICATION_REUSE = { description = "Enable exact qualification reuse within 24 hours", required = false, default = "false" }
FINITE_QUALIFIED_ISO_PRESERVATION = { description = "Preserve exact pristine qualified ISO bytes", required = false, default = "false" }
FINITE_QUALIFIED_ISO_CHANNELS = { description = "ISO preservation channel allowlist; comma separated supported channels or all", required = false, default = "finite" }

[profiles.cache-writer.defaults]
inherit = false
[profiles.cache-writer]
CACHIX_AUTH_TOKEN = { description = "Allowlisted Finite proof/tool Cachix writer credential", required = true }

[profiles.image-signing.defaults]
inherit = false
[profiles.image-signing]
COSIGN_PRIVATE_KEY = { description = "Cosign image signing key; delivered only to the signer", required = true }
COSIGN_PASSWORD = { description = "Password for an encrypted Cosign signing key", required = false, default = "" }
GH_TOKEN = { description = "Optional read token for signing provenance", required = false }
REGISTRY_TOKEN = { description = "Optional registry write token for publishing image signatures", required = false }

[profiles.release-signing.defaults]
inherit = false
[profiles.release-signing]
COSIGN_PRIVATE_KEY = { description = "Cosign release checksum signing key", required = true }
COSIGN_PASSWORD = { description = "Password for an encrypted Cosign signing key", required = false, default = "" }

[profiles.release-publishing.defaults]
inherit = false
[profiles.release-publishing]
MERGE_QUEUE_TOKEN = { description = "Repository credential with Contents and Workflows write for exact-source release tags and drafts", required = true }
GH_TOKEN = { description = "GitHub CLI view of the scoped release publishing credential", composed = "${MERGE_QUEUE_TOKEN}" }

[profiles.repository-audit.defaults]
inherit = false
[profiles.repository-audit]
SECAUDIT_CLIENTID = { description = "Client ID of the repository security audit GitHub App", required = true }
SECAUDIT_PEM = { description = "Private key of the read-only repository security audit GitHub App", required = true }
GH_TOKEN = { description = "Optional repository-scoped audit read token", required = false }

[profiles.repository-read.defaults]
inherit = false
[profiles.repository-read]
GH_TOKEN = { description = "Read-only GitHub token for immutable evidence and metadata", required = true }

[profiles.updater.defaults]
inherit = false
[profiles.updater]
MERGE_QUEUE_TOKEN = { description = "Trusted updater credential for creating and queueing protected-branch pull requests", required = true }
GH_TOKEN = { description = "GitHub CLI view of the scoped updater credential", composed = "${MERGE_QUEUE_TOKEN}" }

[scopes.cachix]
secrets = ["CACHIX_AUTH_TOKEN"]
[scopes.github-actions]
secrets = ["CACHIX_AUTH_TOKEN", "MERGE_QUEUE_TOKEN"]
[scopes.ci-options]
secrets = ["FINITE_OPTIMIZED_CACHES", "FINITE_CACHIX_WRITER", "FINITE_REUSE_INVENTORY", "FINITE_GRYPE_DB_CACHE", "FINITE_QUALIFICATION_REUSE", "FINITE_QUALIFIED_ISO_PRESERVATION", "FINITE_QUALIFIED_ISO_CHANNELS"]
[scopes.cache-writer]
secrets = ["CACHIX_AUTH_TOKEN"]
[scopes.image-signing]
secrets = ["COSIGN_PRIVATE_KEY", "COSIGN_PASSWORD", "GH_TOKEN", "REGISTRY_TOKEN"]
[scopes.release-signing]
secrets = ["COSIGN_PRIVATE_KEY", "COSIGN_PASSWORD"]
[scopes.release-publishing]
secrets = ["MERGE_QUEUE_TOKEN", "GH_TOKEN"]
[scopes.repository-audit]
secrets = ["SECAUDIT_CLIENTID", "SECAUDIT_PEM", "GH_TOKEN"]
[scopes.repository-read]
secrets = ["GH_TOKEN"]
[scopes.updater]
secrets = ["MERGE_QUEUE_TOKEN", "GH_TOKEN"]

# Only trusted default-branch authority jobs resolve this App key.
[profiles.review-app.defaults]
inherit = false
[profiles.review-app]
FINITE_REVIEW_CLIENT_ID = { description = "Client ID of the repository-scoped maintainer decision App", required = true }
FINITE_REVIEW_PRIVATE_KEY = { description = "Private key of the maintainer decision App", required = true }

[scopes.review-app]
secrets = ["FINITE_REVIEW_CLIENT_ID", "FINITE_REVIEW_PRIVATE_KEY"]

# Separate read-only human authority from the existing Workflows-capable PAT.
[profiles.release-set-publishing.defaults]
inherit = false
[profiles.release-set-publishing]
GH_TOKEN = { description = "Read-only repository App token for current human decision authority", required = true }
RELEASE_PUBLISH_TOKEN = { description = "Existing release PAT with Contents and Workflows write for approved historical source tags", required = true }

[scopes.release-set-publishing]
secrets = ["GH_TOKEN", "RELEASE_PUBLISH_TOKEN"]
