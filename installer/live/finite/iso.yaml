label: FINITE_LIVE
kernel_args:
  - root=live:LABEL=FINITE_LIVE
  - rd.live.image
  - rd.live.overlay.overlayfs=1
  - enforcing=0
  - console=tty0
  - console=ttyS0,115200n8
grub2:
  default: 0
  timeout: 10
  entries:
    - name: Install Finite
      # Image Builder does not append kernel_args to custom GRUB entries.
      linux: /images/pxeboot/vmlinuz root=live:LABEL=FINITE_LIVE rd.live.image rd.live.overlay.overlayfs=1 enforcing=0 console=tty0 console=ttyS0,115200n8
      initrd: /images/pxeboot/initrd.img
